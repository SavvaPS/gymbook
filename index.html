 'dips':['Chest, triceps and front shoulders','Start supported on parallel bars, arms locked, shoulders down|Lean slightly forward and lower until shoulders are just below elbows|Keep elbows pointing back, not out|Press to locked arms and push the shoulders down','Shrugging the shoulders up to the ears at the bottom'],
 'straight-bar-dip':['Chest, triceps and front shoulders, for muscle-ups','Support on top of a straight bar, hands shoulder width|Lean forward and let your legs come slightly in front of the bar|Lower until the bar is near your chest|Press back up to straight arms','Hanging back from the bar, which makes the rep stall halfway'],
 'ring-dip':['Chest, triceps and shoulder stabilisers','Start in a ring support, arms locked, rings by your hips|Lower with the rings close to your body until shoulders are below elbows|Press up and turn the rings out at the top|Keep the rings from drifting forward','Letting the rings wander out to the sides'],
 'pike-pushup':['Shoulders and triceps, for handstand push-ups','Hands on the floor, hips high in an upside-down V|Walk your feet in so your hips are over your hands as much as you can|Lower the top of your head to a spot in front of your hands|Press back to straight arms','Lowering straight down, which turns it into a push-up. Head goes forward of the hands'],
 'elevated-pike':['Shoulders and triceps, for handstand push-ups','Feet on a box or bench, hips stacked over your hands|Make a tripod: head lands a little in front of your hands|Elbows stay over the wrists, not flaring wide|Press until arms lock and shoulders reach the ears','Letting the hips drift back so the shoulders do less work'],
 'wall-hspu':['Shoulders and triceps','Kick up into a handstand facing away from the wall, hands a palm from it|Lower your head to a point forming a triangle with your hands|Keep your elbows from flaring past 45°|Press back to locked arms','Arching the lower back against the wall'],
 'hspu':['Shoulders, triceps and balance','Hold a freestanding handstand|Lower your head forward in a tripod, keeping balance with your fingers|Press back up while the legs stay stacked|Bail with a cartwheel if you tip over','Losing the line by piking or arching as you lower'],
 'ring-y':['Lower traps and rear shoulders','Hold the rings or straps, lean back with straight arms|Raise your arms up and out into a Y, keeping them straight|Pull your body up to the rings with that motion|Lower slowly','Bending the arms to turn it into a row'],
 'prone-ytw':['Upper back and rear shoulders','Lie face down, forehead on a towel|Lift straight arms up into a Y, thumbs up, then lower|Repeat out to the sides as a T, then bend elbows and pull back into a W|Keep the neck relaxed and ribs down','Shrugging or lifting the head'],
 'wall-walk':['Shoulders, core and handstand confidence','Start in a push-up with feet against the wall|Walk your feet up the wall while walking your hands back|Go as close to the wall as you can control|Walk back down the same way','Letting the lower back sag. Keep the ribs pulled in'],
 'wall-handstand':['Shoulders, core and balance','Chest to the wall: walk up until your nose is near the wall|Push the floor away so your shoulders are by your ears|Squeeze glutes and point toes so your body is one straight line|Breathe and hold; walk down when your form slips','A banana-shaped back. Tuck the ribs and squeeze the glutes'],
 'handstand':['Shoulders, core and balance','Kick up with straight arms, hands shoulder width, fingers spread|Push tall through your shoulders and stack hips over hands|Balance with your fingertips (falling forward) and the heels of your hands (falling back)|Bail by turning one hand and cartwheeling out','Looking far forward and arching the back'],
 'crow':['Wrists, shoulders and balance','Squat with hands flat, shoulder width, fingers spread|Rest your knees on the backs of your upper arms|Lean forward until your feet float|Look slightly ahead and hold','Not leaning far enough, so the feet never leave the floor'],
 'planche-lean':['Front shoulders, wrists and straight-arm strength','Push-up position with fingers turned out or back|Lock your elbows and spread your shoulder blades|Lean your shoulders forward past your hands as far as you can hold|Keep the body straight and hold','Bending the arms or letting the shoulder blades pinch together'],
 'tuck-planche':['Front shoulders, wrists and core','Hands by your hips, arms locked, fingers turned slightly out|Lean forward and pull your knees tight into your chest|Round your upper back and push the floor away|Hips up at about shoulder height and hold','Bent elbows. Locked arms are the whole point'],
 'adv-tuck-planche':['Front shoulders, wrists and core','From a tuck planche, open your hips so your back is flat|Knees stay bent and below the hips|Lean further forward to balance the longer lever|Keep shoulders spread and arms locked','Leaving the back rounded, which keeps it a normal tuck'],
 'straddle-planche':['Front shoulders, wrists, core and glutes','From an advanced tuck, extend your legs wide apart|Hips at shoulder height, legs straight and toes pointed|Lean further forward to stay balanced|Push the floor away the whole hold','Hips dropping below the shoulders'],
 'full-planche':['Front shoulders, wrists and full-body tension','Legs together and straight, body parallel to the floor|Lean far enough forward that your hips balance over your hands|Arms locked, shoulder blades spread, glutes squeezed|Hold the line from head to heels','Piking the hips up or bending the arms'],
 'superman':['Lower back, glutes and upper back','Lie face down, arms overhead|Lift arms, chest and legs a few centimetres off the floor|Squeeze glutes and keep the neck long|Hold briefly, then lower','Cranking the head up to look forward'],
 'arch-hold':['Lower back, glutes and upper back','Lie face down, arms overhead|Lift arms, chest and legs, squeezing glutes|Keep your arms straight and by your ears|Hold the shape and breathe','Bending the knees to get the legs higher'],
 'ring-row':['Upper back, lats and biceps','Hold the rings, walk your feet forward and lean back|Body straight from head to heels|Pull your chest to your hands, elbows close to your body|Lower to straight arms','Hips sagging so only the arms move'],
 'archer-row':['Upper back and lats, one side at a time','Lean back holding the rings or a bar, arms wide|Pull towards one hand while the other arm stays straight and out|Squeeze that shoulder blade back|Lower and alternate','Bending both arms evenly'],
 'fl-row':['Lats, upper back and core','Hold a tuck front lever under the bar|Pull the bar towards your hips while staying horizontal|Keep the arms close and the back flat|Lower under control to straight arms','Dropping the hips as you pull'],
 'neg-pullup':['Lats, upper back and biceps','Jump or step up so your chin is over the bar|Lower yourself slowly for 3 to 5 seconds|Keep the shoulders down and the body still|Go all the way to straight arms','Dropping fast through the bottom half'],
 'pullup':['Lats, upper back and biceps','Overhand grip just wider than shoulders, start from a dead hang|Pull the shoulders down first, then drive the elbows towards your ribs|Bring your chin over the bar|Lower all the way to straight arms','Kipping or half reps that never reach full hang'],
 'chinup':['Lats and biceps','Underhand grip about shoulder width|Start from straight arms, shoulders pulled down|Pull until your chin passes the bar|Lower under control to a full hang','Craning the neck to get the chin over'],
 'wide-pullup':['Lats and upper back','Overhand grip about one and a half shoulder widths|Pull your chest towards the bar, elbows down and out|Keep shoulders away from your ears|Lower fully each rep','Going so wide the range becomes tiny'],
 'ring-pullup':['Lats, biceps and grip','Start from a dead hang, palms facing forward|Pull and let the rings turn so your palms face you at the top|Bring the rings to your chest|Lower to straight arms','Swinging. Keep the body still'],
 'c2b-pullup':['Lats and upper back, for muscle-ups','Grip just wider than shoulders|Pull with your elbows driving down and back|Touch your chest (not chin) to the bar|Lower to a full hang','Leaning back so far it turns into a row'],
 'lsit-pullup':['Lats, biceps and core','Hang and lift your straight legs to hip height|Hold the L as you pull up to the bar|Lower without letting the legs drop|Bend the knees if straight legs are too hard','Legs sinking as you pull'],
 'typewriter':['Lats and biceps, one side biased','Pull up with a wide grip until your chin is over the bar|Slide across towards one hand, straightening the other arm|Slide back to the other side|Lower from the centre','Dropping below the bar while moving across'],
 'archer-pullup':['Lats and biceps, one side at a time','Wide grip, pull towards one hand|Keep the other arm nearly straight along the bar|Chin over that hand at the top|Lower and alternate','Pulling with both arms equally'],
 'one-arm-pullup':['Lats, biceps and grip, one side','Start from a dead hang on one arm, other hand by your side|Pull your shoulder down first, then pull up with the elbow tight to you|Keep the body from spinning|Lower all the way under control','Swinging or kipping to get the chin up'],
 'explosive-pullup':['Lats and upper back, power, for muscle-ups','From a dead hang, pull as fast and high as you can|Aim to get your chest or waist to the bar|Keep the body hollow and legs together|Lower under control','Swinging the legs to make up the height'],
 'jump-muscle-up':['Pulling and pushing, transition practice','Stand under a low bar and jump into a high pull|Lean your chest over the bar and turn the wrists over|Press up to straight arms on top|Step down, do not drop','Not leaning far enough over the bar to get through'],
 'neg-muscle-up':['Lats, chest and triceps, through the transition','Start on top of the bar with straight arms|Lower slowly into the bottom of a dip|Roll back through the transition, keeping the bar close|Finish in a dead hang','Dropping through the transition instead of controlling it'],
 'muscle-up':['Lats, chest and triceps','Use a slightly false grip, hands shoulder width|Pull explosively to your waist, leaning your chest over the bar|Turn the wrists over fast and press out of the dip|Lower under control','Chicken-winging, getting one elbow over before the other'],
 'ring-muscle-up':['Lats, chest, triceps and stabilisers','Use a false grip (wrist on top of the ring)|Pull rings to your ribs, keeping them close|Lean forward and roll through into a deep dip|Press out to a ring support','Losing the false grip, which makes the transition near impossible'],
 'tuck-fl':['Lats, core and straight-arm strength','Hang with straight arms, then pull the bar down towards your hips|Tuck knees to chest and lift until your back is level with the floor|Arms stay locked, shoulders pulled down|Hold, then lower','Bent arms or hips sitting below the shoulders'],
 'adv-tuck-fl':['Lats, core and straight-arm strength','From a tuck front lever, open your hips so your back is flat|Knees bent at about 90°|Press the bar towards your hips to stay level|Hold with locked arms','Back rounding up again as you tire'],
 'one-leg-fl':['Lats, core and straight-arm strength','From an advanced tuck, extend one leg straight|Keep the other knee tucked|Hips stay level with your shoulders|Alternate the straight leg each set','Hips dropping when the leg straightens'],
 'straddle-fl':['Lats, core and straight-arm strength','Straight legs spread wide, body level with the floor|Arms locked, pressing the bar towards your hips|Squeeze glutes and point toes|Hold, then lower','Piking at the hips'],
 'front-lever':['Lats, core and full-body tension','Legs together and straight, body level with the floor|Arms locked, shoulders pulled down and back|Squeeze glutes and brace your stomach|Hold the straight line','Bent arms or sagging hips'],
 'skin-cat':['Shoulders, lats and core','Hang from rings or a bar, tuck your knees|Roll backwards through your arms until your feet point at the floor|Go only as far as your shoulders allow|Roll back slowly the same way','Dropping into the bottom too quickly. Control it'],
 'german-hang':['Shoulder mobility for back lever and skin the cat','From a skin the cat, lower until your feet point down behind you|Relax into the stretch in the front of your shoulders|Hold briefly, then roll back up|Build time slowly','Jumping into a long hold before the shoulders are ready'],
 'tuck-bl':['Biceps, chest, shoulders and core','From a German hang, tuck tight and lift until your back is level|Arms locked, hands just wider than shoulders|Keep the knees pulled in|Hold, then roll back out','Bent arms, which strains the elbows'],
 'adv-tuck-bl':['Biceps, chest, shoulders and core','From a tuck back lever, open your hips so your back is flat|Knees bent|Stay level with the floor|Hold with locked arms','Hips piking upwards'],
 'straddle-bl':['Biceps, chest, shoulders and core','Straight legs spread wide, body level|Arms locked, shoulders pressing down|Squeeze glutes and point toes|Hold, then roll out','Letting the hips drop'],
 'back-lever':['Biceps, chest, shoulders and full-body tension','Body straight and level, face down, under the bar|Arms locked, hands just wider than shoulders|Squeeze glutes and keep the hips flat|Hold, then roll out through a German hang','Bending the arms, a common cause of biceps strain'],
 'dead-hang':['Grip, forearms and shoulder health','Grip the bar about shoulder width|Let your body hang fully, arms straight|Breathe and relax the shoulders|Drop off when your grip starts to slip','Holding the breath'],
 'active-hang':['Lats, lower traps and grip','Hang from the bar with straight arms|Pull your shoulders down away from your ears|Keep the arms straight and body still|Hold that position','Bending the elbows'],
 'ring-curl':['Biceps','Hold the rings, palms up, and lean back|Keep elbows pointing forward and still|Curl your hands towards your forehead|Lower slowly to straight arms','Letting the elbows drop, which turns it into a row'],
 'ring-tri-ext':['Triceps','Hold the rings, lean forward, arms straight|Bend only at the elbows, lowering your head between the rings|Keep the body straight|Press back to straight arms','Hips piking up during the press'],
 'air-squat':['Quads, glutes and hamstrings','Feet shoulder width, toes slightly out|Sit hips back and down, knees following the toes|Go as deep as you can with a flat back|Drive up through the whole foot','Knees caving in'],
 'cossack':['Quads, glutes, adductors and hip mobility','Stand with a very wide stance, toes slightly out|Sit down into one hip, the other leg straight with toes up|Keep the heel of the bent leg down|Shift across to the other side','Lifting the working heel off the floor'],
 'jump-squat':['Quads and glutes, power','Squat to about parallel|Jump as high as you can|Land softly, knees bent, and sink straight into the next rep|Keep knees in line with toes','Landing stiff-legged'],
 'assisted-pistol':['Quads and glutes, one leg','Hold a post, ring or door frame|Stand on one leg, other leg straight out in front|Squat as deep as you can, using the hands only as needed|Stand back up','Pulling with the arms more than you need'],
 'box-pistol':['Quads and glutes, one leg','Stand on one leg in front of a box or bench|Lower slowly until you sit on it|Stand back up without rocking|Lower the box over time','Plopping down onto the box'],
 'shrimp':['Quads and glutes, one leg','Stand on one leg, hold the other foot behind you|Lower the back knee towards the floor|Lean forward a little to balance|Drive back up through the front foot','Letting the knee crash into the floor'],
 'pistol':['Quads, glutes and balance','Stand on one leg, other leg straight out in front|Reach arms forward to counterbalance|Squat all the way down with the heel flat|Stand back up without bouncing','Heel lifting or the knee collapsing in'],
 'wall-sit':['Quads','Back flat against a wall, feet out in front|Slide down until knees are at about 90°|Knees over ankles, weight in the heels|Hold','Hands pushing on the thighs'],
 'bw-lunge':['Quads and glutes','Step forward into a long stride|Lower until the back knee nearly touches the floor|Front knee tracks over the toes|Push back to standing','Front heel lifting'],
 'step-up':['Quads and glutes','Put your whole foot on a box or bench|Drive through that foot to stand up tall|Avoid pushing off the back foot|Lower slowly','Bouncing off the bottom leg'],
 'bw-bulgarian':['Quads and glutes, one leg','Back foot on a bench, front foot about a stride ahead|Lower until the back knee nearly touches the floor|Keep your chest up and front heel down|Drive up through the front foot','Front foot too close, so the knee shoots far forward'],
 'jump-lunge':['Quads and glutes, power','Start in a lunge|Jump and switch legs in the air|Land softly straight into the next lunge|Keep your torso upright','Landing hard on the back knee'],
 'sl-rdl':['Hamstrings and glutes, balance','Stand on one leg with a soft knee|Hinge forward, back leg lifting behind you|Keep hips square and back flat|Stand up by squeezing the glute','Opening the hip to the side'],
 'slider-curl':['Hamstrings','Lie on your back, heels on sliders or a towel|Lift your hips into a bridge|Pull your heels towards your bum, keeping hips up|Slide them back out slowly','Hips dropping during the curl'],
 'nordic':['Hamstrings','Kneel with your ankles anchored|Body straight from knees to head|Lower forward as slowly as you can|Catch yourself with your hands and push back up','Bending at the hips to make it easier'],
 'sissy':['Quads','Hold a support, rise onto your toes|Lean back and bend the knees forward|Keep a straight line from knees to shoulders|Lower as far as comfortable, then return','Bending at the hips'],
 'reverse-nordic':['Quads and hip flexors','Kneel upright with a straight line from knees to head|Lean back slowly, keeping hips extended|Go as far as you can control|Come back up the same way','Bending at the hips'],
 'bw-calf':['Calves','Stand on one foot on a step edge|Lower your heel below the step|Rise as high as you can onto your toes|Pause at the top','Bouncing out of the bottom'],
 'glute-bridge':['Glutes and hamstrings','Lie on your back, knees bent, feet flat|Push through your heels to lift your hips|Squeeze glutes hard at the top|Lower slowly','Arching the lower back instead of using the glutes'],
 'sl-glute-bridge':['Glutes and hamstrings, one side','Lie on your back, one foot flat, other leg raised|Push through the heel to lift your hips|Keep the pelvis level|Lower slowly','Hips tilting to one side'],
 'box-jump':['Legs, power','Stand a short step from the box|Swing your arms and jump onto it|Land softly in a squat|Step down, do not jump down','Choosing a box so high you land in a deep squat'],
 'broad-jump':['Legs, power','Feet hip width, swing your arms back|Jump forward as far as you can|Land softly with knees bent|Reset each rep','Landing with straight legs'],
 'plank':['Core and shoulders','Forearms under shoulders, legs straight|Squeeze glutes and brace your stomach|Keep a straight line from head to heels|Breathe and hold','Hips sagging or piking up'],
 'side-plank':['Obliques and hips','Forearm under shoulder, legs stacked|Lift your hips so your body is straight|Keep hips forward, not rolling back|Hold, then switch sides','Hips sinking towards the floor'],
 'dead-bug':['Deep core','Lie on your back, arms up, knees at 90°|Press your lower back into the floor|Lower the opposite arm and leg slowly|Return and switch sides','Lower back lifting off the floor'],
 'hollow':['Core, for almost every calisthenics skill','Lie on your back, arms overhead|Press your lower back into the floor|Lift arms, shoulders and legs a little off the floor|Bend knees or bring arms in to make it easier','Lower back lifting off the floor'],
 'mountain':['Core and conditioning','High plank with hands under shoulders|Drive one knee towards your chest|Switch legs quickly|Keep hips low and steady','Hips bouncing up'],
 'ab-wheel':['Core and lats','Kneel and hold the wheel under your shoulders|Roll forward slowly, keeping your back rounded slightly|Go only as far as you can without the lower back sagging|Pull back with your stomach','Lower back arching at the far point'],
 'body-saw':['Core','Forearm plank, feet on sliders or a towel|Rock your body back and forth from the shoulders|Keep the plank line|Small range first','Hips sagging'],
 'russian':['Obliques','Sit with knees bent, lean back slightly|Keep your chest up and back straight|Turn your shoulders side to side|Lift the feet to make it harder','Just moving the arms instead of rotating the torso'],
 'crunch':['Abs','Lie on your back, knees bent|Hands lightly by your head|Curl your shoulders off the floor|Lower slowly','Pulling on the neck'],
 'leg-raise':['Lower abs and hip flexors','Lie on your back, hands under your hips|Keep the lower back pressed down|Raise straight legs to vertical|Lower slowly without arching','Lower back arching as the legs drop'],
 'hanging-knee':['Abs and hip flexors','Hang from a bar, shoulders engaged|Raise your knees towards your chest|Curl the pelvis up at the top|Lower without swinging','Swinging for momentum'],
 'hanging-leg':['Abs and hip flexors','Hang with shoulders engaged|Lift straight legs to hip height or higher|Control the descent|Avoid swinging','Using momentum'],
 'toes-to-bar':['Abs, hip flexors and lats','Hang from a bar|Press down on the bar with straight arms as you lift|Bring your toes up to touch the bar|Lower under control','Kipping without control'],
 'dragon-flag':['Core','Lie on a bench, hold it behind your head|Lift your body to vertical on your upper back|Lower slowly as one straight line|Bend the knees to make it easier','Bending at the hips'],
 'clutch-flag':['Obliques and lats, flag foundation','Hold a pole with both hands, clamp it against your side|Lift your legs off the floor|Keep the body as straight and level as you can|Hold','Hips dropping'],
 'tuck-flag':['Obliques, lats and shoulders','Top hand pulls, bottom hand pushes, arms straight|Tuck your knees and lift until your body is level|Keep the top shoulder pulled down|Hold, then lower','Bending the bottom arm'],
 'vertical-flag':['Obliques, lats and shoulders, flag entry','Grip the pole with the usual flag grip|Kick up to a vertical position with legs straight up|Hold with straight arms|Lower slowly','Bending the arms'],
 'flag-negative':['Obliques, lats and shoulders','Start in a vertical flag|Lower your tucked legs slowly towards horizontal|Control the descent for 3 to 5 seconds|Step down and reset','Dropping instead of lowering under control'],
 'straddle-flag':['Obliques, lats and shoulders','Flag grip, arms straight|Legs straight and wide apart|Push the bottom hand, pull the top|Keep the body level and hold','Hips sinking'],
 'human-flag':['Obliques, lats, shoulders and full-body tension','Flag grip with both arms straight|Body horizontal, legs together|Top arm pulls, bottom arm pushes hard|Keep the hips up and hold','Bending the bottom arm or hips dropping'],
 'windshield':['Obliques and core','Hang from a bar, legs raised to the bar|Swing your legs side to side like wipers|Keep the shoulders engaged|Control both ways','Momentum instead of control'],
 'support-hold':['Shoulders, triceps and stabilisers','Support yourself on parallel bars or rings, arms locked|Push your shoulders down away from your ears|Keep your body straight and still|Turn the rings out if using rings','Shrugging the shoulders up'],
 'tuck-lsit':['Core, hip flexors and triceps','Hands on the floor or parallettes by your hips|Push down hard so your bum lifts|Pull your knees towards your chest|Hold with straight arms','Shoulders shrugging up'],
 'lsit':['Core, hip flexors and triceps','From a tuck L-sit, straighten your legs|Keep legs level and together|Push the shoulders down hard|Point the toes and hold','Legs dropping'],
 'v-sit':['Core, hip flexors and shoulders','From an L-sit, push higher|Lift the legs above horizontal|Lean the shoulders back|Hold with straight arms','Bending the knees'],
 'burpee':['Full body conditioning','Squat down and put your hands on the floor|Jump your feet back into a plank|Bring your feet back in|Jump up with your arms overhead','Sagging hips in the plank'],
 'bear-crawl':['Shoulders, core and coordination','On hands and feet with knees just off the floor|Move opposite hand and foot together|Keep the back flat and hips low|Small, controlled steps','Hips rising high'],
 'kick-up':['Handstand entry and balance','Lunge forward with arms overhead|Place your hands and kick the back leg up|Bring the other leg to meet it|Practise bailing safely','Kicking too hard and falling over'],
 'farmer':['Grip, traps, core and conditioning','Pick up a heavy weight in each hand with a flat back, as if deadlifting|Stand tall with shoulders down and back|Walk with short, quick steps and steady breathing|Log the weight per hand as kg and each length as a rep','Letting the shoulders round forward or the weights swing'],
 'suitcase-carry':['Obliques, grip and hip stability','Hold one weight at your side like a suitcase|Stand tall without leaning towards or away from it|Walk with short, steady steps|Switch hands each set; log seconds per side','Leaning sideways to balance the weight'],
 'overhead-carry':['Shoulders, upper back and core','Press one or two weights overhead and lock the elbows|Keep the ribs down so the lower back does not arch|Walk slowly with the weight stacked over your shoulder|Log seconds; switch hands if carrying one','Letting the arm drift forward of the head'],
 'band-ext-rot':['Rotator cuff (external rotators)','Anchor a band at elbow height and stand side-on to it|Keep the elbow tucked at your side, bent to 90 degrees|Rotate the forearm outwards, away from your body|Return slowly; go light and smooth','Letting the elbow leave your side'],
 'cable-ext-rot':['Rotator cuff (external rotators)','Set a cable at elbow height and stand side-on to it|Elbow tucked to your side at 90 degrees, a towel between elbow and ribs helps|Rotate the hand outwards under control|Return slowly; use a light weight','Turning the whole body instead of the shoulder'],
 'db-ext-rot':['Rotator cuff (external rotators)','Lie on your side, top elbow on your hip, bent to 90 degrees|Hold a light dumbbell with the forearm across your belly|Rotate the forearm up towards the ceiling|Lower slowly','Using a weight heavy enough to need a swing'],
 'band-int-rot':['Rotator cuff (internal rotators)','Anchor a band at elbow height and stand side-on, band on the outside|Elbow tucked at your side, bent to 90 degrees|Rotate the forearm in across your belly|Return slowly','Letting the elbow drift forward'],
 'cuban-press':['Rotator cuff and upper back','Hold light dumbbells, upright row until elbows reach shoulder height|Rotate the forearms up so the weights point at the ceiling|Press overhead, then reverse each step|Go light; this is shoulder health work','Using weights heavy enough to strain the rotation'],
 'short-copenhagen':['Adductors (inner thigh) and obliques','Lie on your side with the top knee resting on a bench|Prop yourself on the forearm|Lift your hips so the body is in a straight line, bottom leg off the floor if you can|Hold, then switch sides','Hips sagging towards the floor'],
 'copenhagen':['Adductors (inner thigh) and obliques','Lie on your side with the top foot or ankle on a bench, leg straight|Prop yourself on the forearm|Lift your hips into a straight line|Hold, then switch sides; start with the short-lever version','Twisting the hips forward or back'],
 'lateral-lunge':['Adductors, glutes and quads','Stand with feet wide|Shift your weight to one side and sit back into that hip, other leg straight|Keep the chest up and the heel of the bent leg down|Push back to the middle and switch sides','Letting the bent knee cave inwards'],
 'adduction-machine':['Adductors (inner thigh)','Set the pads so you start in a comfortable stretch|Squeeze your legs together in a smooth arc|Pause briefly at the end|Return slowly','Letting the weight slam back'],
 'landmine-press':['Shoulders, upper chest and core','Hold the end of the bar at your shoulder in a split or square stance|Press up and forward until the arm is straight|Keep the ribs down and do not lean back|Lower under control; one or two arms','Arching the lower back to finish the press'],
 'meadows-row':['Lats and upper back, one side','Stand side-on to the end of the landmine bar in a staggered stance|Hinge forward and grip the bar end overhand|Row the elbow up and back towards your hip|Lower to a full stretch','Twisting the torso to lift the weight'],
 'landmine-squat':['Quads and glutes','Hold the bar end at your chest with both hands|Sit down between your heels, leaning slightly into the bar|Keep the chest up|Drive up through the whole foot','Letting the knees cave in'],
 'landmine-rotation':['Obliques and core','Hold the bar end at head height with straight arms|Rotate it in an arc down to one hip, pivoting the back foot|Bring it back over the top to the other side|Move from the hips and trunk, not the arms','Bending the arms and turning it into a press'],
 'jm-press':['Triceps','Lie on a bench with a close grip, about shoulder width|Lower the bar towards your chin by bending the elbows and letting them drift slightly forward|Stop a few cm above the chin, upper arms angled towards your feet|Press back up with the triceps','Turning it into a close-grip bench press by lowering to the chest'],
 'tate-press':['Triceps (inner range)','Lie on a bench with dumbbells pressed up, palms facing your feet|Bend the elbows out to the sides so the dumbbell ends touch your chest|Keep the upper arms still|Press back up by straightening the elbows; go light','Letting the elbows drop towards the floor'],
 'cable-kickback':['Triceps (long head)','Set a cable low and hold the end with one hand|Hinge forward and pin the upper arm by your side, parallel to the floor|Straighten the elbow until the arm is fully extended behind you|Return slowly; keep the upper arm still','Swinging the upper arm to move the weight'],
 'single-pushdown':['Triceps (lateral head)','Set a cable high and hold a single handle palm up|Tuck the elbow to your side|Push the handle down until the arm is straight|Return slowly; switch arms','Letting the elbow drift forward'],
 'cross-cable-ext':['Triceps (lateral head)','Set two cables at head height and cross them, holding the opposite handle in each hand|Start with elbows bent and hands near your face|Straighten the arms out to the sides|Return slowly; keep the elbows level','Turning it into a chest fly'],
 'ez-oh-ext':['Triceps (long head)','Sit or stand holding an EZ bar overhead with a close grip|Lower the bar behind your head by bending the elbows|Keep the elbows pointing forward, not out|Press back up to straight arms','Arching the lower back; brace the core'],
 'band-oh-ext':['Triceps (long head)','Anchor a band low behind you, or stand on it|Hold it behind your head with elbows bent and pointing up|Straighten the arms overhead|Return slowly','Letting the elbows flare wide'],
 'tri-machine':['Triceps','Adjust the seat so your elbows line up with the machine pivot|Grip the handles with elbows on the pad|Push down until the arms are straight|Return slowly to a full bend','Lifting the elbows off the pad'],
 'landmine-tri-ext':['Triceps (long head)','Face away from the anchor holding the bar end overhead with both hands|Lower the bar behind your head by bending the elbows|Keep the elbows pointing forward|Straighten the arms to press it back up','Arching the back as the arms extend'],
 'half-kneel-landmine':['Shoulders, upper chest and core','Kneel on the knee on the same side as the working arm|Hold the bar end at your shoulder|Press up and forward until the arm is straight, squeezing the glute of the down knee|Lower under control; switch sides','Leaning back or twisting to finish the press'],
 'landmine-chest-press':['Chest, front shoulders and triceps','Stand facing the anchor, holding the bar end at your chest with both hands|Squeeze your palms together|Press the bar up and away until the arms are straight|Lower slowly to the chest','Shrugging the shoulders as you press'],
 'landmine-row':['Upper back and lats','Straddle the bar facing away from the anchor, a V-handle under the bar end|Hinge forward with a flat back|Row the handle up to your stomach|Lower to a full stretch','Standing up as you row to cheat the weight'],
 'landmine-rdl':['Hamstrings and glutes','Stand at the bar end, holding it with both hands at hip height|Push the hips back with soft knees, sliding the bar down your thighs|Keep the back flat; stop at a good hamstring stretch|Drive the hips forward to stand tall','Rounding the lower back to reach lower'],
 'landmine-lunge':['Quads and glutes','Hold the bar end at your chest with both hands, or one hand at the shoulder|Step back into a lunge, back knee just above the floor|Keep the front heel down and chest up|Drive through the front foot to stand; alternate legs','Letting the front knee cave inwards'],
 'landmine-thruster':['Legs, shoulders and conditioning','Hold the bar end at your chest|Squat down between your heels|Drive up hard and use that momentum to press the bar up and forward|Lower to the chest as you go into the next squat','Pressing with the arms only and not using the legs'],
 'landmine-lat-raise':['Side shoulders','Stand side-on to the bar end and grip it with the far hand, low by the opposite hip|Raise the arm up and out in an arc to shoulder height|Keep a slight bend in the elbow|Lower slowly; switch sides','Swinging the body to lift the bar'],
 'landmine-shrug':['Traps (upper back)','Straddle the bar facing away from the anchor, holding a handle or the bar end|Stand tall with straight arms|Shrug the shoulders straight up towards the ears|Pause, then lower slowly','Rolling the shoulders; just lift and lower'],
 'worlds-greatest':['Hips, hamstrings and upper back (mobility)','Step into a long lunge and put both hands inside the front foot|Drop the front elbow towards the ankle|Rotate and reach the same arm to the ceiling|Straighten the front leg for a hamstring stretch, then switch sides; each side is one rep','Rushing through the positions'],
 'pigeon':['Glutes and hip rotation (mobility)','From all fours, bring one knee forward behind the same hand|Lay the shin across in front of you as far as comfortable|Extend the back leg and square your hips|Stay upright or fold forward; switch sides','Forcing the front knee into pain; prop the hip on a cushion'],
 'thoracic-rot':['Upper back rotation (mobility)','Kneel on all fours, one hand behind your head|Rotate the elbow down towards the other arm|Then rotate it up towards the ceiling, following with your eyes|Keep the hips still; each turn is one rep','Moving from the lower back instead of the upper back'],
 'knee-to-wall':['Ankle mobility','Face a wall in a half-kneeling stance, front toes a few cm from the wall|Drive the front knee forward to touch the wall, heel down|Move the foot back a little as it gets easy|Each touch is one rep; do both sides','Letting the heel lift off the floor'],
 'doorway-pec':['Chest and front shoulders (mobility)','Place your forearm on a door frame, elbow at shoulder height|Step through until you feel a stretch across the chest|Keep the shoulder down and ribs in|Hold, then switch sides','Shrugging the shoulder up towards the ear'],
 'childs-pose':['Lower back, lats and hips (mobility)','Kneel and sit back towards your heels|Reach your arms forward and rest your forehead down|Let your chest sink towards the floor|Breathe slowly and hold','Holding your breath'],
 'shoulder-cars':['Shoulder joint control (mobility)','Stand tall and brace your core|Draw the biggest slow circle you can with one straight arm|Keep the rest of the body still|Each full circle is one rep; reverse direction','Moving fast so the trunk twists to help'],
 'sleeper-stretch':['Back of the shoulder (mobility)','Lie on your side with the bottom arm in front, elbow at shoulder height|Bend the elbow to 90 degrees, fingers to the ceiling|Gently press the forearm down towards the floor with the other hand|Hold a mild stretch, then switch sides','Pushing into pain at the front of the shoulder'],
 'tuck-planche-pu':['Front shoulders, chest and triceps','Hold a tuck planche, hands by the hips, arms locked|Bend the elbows and lower the chest while keeping the lean|Keep the knees tucked and the hips up|Press back to straight arms','Losing the lean so it becomes a normal push-up'],
 'ninety-pushup':['Shoulders, triceps and balance','From a handstand, lower until your body is horizontal on bent arms, elbows tight|Hold the 90 degree position briefly|Press back up to the handstand|Learn it against a wall or with a spotter','Elbows flaring out to the sides'],
 'korean-dip':['Front shoulders, chest and triceps (shoulder extension)','Stand with a bar behind you at hip height and grip it|Lift your feet and lower until the bar is near your upper back|Press back up to straight arms|Go slowly; build depth gradually','Dropping into the bottom; it is a big stretch for the shoulders'],
 'impossible-dip':['Triceps','On parallel bars, lower onto your forearms|Keep the elbows tucked and body upright|Press back up onto your hands using only the triceps|Partial range first; feet down for help','Letting the elbows flare out'],
 'fl-raise':['Lats and core (straight-arm)','Hang from the bar with straight arms|Raise your body as one piece into a front lever, or tuck version|Lower slowly back to the hang|Keep the arms locked throughout','Bending the arms to pull'],
 'ice-cream':['Lats and core (straight-arm into pull)','From a hang, raise into a front lever (tuck if needed)|Pull the bar to your hips, rotating up into an inverted hang|Return to the lever, then lower to the hang|Keep the body straight','Losing the body line during the pull'],
 'ring-lsit':['Core, hip flexors and shoulder stability','Push up into a ring support, rings by the hips, turned slightly out|Lift your legs to horizontal and lock the knees|Keep the shoulders pushed down|Hold; tuck the knees if needed','Rings drifting forward or shoulders shrugging'],
 'straddle-press':['Shoulders, hip flexors and compression','Stand in a wide straddle, hands on the floor in front|Lean the shoulders forward over the hands|Lift the hips over the shoulders, legs wide|Bring the legs together in a handstand','Jumping instead of pressing; use a wall or elevated feet to learn'],
 'oah-assisted':['Shoulder, wrist and balance for one-arm handstand','In a handstand, shift your weight onto one hand|Keep the other hand on the floor with fingertips only|Stack the hips over the working hand|Hold for time, then switch sides','Shifting weight without moving the hips over the hand'],
 'bench':['Chest, front shoulders and triceps','Lie with eyes under the bar, feet flat, shoulder blades pulled back and down|Grip a little wider than shoulders and unrack with straight arms|Lower to the lower chest with elbows about 45 degrees from your body|Press up and slightly back to lockout, keeping the upper back tight','Bouncing the bar off the chest or lifting the hips'],
 'incline-bench':['Upper chest, front shoulders and triceps','Set the bench to about 30 degrees and set your shoulder blades back|Unrack and lower the bar to the upper chest, just below the collarbones|Keep the wrists stacked over the elbows|Press up to lockout over the shoulders','Setting the bench so steep it becomes a shoulder press'],
 'decline-bench':['Lower chest and triceps','Hook your feet securely and lie back on the decline bench|Unrack with straight arms over the lower chest|Lower under control to the lower chest|Press back up to lockout; use a spotter','Dropping the bar towards the neck'],
 'close-grip-bench':['Triceps, chest and front shoulders','Grip about shoulder width, not narrower|Keep the elbows tucked close to your sides|Lower to the lower chest|Press to lockout with the triceps','Gripping so narrow the wrists bend and hurt'],
 'db-bench':['Chest, front shoulders and triceps','Sit with the dumbbells on your thighs and kick them up as you lie back|Start with arms straight over the chest, shoulder blades pinched|Lower until the dumbbells are beside the chest, elbows about 45 degrees|Press up, letting them come slightly together','Letting the dumbbells drift too wide at the bottom'],
 'db-incline':['Upper chest and front shoulders','Set the bench to about 30 degrees|Start with the dumbbells over the upper chest|Lower to the sides of the upper chest|Press up and slightly in','Arching the back off the bench to make it a flat press'],
 'floor-press':['Chest and triceps, lockout strength','Lie on the floor with knees bent and a dumbbell in each hand|Lower until the upper arms touch the floor|Pause briefly without relaxing|Press back up to straight arms','Slamming the elbows into the floor'],
 'smith-bench':['Chest, front shoulders and triceps','Set the bench so the bar lands on your lower chest|Unhook the bar with straight arms|Lower under control, elbows about 45 degrees|Press up and rehook at the top','Positioning the bench so the bar path hits the neck or belly'],
 'machine-chest':['Chest, front shoulders and triceps','Set the seat so the handles are at mid-chest height|Sit tall with shoulder blades back against the pad|Press the handles forward to near lockout|Return slowly until you feel a stretch','Letting the shoulders roll forward off the pad'],
 'band-press':['Chest and triceps','Anchor a band behind you at chest height|Hold the handles at your chest in a split stance|Press forward until the arms are straight|Return slowly against the band','Leaning into the press instead of using the chest'],
 'kb-floor-press':['Chest and triceps','Lie on the floor holding a kettlebell, handle in your palm, bell on the back of the forearm|Lower until the upper arm touches the floor|Keep the wrist straight|Press back up','Letting the wrist bend back under the bell'],
 'db-fly':['Chest','Lie on a bench with dumbbells over the chest, palms facing|Keep a slight bend in the elbows|Open the arms wide until you feel a stretch across the chest|Bring them back together in the same arc','Bending the elbows more as you go, turning it into a press'],
 'cable-fly':['Chest','Set the pulleys at shoulder height and step forward in a split stance|Start with arms open and a slight bend in the elbows|Bring the hands together in front of the chest in an arc|Return slowly to the stretch','Using so much weight the shoulders roll forward'],
 'pec-deck':['Chest','Set the seat so the handles are at chest height|Sit tall with the back against the pad|Bring the handles together in front of you|Return slowly to a comfortable stretch','Letting the weight stack slam between reps'],
 'band-fly':['Chest','Anchor a band behind you at chest height|Start with arms open and slightly bent|Bring the hands together in front of you|Return slowly','Bending the arms to make it easier'],
 'machine-dip':['Chest and triceps','Kneel or stand on the platform; more weight means more help|Grip the handles and start with straight arms|Lower until the upper arms are about level with the floor|Press back up to lockout','Shrugging the shoulders up at the bottom'],
 'ohp':['Shoulders, triceps and upper back','Start with the bar on the front of your shoulders, grip just outside shoulder width|Squeeze glutes and brace so the lower back does not arch|Press straight up, moving the head back out of the way|Lock out with the bar over the middle of your feet','Leaning back into a standing incline press'],
 'push-press':['Shoulders, triceps and leg drive','Start as for an overhead press|Dip by bending the knees a few centimetres, chest upright|Drive up through the legs and press the bar overhead|Lock out, then lower to the shoulders','Dipping forward onto the toes instead of straight down'],
 'db-shoulder':['Shoulders and triceps','Sit or stand with dumbbells at shoulder height, palms forward|Brace and keep the ribs down|Press up until the arms are straight|Lower to shoulder height under control','Arching the lower back to finish the rep'],
 'arnold':['Shoulders, all three heads','Start with dumbbells in front of your shoulders, palms facing you|Press up while rotating the palms to face forward|Finish with arms straight overhead|Reverse the rotation on the way down','Rushing the rotation and losing control'],
 'kb-press':['Shoulders, triceps and core','Clean the kettlebell to the rack position, bell resting on the forearm|Brace and keep the wrist straight|Press straight up, rotating slightly to finish palm forward|Lower back to the rack','Letting the elbow flare out wide at the start'],
 'machine-shoulder':['Shoulders and triceps','Set the seat so the handles start at shoulder height|Sit tall with the back against the pad|Press up to near lockout|Lower slowly','Letting the lower back come off the pad'],
 'smith-ohp':['Shoulders and triceps','Set a bench under the bar so it starts at shoulder height|Unhook with hands just outside shoulder width|Press up to lockout|Lower to chin height and repeat','Lowering the bar too far behind the head'],
 'band-ohp':['Shoulders and triceps','Stand on the band and hold the handles at shoulder height|Brace and squeeze the glutes|Press up to straight arms|Lower slowly against the band','Leaning back to press'],
 'lat-raise':['Side shoulders','Stand with dumbbells at your sides, a slight bend in the elbows|Raise the arms out to the side to shoulder height|Lead with the elbows, not the hands|Lower slowly','Swinging the body and shrugging to lift heavier weights'],
 'cable-lat-raise':['Side shoulders','Stand side-on to a low pulley and take the handle in the far hand|Raise the arm out to the side to shoulder height|Keep a slight bend in the elbow|Lower slowly; the cable keeps tension at the bottom','Leaning away from the cable to cheat the weight up'],
 'machine-lat-raise':['Side shoulders','Set the seat so your shoulders line up with the pivot|Place the arms against the pads|Raise to shoulder height|Lower under control','Shrugging the shoulders up towards the ears'],
 'band-lat-raise':['Side shoulders','Stand on the band and hold an end in each hand|Raise the arms out to the side to shoulder height|Keep a slight bend in the elbows|Lower slowly','Turning it into a shrug'],
 'upright-row':['Side shoulders and upper traps','Hold the weight with hands about shoulder width or wider|Pull up close to your body, leading with the elbows|Stop when the elbows reach shoulder height|Lower slowly','Using a narrow grip and pulling to the chin, which can pinch the shoulders'],
 'front-raise':['Front shoulders','Hold the weight in front of your thighs|Raise it forward to shoulder height with a slight bend in the elbows|Pause, then lower slowly|Stay upright throughout','Leaning back and swinging the weight'],
 'face-pull':['Rear shoulders, upper back and rotator cuff','Set a rope at upper chest to face height|Pull towards your face, hands either side of your head|Finish with elbows high and knuckles turned back|Return slowly','Pulling with the elbows low, turning it into a row'],
 'band-pull-apart':['Rear shoulders and upper back','Hold a band in front of you at shoulder height, arms straight|Pull it apart until it touches your chest|Squeeze the shoulder blades together|Return slowly','Bending the elbows to make it easier'],
 'rear-delt':['Rear shoulders and upper back','Hinge forward with a flat back, dumbbells hanging below the chest|Raise the arms out to the sides with a slight bend in the elbows|Lead with the elbows to shoulder height|Lower slowly','Using momentum from the back to swing the weights'],
 'reverse-pec-deck':['Rear shoulders and upper back','Sit facing the pad with the handles at shoulder height|Push the handles back and out in a wide arc|Keep a slight bend in the elbows|Return slowly','Squeezing the shoulder blades so hard the traps take over'],
 'deadlift':['Hamstrings, glutes, back and grip','Stand with the bar over the middle of your feet, grip just outside the legs|Push the hips back, shins to the bar, and flatten your back|Brace, take the slack out of the bar, then push the floor away|Stand tall with hips and knees locked, then lower the same way','Rounding the lower back or letting the bar drift away from the legs'],
 'sumo-deadlift':['Glutes, adductors, quads and back','Take a wide stance with toes turned out, bar over mid-foot|Grip inside the knees with arms straight|Push the knees out, brace and drive the floor apart|Lock out with the hips forward, then lower the same way','Hips shooting up first so it becomes a stiff-leg pull'],
 'trap-deadlift':['Quads, glutes, hamstrings and back','Stand in the centre of the trap bar and grip the handles|Sit the hips back with a flat back and chest up|Drive up through the whole foot to standing|Lower under control','Rounding the back at the bottom'],
 'good-morning':['Hamstrings, glutes and lower back','Put the bar on your upper back as for a squat|Soften the knees and push the hips back|Lower the chest until you feel a hamstring stretch, back flat|Drive the hips forward to stand','Rounding the back to go lower'],
 'back-ext':['Lower back, glutes and hamstrings','Set the pad just below the hips|Lower the upper body with a flat back|Raise until the body is in a straight line|Squeeze the glutes at the top','Overextending and arching at the top'],
 'row':['Upper back, lats and biceps','Hinge to about 45 degrees with a flat back, bar below the shoulders|Grip just outside shoulder width|Row the bar to the lower chest or upper belly|Lower under control without standing up','Standing more upright each rep to use the legs and back'],
 'pendlay':['Upper back, lats and power','Hinge until the back is roughly parallel to the floor|Start each rep from the floor with straight arms|Pull explosively to the lower chest|Return the bar to the floor and reset','Lifting the torso as you pull'],
 'db-row':['Lats and upper back, one side','Put one hand and knee on a bench, back flat|Hang the dumbbell under the shoulder|Row towards the hip, elbow close to the body|Lower to a full stretch','Rotating the torso to lift the weight'],
 'kb-row':['Lats and upper back, one side','Brace one hand on a bench or your knee, back flat|Row the kettlebell towards your hip|Squeeze the shoulder blade back|Lower slowly','Shrugging instead of pulling with the back'],
 'tbar':['Mid back and lats','Straddle the bar and hinge with a flat back|Grip the handle close to the plates|Row towards the chest|Lower under control','Standing up as you pull'],
 'seated-row':['Mid back, lats and biceps','Sit tall with feet on the platform and knees soft|Start with arms straight and shoulders reaching forward|Row the handle to the lower ribs, squeezing the shoulder blades|Return slowly to the stretch','Rocking backwards to move the weight'],
 'machine-row':['Mid back and lats','Set the chest pad so the handles are just in reach|Keep the chest on the pad|Row until the elbows are behind you|Return slowly','Lifting the chest off the pad'],
 'chest-sup-db':['Mid back and lats','Lie face down on an incline bench with dumbbells hanging|Row the dumbbells up, elbows back|Squeeze the shoulder blades together|Lower slowly','Craning the neck up'],
 'band-row':['Upper back and lats','Anchor the band at chest height|Sit or stand tall with arms straight|Row the hands to the ribs|Return slowly','Leaning back instead of rowing'],
 'inverted-row':['Upper back, lats and biceps','Hang under a bar or rings with heels on the floor, body straight|Pull your chest to the bar|Squeeze the shoulder blades together|Lower to straight arms; walk feet forward to make it easier','Letting the hips sag'],
 'lat-pulldown':['Lats and biceps','Set the thigh pad so you are locked in|Grip just wider than shoulders|Pull the bar to the upper chest, elbows driving down|Return slowly to straight arms','Leaning far back and turning it into a row'],
 'close-pulldown':['Lats and biceps','Use a close or neutral handle and lock your thighs in|Start with arms straight|Pull to the upper chest, elbows close to the body|Return slowly','Using momentum by rocking the torso'],
 'straight-arm-pd':['Lats','Stand facing a high pulley with a bar or rope|Hinge slightly with arms straight|Sweep the hands down to the thighs|Return slowly with straight arms','Bending the elbows so it becomes a pushdown'],
 'band-pulldown':['Lats','Anchor the band high and kneel facing it|Start with arms straight overhead|Pull the hands down to the shoulders|Return slowly','Shrugging the shoulders'],
 'assisted-pullup':['Lats and biceps','Set the weight to assist you; more weight means more help|Kneel or stand on the pad and grip the handles|Pull until your chin passes the handles|Lower to straight arms','Using so much assistance the reps are too easy to build strength'],
 'band-pullup':['Lats and biceps','Loop a band over the bar and put a foot or knee in it|Start from a full hang|Pull until your chin is over the bar|Lower under control; use a lighter band over time','Letting the band fling you up from the bottom'],
 'shrug':['Upper traps','Hold dumbbells at your sides|Lift the shoulders straight up towards the ears|Pause at the top|Lower slowly','Rolling the shoulders in circles'],
 'bb-shrug':['Upper traps','Hold the bar in front of the thighs|Lift the shoulders straight up|Pause, then lower slowly|Keep the arms straight','Bending the elbows to help'],
 'trap-shrug':['Upper traps','Stand in the trap bar holding the handles|Lift the shoulders straight up|Pause at the top|Lower slowly','Jerking the weight up'],
 'curl':['Biceps','Hold the bar at shoulder width with elbows at your sides|Curl up without moving the elbows forward|Squeeze at the top|Lower slowly to straight arms','Swinging the body to lift the bar'],
 'ez-curl':['Biceps','Hold the angled grips of the EZ bar|Keep the elbows pinned at your sides|Curl to shoulder height|Lower all the way under control','Cutting the range short at the bottom'],
 'db-curl':['Biceps','Stand with dumbbells at your sides, palms forward|Curl up, keeping the elbows still|Squeeze at the top|Lower slowly','Swinging the weights up'],
 'hammer':['Biceps and forearms (brachialis)','Hold dumbbells with palms facing each other|Curl up with the thumbs on top|Keep the elbows at your sides|Lower slowly','Letting the elbows travel forward'],
 'incline-curl':['Biceps (long head stretch)','Sit back on an incline bench with arms hanging straight|Curl up keeping the upper arms vertical|Squeeze at the top|Lower to a full stretch','Bringing the elbows forward to shorten the stretch'],
 'preacher':['Biceps','Rest the backs of your upper arms on the pad|Start with the arms nearly straight|Curl up and squeeze|Lower slowly; do not drop into the bottom','Bouncing out of the bottom, which stresses the elbow'],
 'cable-curl':['Biceps','Stand facing a low pulley with a bar or rope|Elbows at your sides|Curl up and squeeze|Lower slowly against the cable','Leaning back to move the weight'],
 'conc-curl':['Biceps','Sit with the elbow braced against the inside of the thigh|Curl the dumbbell towards the shoulder|Squeeze at the top|Lower slowly','Lifting the elbow off the thigh'],
 'kb-curl':['Biceps and grip','Hold the kettlebell by the horns or handle|Keep the elbows at your sides|Curl up and squeeze|Lower slowly','Swinging the bell'],
 'band-curl':['Biceps','Stand on the band holding the ends|Elbows at your sides|Curl up and squeeze|Lower slowly','Letting the elbows drift forward'],
 'tri-pushdown':['Triceps','Stand facing a high pulley with a bar|Elbows pinned to your sides|Push down until the arms are straight|Return slowly to about 90 degrees','Leaning over the bar and using bodyweight'],
 'rope-pushdown':['Triceps','Hold the rope ends with elbows at your sides|Push down and spread the rope at the bottom|Lock the elbows out|Return slowly','Letting the elbows flare forward'],
 'skull':['Triceps','Lie on a bench holding the weight over your chest|Bend at the elbows to lower it towards your forehead or just behind the head|Keep the upper arms still|Extend back to straight arms','Letting the elbows flare wide'],
 'oh-ext':['Triceps (long head)','Face away from a low pulley with a rope overhead|Keep the elbows close to the head|Extend the arms forward and up|Return slowly to a deep stretch','Arching the lower back'],
 'db-oh-ext':['Triceps (long head)','Hold one dumbbell overhead with both hands|Lower it behind your head, elbows pointing up|Keep the upper arms still|Extend back to straight arms','Letting the elbows splay out wide'],
 'kickback':['Triceps','Hinge forward with the upper arm parallel to the floor|Extend the forearm back until the arm is straight|Pause and squeeze|Lower slowly','Swinging the upper arm'],
 'band-pushdown':['Triceps','Anchor the band high|Elbows at your sides|Push down to straight arms|Return slowly','Moving the elbows'],
 'bw-tri-ext':['Triceps','Hands on a bench or bar at hip height, body straight like a plank|Bend at the elbows to lower your head below the bar|Keep the elbows pointing forward|Extend back to straight arms; lower the bar to make it harder','Letting the hips pike up'],
 'wrist-curl':['Forearm flexors','Sit with forearms on your thighs, palms up|Let the weight roll down to the fingers|Curl the wrist up as far as you can|Lower slowly','Using the arms instead of the wrists'],
 'reverse-curl':['Forearms and brachialis','Hold the weight with palms down|Elbows at your sides|Curl up keeping the wrists straight|Lower slowly','Letting the wrists bend back'],
 'squat':['Quads, glutes and adductors','Bar on the upper back, hands just outside the shoulders, feet about shoulder width|Brace, then sit down between your heels, knees following the toes|Go to at least parallel with a neutral back|Drive up through the whole foot','Knees caving in or the chest collapsing forward'],
 'front-squat':['Quads, glutes and upper back','Rest the bar on the front of the shoulders, elbows high|Keep the chest up and sit straight down|Go as deep as you can with elbows up|Drive up, leading with the elbows','Elbows dropping so the bar rolls forward'],
 'goblet':['Quads and glutes','Hold a dumbbell or kettlebell at your chest|Sit down between your heels, elbows inside the knees|Keep the chest up|Stand up through the whole foot','Leaning forward so the weight pulls you over'],
 'smith-squat':['Quads and glutes','Set the bar on your upper back with feet slightly in front|Unhook and squat down to at least parallel|Keep the back flat|Push up and rehook at the top','Feet too far forward, which strains the lower back'],
 'hack-squat':['Quads','Stand on the platform with shoulders under the pads|Release the safeties and lower as deep as you can|Keep the back against the pad|Push up without locking the knees hard','Lifting the heels off the platform'],
 'leg-press':['Quads and glutes','Sit with the back flat on the pad, feet shoulder width on the platform|Lower until the knees reach about 90 degrees or deeper|Keep the lower back on the pad|Press up without slamming the knees straight','Lowering so far the hips curl off the pad'],
 'lunge':['Quads and glutes','Hold dumbbells at your sides and step forward|Lower until the back knee nearly touches the floor|Push through the front foot and step into the next lunge|Keep the torso upright','Taking short steps so the front knee is under strain'],
 'reverse-lunge':['Quads and glutes','Hold the weights and step back with one leg|Lower until the back knee nearly touches the floor|Push through the front heel to return|Alternate legs','Leaning forward over the front leg'],
 'bb-lunge':['Quads and glutes','Bar on the upper back, step forward|Lower until the back knee nearly touches the floor|Keep the torso upright|Push back up and alternate','Losing balance from steps that are too narrow'],
 'split-squat':['Quads and glutes','Back foot on a bench, holding dumbbells|Lower until the back knee nearly touches the floor|Keep the front heel down|Drive up through the front foot','Front foot too close to the bench'],
 'rdl':['Hamstrings and glutes','Hold the bar at your hips with soft knees|Push the hips back and slide the bar down the thighs|Stop when you feel a strong hamstring stretch, back flat|Drive the hips forward to stand','Rounding the back or bending the knees into a squat'],
 'db-rdl':['Hamstrings and glutes','Hold dumbbells in front of the thighs|Push the hips back, keeping the weights close|Lower to a deep hamstring stretch with a flat back|Stand by driving the hips forward','Letting the dumbbells drift away from the legs'],
 'kb-swing':['Glutes, hamstrings and conditioning','Stand with the bell in front of you, feet a bit wider than hips|Hike it back between the legs with a flat back|Snap the hips forward to float it to chest height|Let it fall back and hinge again','Squatting the swing or lifting with the arms'],
 'leg-curl':['Hamstrings','Set the pad just above the heels|Curl the heels towards your bum|Squeeze at the end|Return slowly','Lifting the hips off the pad'],
 'glute-ham':['Hamstrings and glutes','Lock your ankles in with knees just behind the pad|Lower the body forward with hips straight|Pull back up with the hamstrings|Use your hands to help at first','Bending at the hips to shorten the lever'],
 'band-leg-curl':['Hamstrings','Anchor the band low and loop it around your ankle|Lie face down or stand|Curl the heel towards your bum|Return slowly','Arching the lower back'],
 'leg-ext':['Quads','Set the pad on the lower shins and the knee at the pivot|Extend the legs until straight|Squeeze the quads at the top|Lower slowly','Kicking the weight up with momentum'],
 'calf':['Calves','Stand with the balls of your feet on the edge|Lower the heels as far as you can|Rise as high as possible onto your toes|Pause at the top and bottom','Bouncing through short reps'],
 'seated-calf':['Calves (soleus)','Sit with the pad on your lower thighs and the balls of your feet on the platform|Lower the heels for a full stretch|Raise as high as you can|Pause at both ends','Using momentum instead of control'],
 'db-calf':['Calves','Hold a dumbbell and stand on a step|Lower the heels below the step|Rise onto your toes|Pause at the top','Bending the knees to help'],
 'hip-thrust':['Glutes','Sit with your upper back against a bench, bar over the hips with a pad|Feet flat about shoulder width|Drive the hips up until the body is flat from shoulders to knees|Pause and squeeze, then lower','Arching the lower back instead of extending the hips'],
 'db-hip-thrust':['Glutes','Upper back on a bench, dumbbell on the hips|Feet flat, knees bent|Drive the hips up and squeeze|Lower slowly','Pushing through the toes instead of the heels'],
 'hip-thrust-machine':['Glutes','Set the pad across the hips|Feet flat, shins vertical at the top|Drive the hips up and squeeze|Lower under control','Overarching the back at the top'],

SKILLS.forEach(sk=>sk.stages.forEach(st=>{ st.sk=sk.id; }));
function howBtn(id, name){ return hasHow(id)?`<button type="button" class="how-i" data-act="howto" data-id="${esc(id)}" aria-label="How to do ${esc(name||'')}">${ICON.info}</button>`:''; }
/* nearest easier and harder bodyweight versions of the same movement */
function howLadder(ex){
  if(!ex||ex.pattern==='prep'||!ex.lvl) return {};
  const same=LIB.filter(x=>x.pattern===ex.pattern&&x.id!==ex.id&&x.bw&&HOWTO[x.id]&&x.lvl);
  const lo=same.filter(x=>x.lvl<ex.lvl).sort((a,b)=>b.lvl-a.lvl)[0];
  const hi=same.filter(x=>x.lvl>ex.lvl).sort((a,b)=>a.lvl-b.lvl)[0];
  return {lo,hi};
}
function sheetHowto(ex){
  if(ex&&isCustomId(ex.id)) return sheetHowtoCustom(ex);
  const h=ex&&HOWTO[ex.id]; if(!h) return '<p class="muted">No notes for this exercise yet.</p>';
  const [works,cues,mistake]=h; const {lo,hi}=howLadder(ex);
  const step=(x,l)=>x?`<button type="button" class="how-step" data-act="howto" data-id="${esc(x.id)}"><small>${l}</small><b>${esc(x.name)}</b></button>`:'';
  return `<p class="how-works"><span class="label">Works</span>${esc(works)}</p>
  <ol class="how-cues">${cues.split('|').map(c=>`<li>${esc(c)}</li>`).join('')}</ol>
  <div class="callout safety"><b>Common mistake</b><span>${esc(mistake)}</span></div>
  ${lo||hi?`<div class="how-ladder">${step(lo,'Easier')}${step(hi,'Harder')}</div>`:''}
  <a class="btn block" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name+' tutorial')}" target="_blank" rel="noopener">${ICON.play}<span>Find a video</span></a>
  ${sheet&&sheet.back?`<button type="button" class="btn ghost block" data-act="how-back">Back</button>`:''}`;
}
function resetSkill(sk){
  const drop=(o)=>{ const d=Object.assign({},o||{}); delete d[sk.id]; return d; };
  S.settings.skills=drop(S.settings.skills); S.settings.skillsDone=drop(S.settings.skillsDone);
  const pd=Object.assign({},S.settings.preDone||{}); Object.keys(pd).forEach(k=>{ if(k.startsWith(sk.id+':')) delete pd[k]; }); S.settings.preDone=pd;
  S.settings.skillReset=Object.assign({},S.settings.skillReset||{},{[sk.id]:Date.now()});
  putSettings();
  return S.routines.filter(r=>r.src&&r.src.skill===sk.id).map(r=>r.id);
}
function skillStarted(sk){ return skillStage(sk.id)>=0 || skillMastery(sk).done || sk.stages.some(st=>stageProgress(st).best>0) || S.routines.some(r=>r.src&&r.src.skill===sk.id); }
function skillStage(id){ const v=(S.settings.skills||{})[id]; return v==null?-1:v; }
function bestReps(exId){ let m=0; for(const w of S.workouts) for(const e of (w.exercises||[])) if(e.exId===exId) for(const s of working(e.sets)) m=Math.max(m,num(s.r)); return m; }
/* a stage is passed when its goal is hit in a working set in two separate sessions */
function stageProgress(st){
  const val=x=>st.goal.sec?num(x.sec):num(x.r); const goal=st.goal.sec||st.goal.r;
  let best=0; const hits=[];
  const since=st.sk?((S.settings.skillReset||{})[st.sk]||0):0;
  for(const w of [...S.workouts].sort((a,b)=>a.startedAt-b.startedAt)){ if(w.startedAt<since) continue; let wb=0;
    for(const e of (w.exercises||[])) if(e.exId===st.key) for(const x of working(e.sets)) wb=Math.max(wb,val(x));
    best=Math.max(best,wb); if(wb>=goal) hits.push(w.startedAt); }
  const unit=st.goal.sec?' s':' reps';
  return {best, txt:best?`${best}${unit}`:'', hits:hits.length, hit:hits.length>=2, at:hits.length>=2?hits[1]:null, goal, unit};
}
function skillMastery(sk){
  if(!sk||!sk.stages) return {done:false};
  const p=stageProgress(sk.stages[sk.stages.length-1]); const manual=(S.settings.skillsDone||{})[sk.id];
  if(p.hit) return {done:true, at:p.at, how:'earned', best:p.txt};
  if(manual) return {done:true, at:manual, how:'manual'};
  return {done:false};
}
/* prerequisites: met by your logged best, by passing the linked stage of another skill, or ticked by you */
function preStatus(sk, pr){
  const id=`${sk.id}:${pr.keys[0]}`; const manual=!!(S.settings.preDone||{})[id];
  let best=0; for(const k of pr.keys) best=Math.max(best, stageProgress({key:k, goal:pr.goal}).best);
  let via=null;
  if(pr.from){ const fs=SKILLS.find(x=>x.id===pr.from.skill);
    if(fs && (stageProgress(fs.stages[pr.from.stage]).hit || skillMastery(fs).done || skillStage(fs.id)>pr.from.stage)) via=fs; }
  const goal=pr.goal.sec||pr.goal.r; const unit=pr.goal.sec?' s':' reps';
  return {id, manual, best, txt:best?`${best}${unit}`:'', via, met: manual || best>=goal || !!via};
}
function preSummary(sk){ const pre=sk.pre||[]; const st=pre.map(p=>preStatus(sk,p)); return {n:pre.length, met:st.filter(x=>x.met).length, all:st.every(x=>x.met), st}; }
function preBlock(sk){
  const pre=sk.pre||[]; if(!pre.length) return '';

  return `<div class="prereq ${ps.all?'all':''}">
    <div class="spread"><b>Before you start</b><span class="muted num" style="font-size:12px">${ps.met} of ${ps.n} met</span></div>
    <ul>${pre.map((p,i)=>{ const st=ps.st[i]; const fs=p.from?SKILLS.find(x=>x.id===p.from.skill):null;
      return `<li class="${st.met?'met':''}">
        <span class="pq-dot" aria-hidden="true">${st.met?ICON.check:''}</span>
        <span class="pq-txt"><b>${esc(p.label)}</b><small>${st.manual?'Ticked by you':st.best>=(p.goal.sec||p.goal.r)?`Your best: ${esc(st.txt)}`:st.via?`Passed in ${esc(st.via.title)}`:st.txt?`Your best so far: ${esc(st.txt)}`:'Not logged yet'}${fs&&!st.met?` · <button type="button" class="link" data-act="skill-view" data-id="${esc(fs.id)}">train it in ${esc(fs.title)}</button>`:''}</small></span>
        ${st.met&&!st.manual?'':`<button type="button" class="btn ghost quiet" data-act="pre-tick" data-id="${esc(st.id)}" aria-label="${st.manual?'Undo':'I can do this'}: ${esc(p.label)}">${st.manual?'Undo':'I can do this'}</button>`}
      </li>`; }).join('')}</ul>
    ${ps.all?'':`<p class="muted" style="margin:0;font-size:13px">Optional, but they protect your joints. Logging them ticks them off.</p>`}
  </div>`;
}
function fullDate(t){ const d=new Date(t); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; }
function sourcesBlock(keys, own){

function skillNeeds(sk){ const miss=new Set(); for(const st of sk.stages){ const ex=exById(st.key); if(ex) missing(ex).forEach(m=>miss.add(m)); } return [...miss]; }

function missing(ex){ const eq=myEq(); return (ex&&ex.needs||[]).filter(tok=>!tok.split('|').some(e=>!e||eq.has(e))).map(tok=>tok.split('|').filter(Boolean).map(e=>EQ_NAME[e]||e).join(' or ')); }

/* variations: same movement pattern you can do, closest difficulty and same muscle group first */
function variationsFor(ex, onlyAvail=true){

  const eq=myEq();
  const rel=RELATED[ex.pattern]||[]; const target=ex.lvl||3;

    .map(x=>({x, score:(x.pattern===ex.pattern?0:20)+(x.group===ex.group?0:6)+(x.lvl?Math.abs(target-x.lvl):0)+(x.type===ex.type?0:3)}))
    .sort((a,b)=>a.score-b.score||a.x.name.localeCompare(b.x.name)).map(o=>o.x);
}

const e1rm = (w,r) => r<=0||w<=0 ? 0 : (r===1 ? w : w*(1+r/30));
function fmtDur(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; }
function fmtMin(ms){ const m=Math.round(ms/60000); return m>=60? `${Math.floor(m/60)}h ${m%60}m` : `${m} min`; }
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekStart(t){ const d=new Date(t); d.setHours(0,0,0,0); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.getTime(); }

/* ---------- persistence ----------
   Every change goes into a small queue kept on this device first, then to the database.
   If the gym has no signal, the queue keeps it and retries until it gets through. */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function saveLocalAll(){ if(S.mode==='local') lsSet(LS_KEY,{workouts:S.workouts,routines:S.routines,custom:S.custom,settings:S.settings,bw:S.bw}); }
function setSync(t){ document.getElementById('sync').textContent = t; }
const LS_PENDING='ironlog.pending';
let pending = lsGet(LS_PENDING)||[];
function savePending(){ lsSet(LS_PENDING, pending); syncLabel(); }
function syncLabel(){
  if(S.mode==='local'){ setSync(navigator.onLine===false?'Offline · saved on this phone':'Saved on this phone'); return; }
  if(S.mode==='loading'){ setSync('Loading…'); return; }
  const n=pending.length;
  setSync(n ? `${n} change${n>1?'s':''} waiting to sync` : (navigator.onLine===false?'Offline':'Saved'));
}
function queueWrite(path, body){
  if(!db){ saveLocalAll(); return; }
  const op={path, body: body==null?null:clone(body), at:Date.now()};
  const i=pending.findIndex(x=>x.path===path);
  if(i>=0) pending.splice(i,1);
  pending.push(op); savePending(); flush();
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable',message:'timeout'}),ms))]);
let flushing=false, flushT=null;
async function flush(){
  if(!db||flushing||!pending.length){ syncLabel(); return; }
  flushing=true;
  try{
    while(pending.length){
      const op=pending[0];
      try{
        await withTimeout(op.body==null ? db.doc(op.path).delete() : db.doc(op.path).set(op.body), 15000);
        pending.shift(); savePending();
      }catch(e){
        const c=e&&e.code;
        if(c==='invalid_argument'||c==='transform_error'){ console.warn('Dropped a change the store refused', op.path, e); pending.shift(); savePending(); continue; }
        if(c==='quota_exceeded') toast('Storage is full. Delete some old workouts so new ones can save.');
        break;
      }
    }
  } finally {
    flushing=false; syncLabel();
    clearTimeout(flushT); if(pending.length) flushT=setTimeout(flush, 20000);
  }
}
window.addEventListener('online', ()=>flush());
window.addEventListener('offline', syncLabel);
/* show queued changes on top of what the database last sent */
function overlay(coll, arr){
  const out=arr.slice();
  for(const op of pending){ const parts=op.path.split('/'); if(parts.length!==2||parts[0]!==coll) continue;
    const i=out.findIndex(x=>x.id===parts[1]); if(i>=0) out.splice(i,1);
    if(op.body!=null) out.push(Object.assign({id:parts[1]},clone(op.body))); }
  return out;
}
function pendingDoc(path){ const op=pending.find(x=>x.path===path); return op?op:null; }

async function putWorkout(w){
  const i=S.workouts.findIndex(x=>x.id===w.id); if(i>=0) S.workouts[i]=w; else S.workouts.unshift(w);
  S.workouts.sort((a,b)=>b.startedAt-a.startedAt);
  const {id,...body}=w; queueWrite('workouts/'+id, body);
}
async function delWorkout(id){ S.workouts=S.workouts.filter(w=>w.id!==id); queueWrite('workouts/'+id, null); }
async function putRoutine(r){
  const i=S.routines.findIndex(x=>x.id===r.id); if(i>=0) S.routines[i]=r; else S.routines.push(r);
  const {id,...body}=r; queueWrite('routines/'+id, body);
}
async function delRoutine(id){ S.routines=S.routines.filter(r=>r.id!==id); queueWrite('routines/'+id, null); }
async function putCustom(){ queueWrite('library/custom', {items:S.custom}); }
async function putSettings(){ queueWrite('settings/main', S.settings); }
async function putBw(entry){
  const i=S.bw.findIndex(x=>x.id===entry.id); if(i>=0) S.bw[i]=entry; else S.bw.push(entry);
  S.bw.sort((a,b)=>a.t-b.t); const {id,...body}=entry; queueWrite('bodyweight/'+id, body);
}
async function delBw(id){ S.bw=S.bw.filter(x=>x.id!==id); queueWrite('bodyweight/'+id, null); }
async function dbTry(fn){ try{ await fn(); }catch(e){ console.warn(e); } }
let activeTimer=null;
function saveActive(){
  lsSet(LS_ACTIVE, S.active);
  clearTimeout(activeTimer);
  activeTimer=setTimeout(()=>{ if(db) dbTry(()=>withTimeout(db.doc('state/active').set({workout:S.active||null, at:Date.now()}),15000)); }, 700);
}

async function boot(){
  render();
  let cl=null;
  try{ cl = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ cl=null; }
  const localActive = lsGet(LS_ACTIVE);
  if(!cl){
    S.mode='local';
    const d=lsGet(LS_KEY)||{};
    S.workouts=(d.workouts||[]).sort((a,b)=>b.startedAt-a.startedAt); S.routines=d.routines||[]; S.custom=d.custom||[]; S.settings=Object.assign({rest:90},d.settings||{});
    S.bw=(d.bw||[]).sort((a,b)=>a.t-b.t);
    S.active=localActive||null; S.loaded={w:true,r:true};
    syncLabel(); render(); return;
  }
  db=cl; S.mode='cloud'; setSync('Syncing…');
  db.collection('workouts').orderBy('startedAt','desc').onSnapshot(snap=>{
    S.workouts=overlay('workouts', snap.docs.map(d=>Object.assign({id:d.id},clone(d.data())))).sort((a,b)=>b.startedAt-a.startedAt);
    S.loaded.w=true; syncLabel(); softRender();
  }, e=>{ setSync('Offline'); console.warn(e); });
  db.collection('routines').onSnapshot(snap=>{
    S.routines=overlay('routines', snap.docs.map(d=>Object.assign({id:d.id},clone(d.data())))).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name)); S.loaded.r=true; softRender();
  }, e=>console.warn(e));
  db.collection('bodyweight').onSnapshot(snap=>{
    S.bw=overlay('bodyweight', snap.docs.map(d=>Object.assign({id:d.id},clone(d.data())))).sort((a,b)=>a.t-b.t); softRender();
  }, e=>console.warn(e));
  db.doc('library/custom').onSnapshot(s=>{ const p=pendingDoc('library/custom'); S.custom=clone(p&&p.body?p.body.items:((s.exists && s.data().items)||[])); softRender(); }, e=>console.warn(e));
  db.doc('settings/main').onSnapshot(s=>{ S.settingsLoaded=true; const p=pendingDoc('settings/main'); if(p&&p.body) S.settings=Object.assign({rest:90},clone(p.body)); else if(s.exists) S.settings=Object.assign({rest:90},clone(s.data())); softRender(); }, e=>console.warn(e));
  try{
    const a=await withTimeout(db.doc('state/active').get(), 8000);
    const remote = a.exists ? a.data() : null;
    const r = remote && remote.workout;
    if(localActive && (!r || (localActive.updatedAt||0) >= (r.updatedAt||0))) S.active=localActive;
    else S.active=r?clone(r):null;
  }catch(e){ S.active=localActive||null; }
  render(); flush();
}

/* ---------- history helpers ---------- */
function lastSessionFor(exId, excludeId, beforeTs){
  for(const w of S.workouts){ if(w.id===excludeId) continue; if(beforeTs && w.startedAt>=beforeTs) continue; const e=(w.exercises||[]).find(x=>x.exId===exId); if(e && e.sets && e.sets.length) return {w,e}; }
  return null;
}
const working = sets => (sets||[]).filter(s=>!s.wu);
function setBests(sets){ const b={e1:0,reps0:0,sec:0}; for(const s of working(sets)){ const w=num(s.w),r=num(s.r);
  b.e1=Math.max(b.e1,e1rm(w,r)); if(!w) b.reps0=Math.max(b.reps0,r); b.sec=Math.max(b.sec,num(s.sec)); } return b; }
function bestOf(exId, beforeTs){
  const b={e1:0,reps0:0,sec:0,any:false};
  for(const w of S.workouts){ if(beforeTs && w.startedAt>=beforeTs) continue;
    for(const e of (w.exercises||[])) if(e.exId===exId){ b.any=true; const x=setBests(e.sets); b.e1=Math.max(b.e1,x.e1); b.reps0=Math.max(b.reps0,x.reps0); b.sec=Math.max(b.sec,x.sec); } }
  return b;
}
function isBw(e){ const ex=exById(e.exId); return ex? !!ex.bw : false; }
function setsSummary(e){ return setsSummary0(e)+(num(e.vest)?` (${fmtKg(num(e.vest))} kg vest)`:''); }
function setsSummary0(e){
  if(e.type==='cardio') return e.sets.map(s=>[s.min?`${s.min} min`:'', s.km?`${s.km} km`:''].filter(Boolean).join(' · ')).join(' / ');
  const tag=s=>(s.wu?'W ':''), rp=s=>(num(s.rpe)?` @${s.rpe}`:'');
  if(e.type==='hold') return e.sets.map(s=>`${tag(s)}${s.sec}s${num(s.w)?` +${fmtKg(num(s.w))}kg`:''}${rp(s)}`).join(' · ');
  const bw=isBw(e);
  return e.sets.map(s=>tag(s)+(num(s.w)?`${bw?'+':''}${fmtKg(num(s.w))}×${s.r}`:(bw?`${s.r}`:`BW×${s.r}`))+rp(s)).join(' · ')+(bw&&e.sets.every(s=>!num(s.w))?' reps':'');
}
function prText(p){ return p.sec?`${p.sec} s hold`:(p.w?`${fmtKg(p.w)} kg × ${p.r}`:`${p.r} reps`); }
function workoutVolume(w){ let v=0; for(const e of (w.exercises||[])) if(e.type==='strength'||!e.type) for(const s of working(e.sets)) v+=num(s.w)*num(s.r); return v; }

/* ---------- plates ---------- */
const PLATES=[25,20,15,10,5,2.5,1.25];
function platesFor(total, bar=20){
  if(total<=bar) return null;
  let side=(total-bar)/2; const out=[];
  for(const p of PLATES){ while(side>=p-1e-9){ out.push(p); side-=p; } }
  return {out, rem: Math.round(side*100)/100};
}
