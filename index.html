<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymBook</title>
<meta name="description" content="Log workouts, routines, calisthenics and progress. Works offline.">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GymBook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* base reset (the Claude version got this from its host page) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:inherit}a.btn.ghost{color:var(--accent)}a.btn.primary{color:var(--accent-ink)}
input,select,textarea{font-size:16px}
/* Layout: one narrow column like a training notebook; sticky header, bottom tab bar, floating rest-timer strip. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F5F6F8; --ink:#141820; --muted:#555D6B; --line:#D3D8DF;
  --accent:#1D4ED1; --accent-ink:#FFFFFF; --accent-soft:#E3EAFC;
  --pr:#B8232A; --pr-soft:#FBE6E7; --ok:#17703F; --ok-soft:#DFF2E7; --warn:#8A4B00; --warn-soft:#FCEFD9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --sunk:#12161B; --ink:#E8EBF0; --muted:#A0A8B4; --line:#2A3039;
  --accent:#7B9BFF; --accent-ink:#0A1024; --accent-soft:#1C2647;
  --pr:#FF7A7F; --pr-soft:#3A1B1E; --ok:#5ACB8A; --ok-soft:#15301F; --warn:#F2B35E; --warn-soft:#33240F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --sunk:#12161B; --ink:#E8EBF0; --muted:#A0A8B4; --line:#2A3039;
  --accent:#7B9BFF; --accent-ink:#0A1024; --accent-soft:#1C2647;
  --pr:#FF7A7F; --pr-soft:#3A1B1E; --ok:#5ACB8A; --ok-soft:#15301F; --warn:#F2B35E; --warn-soft:#33240F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.brand span{color:var(--accent)}
.sync{font-size:13px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:52px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs svg{width:22px;height:22px}

/* generic */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.danger{color:var(--pr)}
.btn.danger.armed{background:var(--pr);border-color:var(--pr);color:var(--surface)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:18px}
.btn svg{width:18px;height:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.section-h h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.note{font-size:13px;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--sunk)}

/* start screen */
.hero-start{display:flex;flex-direction:column;gap:12px}
.week{display:flex;gap:6px}
.week div{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--muted)}
.week div.on{background:var(--accent);color:var(--accent-ink)}
.week div.today{outline:2px solid var(--accent);outline-offset:-2px}
.routine-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.routine-pick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:84px;display:flex;flex-direction:column;gap:4px}
.routine-pick b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.routine-pick small{color:var(--muted);font-size:13px;line-height:1.3}

/* live workout */
.wk-head{display:flex;flex-direction:column;gap:4px}
.wk-name{font-family:var(--f-display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.02em;border:0;background:transparent;padding:0;width:100%;min-width:0}
.wk-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.wk-meta b{color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.ex header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.ex .last{font-size:13px;color:var(--muted);margin:2px 0 8px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.set-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.set-h span:last-child{text-align:center}
.set-row .n{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.set-row input{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.set-row input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.tick{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tick svg{width:22px;height:22px}
.set-row.done input{background:var(--ok-soft);border-color:transparent}
.set-row.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set-row.done .n{color:var(--ok)}
.ex-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.plates{font-size:13px;color:var(--muted)}
.plates b{color:var(--ink)}
.plates:empty{display:none}
.icon-btn{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}

/* rest strip */
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rest-in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.rest-t{font-family:var(--f-display);font-weight:700;font-size:30px;min-width:76px}
.rest-in .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;flex:1}
.rest-in button{min-height:44px;min-width:48px;border-radius:10px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;font-weight:600}
.rest.over .rest-in{background:var(--ok);color:var(--surface)}

/* history */
.month{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hist > button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;cursor:pointer;border-radius:var(--r)}
.hist > button:focus-visible{outline:2px solid var(--accent)}
.date-blk{text-align:center;line-height:1}
.date-blk b{display:block;font-family:var(--f-display);font-size:28px}
.date-blk small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist h3{font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.hist .sub{font-size:13px;color:var(--muted)}
.hist-body{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.hist-ex{display:flex;flex-direction:column;gap:2px}
.hist-ex b{font-weight:600}
.hist-ex span{font-size:14px;color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.stat small{font-size:12px;color:var(--muted)}
.weeks svg{width:100%;height:auto;display:block}
.prog{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.prog:focus-visible{outline:2px solid var(--accent)}
.prog h3{font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.prog .sub{font-size:13px;color:var(--muted)}
.prog svg{width:96px;height:36px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* routines */
.rt h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.rt ol{margin:6px 0 12px;padding-left:20px;color:var(--muted);font-size:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{min-width:44px;min-height:40px;border:0;background:var(--sunk);font-weight:700;font-size:18px}
.stepper span{min-width:64px;text-align:center;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 64px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - 96px - env(safe-area-inset-bottom,0px));border-radius:18px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.25);
  padding:0 16px 16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.sheet-b{overflow-y:auto;padding-top:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 12px;width:100%;min-width:0}
.pick-list{display:flex;flex-direction:column}
.pick-list .grp{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 2px 4px}
.pick-list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:0 6px;border-bottom:1px solid var(--line)}
.pick-list button:focus-visible{outline:2px solid var(--accent)}
.pick-list small{color:var(--muted);font-size:13px}
.rt-rest{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap}
.big-est{font-family:var(--f-display);font-weight:700;font-size:24px}
.rt-ex{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.rt-ex .nm{font-weight:600;min-width:0;padding-top:10px}
.plan-h,.plan-row{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.plan-h span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.plan-row .n{font-family:var(--f-display);font-weight:700;font-size:17px;text-align:center;color:var(--muted)}
.plan-row input{width:100%;min-width:0;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.plan-row input::placeholder{color:var(--muted);opacity:.6;font-weight:500;font-size:14px}
.set-h.has-rpe,.set-row.has-rpe{grid-template-columns:34px 1fr 1fr 58px 48px;gap:6px}
.set-row select{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:16px;font-weight:600;text-align:center;text-align-last:center;color:var(--ink);padding:0 2px;font-variant-numeric:tabular-nums}
button.n{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
button.n:focus-visible{outline:2px solid var(--accent)}
.set-row.wu button.n,button.n.is-wu{background:var(--warn-soft);color:var(--warn)}
.set-row.wu input{border-style:dashed}
.set-row.done select{background:var(--ok-soft);border-color:transparent}
textarea{font:inherit;color:var(--ink);width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:10px 12px;resize:vertical}
.ex-note{margin-top:8px;font-size:16px}
.export-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;white-space:pre;overflow:auto}
.hint{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 8px 8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:8px}
.hint span{flex:1 1 180px;min-width:0}
.hint .btn{min-height:40px;flex:none}
.ss-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ex.in-ss{border-color:var(--accent)}
.ex.ss-joined{margin-bottom:-6px;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.ex.ss-joined + .ex.in-ss{border-top-left-radius:4px;border-top-right-radius:4px}
.btn.quiet{color:var(--muted);padding:0 8px;font-size:14px}
.when{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-top:6px}
.when input,.field select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;width:100%;min-width:0}
.bw-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.bw-form input{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 10px;width:100%;min-width:0}
@media (max-width:420px){ .bw-form{grid-template-columns:1fr 1fr} .bw-form .btn{grid-column:1/-1} }
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.toast.update{display:flex;align-items:center;gap:12px;pointer-events:auto;top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;width:max-content;z-index:60}
.toast.update .btn{min-height:36px;background:var(--surface);color:var(--ink)}
.seg-wide{display:flex;width:100%}.seg-wide button{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.pgrid.skills{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pgrid.skills .pcard{min-height:0}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:96px}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard:hover{border-color:var(--muted)}
.pc-cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pc-title{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.pc-meta{font-size:13px;color:var(--muted)}
.pc-added{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ok);margin-top:auto}
.pc-added svg{width:14px;height:14px}
.pc-warn{font-size:12px;font-weight:600;color:var(--warn)}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ladder{display:inline-flex;gap:3px;flex:none}
.ladder i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.ladder i.done{background:var(--accent)}
.ladder i.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.src-tag{all:unset;cursor:pointer;display:inline-block;font-size:12px;font-weight:600;color:var(--accent);margin-top:2px}
.src-tag:focus-visible{outline:2px solid var(--accent)}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lead{margin:0;font-size:15px;line-height:1.5}
.psess{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}

/* turn a program's exercise list into routine items, swapping anything your equipment can't do */
function adaptList(list){
  const swaps=[]; const used=new Set(list.map(e=>e[0]).filter(id=>canDo(exById(id)||{})));
  const items=list.map(([id,sets,amt,opt])=>{
    const orig=exById(id); if(!orig) return null;
    let use=orig;
    if(!canDo(orig)){ const vs=variationsFor(orig); const same=vs.filter(x=>x.pattern===orig.pattern); const v=same.find(x=>!used.has(x.id))||same[0]||vs.find(x=>!used.has(x.id))||vs[0];
      if(v){ use=v; used.add(v.id); swaps.push({from:orig.name,to:v.name}); } }
    const t=use.type;
    const plan=Array.from({length:sets},()=> t==='cardio'?{min:'',km:''} : t==='hold'?{w:'',sec:String(orig.type==='hold'?amt:20)} : {w:'',r:String(orig.type==='hold'?6:amt)}).map(p=>opt&&opt.wu?Object.assign(p,{wu:true}):p);
    const it={exId:use.id,name:use.name,type:t,plan}; it.sets=plan.length; it.reps=planReps(it);
    it._orig=orig.id!==use.id?orig.name:null; it._amt=t==='hold'?(orig.type==='hold'?amt:20):(orig.type==='hold'?6:amt);
    return it;
  }).filter(Boolean);
  return {items, swaps};
}
const cleanItems = items => items.map(it=>{ const c=Object.assign({},it); delete c._orig; delete c._amt; return c; });

 'pushup':['Chest, shoulders and triceps','Hands under or just wider than shoulders, fingers forward|Squeeze glutes and brace your stomach so your body is a rigid plank|Lower until your chest nearly touches, elbows about 45° from your body|Press until arms lock and shoulder blades spread','Sagging hips or a half-range rep that stops short of the floor'],
 'wide-pushup':['Chest, with less triceps','Hands about one and a half shoulder widths apart|Keep the body in one line, glutes tight|Lower your chest between your hands under control|Press back up to straight arms','Going so wide the shoulders feel pinched. Bring the hands in a little'],
 'diamond-pushup':['Triceps and inner chest','Hands together under your chest, thumbs and index fingers forming a diamond|Elbows track back along your ribs, not out|Lower until your chest touches your hands|Press back up to locked arms','Letting the elbows flare wide, which strains the elbows and shoulders'],
 'decline-pushup':['Upper chest and shoulders','Feet on a bench or box, hands on the floor|Brace so your hips stay in line with your shoulders|Lower your face and chest towards the floor in front of your hands|Press to straight arms','Hips sagging towards the floor as you tire'],
 'ring-pushup':['Chest, shoulders, triceps and stabilisers','Set the rings a few centimetres off the floor and grip them neutral|Start with arms locked and rings close to your body|Lower with elbows tucked until the rings reach your chest|Press up and turn the rings out at the top','Letting the rings drift wide, which is hard on the shoulders'],
 'archer-pushup':['Chest, shoulders and triceps, one side at a time','Hands about twice shoulder width, fingers turned slightly out|Lower towards one hand while the other arm stays nearly straight|Most of your weight goes on the bent arm|Press back to the centre and alternate sides','Bending both arms equally, which makes it just a wide push-up'],
 'clap-pushup':['Chest and triceps, power','Start in a strong push-up position|Lower under control, then push the floor away as hard as you can|Clap quickly and get your hands back under your shoulders|Land with soft, slightly bent elbows and go into the next rep','Landing on locked arms or with hands too wide'],
 'incline-oap':['Chest, shoulders, triceps and core, one side','One hand on a bench or bar, feet wide for balance|Free hand behind your back, hips square to the floor|Lower your chest to the edge with the elbow close to your side|Press up without twisting your torso','Rotating the hips and chest open to make it easier'],
 'oap-negative':['Chest, shoulders, triceps and core, one side','Get into the top of a one-arm push-up, feet wide|Lower slowly for 3 to 5 seconds, staying square|At the bottom, put the other hand down and push back up with both|Reset and repeat','Dropping the last part instead of controlling it all the way'],
 'pseudo-planche':['Front shoulders, chest and wrists, for planche','Hands by your waist, fingers turned out or back|Lean your shoulders well forward of your hands before you start|Keep the lean as you lower and press|Protract (spread) your shoulder blades at the top','Losing the lean and drifting back into a normal push-up'],
 'one-arm-pushup':['Chest, shoulders, triceps and core, one side','Feet wide, working hand under your chest, free hand behind your back|Brace hard so hips stay level and square|Lower until your chest is a fist from the floor, elbow close to your side|Press up without twisting','Twisting the torso open or letting the hips sag'],
 'bench-dip':['Triceps and front shoulders','Hands on a bench edge behind you, fingers forward|Feet out in front, knees bent to make it easier|Lower until upper arms are about level with the floor|Press back up to straight arms','Going too deep, which strains the front of the shoulder'],
 'dips':['Chest, triceps and front shoulders','Start supported on parallel bars, arms locked, shoulders down|Lean slightly forward and lower until shoulders are just below elbows|Keep elbows pointing back, not out|Press to locked arms and push the shoulders down','Shrugging the shoulders up to the ears at the bottom'],
 'straight-bar-dip':['Chest, triceps and front shoulders, for muscle-ups','Support on top of a straight bar, hands shoulder width|Lean forward and let your legs come slightly in front of the bar|Lower until the bar is near your chest|Press back up to straight arms','Hanging back from the bar, which makes the rep stall halfway'],
 'ring-dip':['Chest, triceps and shoulder stabilisers','Start in a ring support, arms locked, rings by your hips|Lower with the rings close to your body until shoulders are below elbows|Press up and turn the rings out at the top|Keep the rings from drifting forward','Letting the rings wander out to the sides'],
 'pike-pushup':['Shoulders and triceps, for handstand push-ups','Hands on the floor, hips high in an upside-down V|Walk your feet in so your hips are over your hands as much as you can|Lower the top of your head to a spot in front of your hands|Press back to straight arms','Lowering straight down, which turns it into a push-up. Head goes forward of the hands'],
 'elevated-pike':['Shoulders and triceps, for handstand push-ups','Feet on a box or bench, hips stacked over your hands|Make a tripod: head lands a little in front of your hands|Elbows stay over the wrists, not flaring wide|Press until arms lock and shoulders reach the ears','Letting the hips drift back so the shoulders do less work'],
 'wall-hspu':['Shoulders and triceps','Kick up into a handstand facing away from the wall, hands a palm from it|Lower your head to a point forming a triangle with your hands|Keep your elbows from flaring past 45°|Press back to locked arms','Arching the lower back against the wall'],
 'hspu':['Shoulders, triceps and balance','Hold a freestanding handstand|Lower your head forward in a tripod, keeping balance with your fingers|Press back up while the legs stay stacked|Bail with a cartwheel if you tip over','Losing the line by piking or arching as you lower'],
 'ring-y':['Lower traps and rear shoulders','Hold the rings or straps, lean back with straight arms|Raise your arms up and out into a Y, keeping them straight|Pull your body up to the rings with that motion|Lower slowly','Bending the arms to turn it into a row'],
 'prone-ytw':['Upper back and rear shoulders','Lie face down, forehead on a towel|Lift straight arms up into a Y, thumbs up, then lower|Repeat out to the sides as a T, then bend elbows and pull back into a W|Keep the neck relaxed and ribs down','Shrugging or lifting the head'],
 'wall-walk':['Shoulders, core and handstand confidence','Start in a push-up with feet against the wall|Walk your feet up the wall while walking your hands back|Go as close to the wall as you can control|Walk back down the same way','Letting the lower back sag. Keep the ribs pulled in'],
 'wall-handstand':['Shoulders, core and balance','Chest to the wall: walk up until your nose is near the wall|Push the floor away so your shoulders are by your ears|Squeeze glutes and point toes so your body is one straight line|Breathe and hold; walk down when your form slips','A banana-shaped back. Tuck the ribs and squeeze the glutes'],
 'handstand':['Shoulders, core and balance','Kick up with straight arms, hands shoulder width, fingers spread|Push tall through your shoulders and stack hips over hands|Balance with your fingertips (falling forward) and the heels of your hands (falling back)|Bail by turning one hand and cartwheeling out','Looking far forward and arching the back'],
 'crow':['Wrists, shoulders and balance','Squat with hands flat, shoulder width, fingers spread|Rest your knees on the backs of your upper arms|Lean forward until your feet float|Look slightly ahead and hold','Not leaning far enough, so the feet never leave the floor'],
 'planche-lean':['Front shoulders, wrists and straight-arm strength','Push-up position with fingers turned out or back|Lock your elbows and spread your shoulder blades|Lean your shoulders forward past your hands as far as you can hold|Keep the body straight and hold','Bending the arms or letting the shoulder blades pinch together'],
 'tuck-planche':['Front shoulders, wrists and core','Hands by your hips, arms locked, fingers turned slightly out|Lean forward and pull your knees tight into your chest|Round your upper back and push the floor away|Hips up at about shoulder height and hold','Bent elbows. Locked arms are the whole point'],
 'adv-tuck-planche':['Front shoulders, wrists and core','From a tuck planche, open your hips so your back is flat|Knees stay bent and below the hips|Lean further forward to balance the longer lever|Keep shoulders spread and arms locked','Leaving the back rounded, which keeps it a normal tuck'],
 'straddle-planche':['Front shoulders, wrists, core and glutes','From an advanced tuck, extend your legs wide apart|Hips at shoulder height, legs straight and toes pointed|Lean further forward to stay balanced|Push the floor away the whole hold','Hips dropping below the shoulders'],
 'full-planche':['Front shoulders, wrists and full-body tension','Legs together and straight, body parallel to the floor|Lean far enough forward that your hips balance over your hands|Arms locked, shoulder blades spread, glutes squeezed|Hold the line from head to heels','Piking the hips up or bending the arms'],
 'superman':['Lower back, glutes and upper back','Lie face down, arms overhead|Lift arms, chest and legs a few centimetres off the floor|Squeeze glutes and keep the neck long|Hold briefly, then lower','Cranking the head up to look forward'],
 'arch-hold':['Lower back, glutes and upper back','Lie face down, arms overhead|Lift arms, chest and legs, squeezing glutes|Keep your arms straight and by your ears|Hold the shape and breathe','Bending the knees to get the legs higher'],
 'ring-row':['Upper back, lats and biceps','Hold the rings, walk your feet forward and lean back|Body straight from head to heels|Pull your chest to your hands, elbows close to your body|Lower to straight arms','Hips sagging so only the arms move'],
 'archer-row':['Upper back and lats, one side at a time','Lean back holding the rings or a bar, arms wide|Pull towards one hand while the other arm stays straight and out|Squeeze that shoulder blade back|Lower and alternate','Bending both arms evenly'],

 'lsit-pullup':['Lats, biceps and core','Hang and lift your straight legs to hip height|Hold the L as you pull up to the bar|Lower without letting the legs drop|Bend the knees if straight legs are too hard','Legs sinking as you pull'],
 'typewriter':['Lats and biceps, one side biased','Pull up with a wide grip until your chin is over the bar|Slide across towards one hand, straightening the other arm|Slide back to the other side|Lower from the centre','Dropping below the bar while moving across'],

 'explosive-pullup':['Lats and upper back, power, for muscle-ups','From a dead hang, pull as fast and high as you can|Aim to get your chest or waist to the bar|Keep the body hollow and legs together|Lower under control','Swinging the legs to make up the height'],
 'jump-muscle-up':['Pulling and pushing, transition practice','Stand under a low bar and jump into a high pull|Lean your chest over the bar and turn the wrists over|Press up to straight arms on top|Step down, do not drop','Not leaning far enough over the bar to get through'],

 'ring-muscle-up':['Lats, chest, triceps and stabilisers','Use a false grip (wrist on top of the ring)|Pull rings to your ribs, keeping them close|Lean forward and roll through into a deep dip|Press out to a ring support','Losing the false grip, which makes the transition near impossible'],
 'tuck-fl':['Lats, core and straight-arm strength','Hang with straight arms, then pull the bar down towards your hips|Tuck knees to chest and lift until your back is level with the floor|Arms stay locked, shoulders pulled down|Hold, then lower','Bent arms or hips sitting below the shoulders'],
 'adv-tuck-fl':['Lats, core and straight-arm strength','From a tuck front lever, open your hips so your back is flat|Knees bent at about 90°|Press the bar towards your hips to stay level|Hold with locked arms','Back rounding up again as you tire'],

 'german-hang':['Shoulder mobility for back lever and skin the cat','From a skin the cat, lower until your feet point down behind you|Relax into the stretch in the front of your shoulders|Hold briefly, then roll back up|Build time slowly','Jumping into a long hold before the shoulders are ready'],

 'cossack':['Quads, glutes, adductors and hip mobility','Stand with a very wide stance, toes slightly out|Sit down into one hip, the other leg straight with toes up|Keep the heel of the bent leg down|Shift across to the other side','Lifting the working heel off the floor'],

 'assisted-pistol':['Quads and glutes, one leg','Hold a post, ring or door frame|Stand on one leg, other leg straight out in front|Squat as deep as you can, using the hands only as needed|Stand back up','Pulling with the arms more than you need'],
 'box-pistol':['Quads and glutes, one leg','Stand on one leg in front of a box or bench|Lower slowly until you sit on it|Stand back up without rocking|Lower the box over time','Plopping down onto the box'],

 'box-jump':['Legs, power','Stand a short step from the box|Swing your arms and jump onto it|Land softly in a squat|Step down, do not jump down','Choosing a box so high you land in a deep squat'],

SKILLS.forEach(sk=>sk.stages.forEach(st=>{ st.sk=sk.id; }));
function howBtn(id, name){ return HOWTO[id]?`<button type="button" class="how-i" data-act="howto" data-id="${esc(id)}" aria-label="How to do ${esc(name||'')}">${ICON.info}</button>`:''; }
/* nearest easier and harder bodyweight versions of the same movement */
function howLadder(ex){
  if(!ex||ex.pattern==='prep'||!ex.lvl) return {};
  const same=LIB.filter(x=>x.pattern===ex.pattern&&x.id!==ex.id&&x.bw&&HOWTO[x.id]&&x.lvl);
  const lo=same.filter(x=>x.lvl<ex.lvl).sort((a,b)=>b.lvl-a.lvl)[0];
  const hi=same.filter(x=>x.lvl>ex.lvl).sort((a,b)=>a.lvl-b.lvl)[0];
  return {lo,hi};
}
function sheetHowto(ex){
  const h=ex&&HOWTO[ex.id]; if(!h) return '<p class="muted">No notes for this exercise yet.</p>';
  const [works,cues,mistake]=h; const {lo,hi}=howLadder(ex);
  const step=(x,l)=>x?`<button type="button" class="how-step" data-act="howto" data-id="${esc(x.id)}"><small>${l}</small><b>${esc(x.name)}</b></button>`:'';
  return `<p class="how-works"><span class="label">Works</span>${esc(works)}</p>
  <ol class="how-cues">${cues.split('|').map(c=>`<li>${esc(c)}</li>`).join('')}</ol>
  <div class="callout safety"><b>Common mistake</b><span>${esc(mistake)}</span></div>
  ${lo||hi?`<div class="how-ladder">${step(lo,'Easier')}${step(hi,'Harder')}</div>`:''}

/* ---------- persistence ----------
   Every change goes into a small queue kept on this device first, then to the database.
   If the gym has no signal, the queue keeps it and retries until it gets through. */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function syncLabel(){

  if(S.mode==='loading'){ setSync('Loading…'); return; }
  const n=pending.length;

function queueWrite(path, body){

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'unavailable',message:'timeout'}),ms))]);
let flushing=false, flushT=null;
async function flush(){
  if(!db||flushing||!pending.length){ syncLabel(); return; }
  flushing=true;

    while(pending.length){
      const op=pending[0];

        await withTimeout(op.body==null ? db.doc(op.path).delete() : db.doc(op.path).set(op.body), 15000);
        pending.shift(); savePending();
      }catch(e){
        const c=e&&e.code;
        if(c==='invalid_argument'||c==='transform_error'){ console.warn('Dropped a change the store refused', op.path, e); pending.shift(); savePending(); continue; }
        if(c==='quota_exceeded') toast('Storage is full. Delete some old workouts so new ones can save.');

async function boot(){

const PLATES=[25,20,15,10,5,2.5,1.25];
function platesFor(total, bar=20){
  if(total<=bar) return null;
  let side=(total-bar)/2; const out=[];
  for(const p of PLATES){ while(side>=p-1e-9){ out.push(p); side-=p; } }
  return {out, rem: Math.round(side*100)/100};
}

/* ---------- next up: which routine is due in your rotation ---------- */
function routineOf(w, rs){ if(w.src&&w.src.routine){ const r=rs.find(x=>x.id===w.src.routine); if(r) return r; } return rs.find(r=>r.name===w.name)||null; }
function nextUp(){
  const rs=[...S.routines].filter(r=>r.exercises&&r.exercises.length).sort((a,b)=>(a.order??0)-(b.order??0));
  const rot=rs.filter(r=>!(r.src&&r.src.skill)); if(!rot.length) return null;
  const fam=r=>r.src&&r.src.program?'p:'+r.src.program:'own';
  let lastW=null, lastR=null;
  for(const w of S.workouts){ const r=routineOf(w, rot); if(r){ lastW=w; lastR=r; break; } }
  if(!lastR){ const own=rot.filter(r=>fam(r)==='own'); return {r:(own[0]||rot[0]), first:true}; }
  const group=rot.filter(r=>fam(r)===fam(lastR)).sort((a,b)=>fam(lastR)==='own'?0:((a.src.session??0)-(b.src.session??0)));
  const r=group[(group.indexOf(lastR)+1)%group.length];
  let prevW=null; for(const w of S.workouts){ if(routineOf(w,rot)===r){ prevW=w; break; } }
  return {r, after:lastR, afterAt:lastW.startedAt, lastAt:prevW?prevW.startedAt:null};
}
function vNextUp(){

  return `<div class="card next-up">
    <div class="spread"><span class="label">Next up</span><span class="muted num" style="font-size:13px">${estText(r)}</span></div>

function weekCounts(){ const m=new Map(); for(const w of S.workouts){ const k=weekStart(w.startedAt); m.set(k,(m.get(k)||0)+1); } return m; }
function goalStreak(goal){

/* ---------- personal bests: worked out again from the whole log, so edits and deletes stay accurate ---------- */
function recomputePRs(){
  const best={}; const asc=[...S.workouts].sort((a,b)=>a.startedAt-b.startedAt);
  for(const w of asc){
    const prs=[];
    for(const e of (w.exercises||[])){ if(e.type==='cardio') continue; const prev=best[e.exId]; if(!prev) continue;
      const now=setBests(e.sets||[]);
      if(e.type==='hold'){ if(now.sec>prev.sec) prs.push({exId:e.exId,name:e.name,sec:now.sec,t:w.startedAt}); continue; }
      let top=null; for(const s of working(e.sets||[])){ const x=e1rm(s.w,s.r); if(!top||x>top.x) top={x,w:s.w,r:s.r}; }
      if(top && top.w>0 && top.x>prev.e1+0.01) prs.push({exId:e.exId,name:e.name,w:top.w,r:top.r,t:w.startedAt});
      else if(isBw(e) && now.reps0>prev.reps0 && prev.reps0>0) prs.push({exId:e.exId,name:e.name,w:0,r:now.reps0,t:w.startedAt});
    }
    for(const e of (w.exercises||[])){ if(e.type==='cardio') continue; const x=setBests(e.sets||[]); const b=best[e.exId]||(best[e.exId]={e1:0,reps0:0,sec:0});
      b.e1=Math.max(b.e1,x.e1); b.reps0=Math.max(b.reps0,x.reps0); b.sec=Math.max(b.sec,x.sec); }
    if(JSON.stringify(prs)!==JSON.stringify(w.prs||[])){ w.prs=prs; const {id,...body}=w; queueWrite('workouts/'+id, body); }
  }
}

/* supersets: exercises sharing an "ss" id are done back to back; rest comes after the last one */
function ssInfo(list){
  const out=[], names={}; let n=0;

    if(!e.ss){ out[i]=null; return; }
    const members=list.map((x,k)=>x.ss===e.ss?k:-1).filter(k=>k>=0);
    if(members.length<2){ out[i]=null; return; }
    if(!(e.ss in names)) names[e.ss]=String.fromCharCode(65+(n++%26));
    out[i]={L:names[e.ss], pos:members.indexOf(i)+1, size:members.length, nextSame: !!(list[i+1]&&list[i+1].ss===e.ss)};
  });
  return out;
}
function linkNext(list,i){ const a=list[i], b=list[i+1]; if(!a||!b) return; const g=a.ss||b.ss||('g'+uid());

  a.ss=g; b.ss=g; }

/* ---------- bar weight: enter total, plates added, or plates per side; the app stores the total ---------- */
const BAR_KINDS={barbell:20, ezbar:10, trapbar:25};

function incFor(ex){

  if(has('dumbbell')||has('kettlebell')) return 2;

}
function nextLevel(ex){ return ex&&ex.lvl ? variationsFor(ex).find(x=>x.pattern===ex.pattern&&x.lvl===ex.lvl+1&&x.type===ex.type) : null; }
function hintFor(e, prevE){
  const ex=exById(e.exId); if(!ex||!prevE||e.type==='cardio') return null;
  const ws=working(prevE.sets); if(!ws.length) return null;
  if(e.type==='hold'){
    const best=Math.max(...ws.map(s=>num(s.sec))); const h=nextLevel(ex);
    if(best>=60 && h) return {text:`You held ${best} s last time. Ready for ${h.name}?`, swap:h.id};
    return {text:`Best hold last time: ${best} s. Aim for ${best+5} s.`};
  }
  const firstWork=e.sets.find(s=>!s.wu)||{};
  const target=num(firstWork.t2)||num(e.targetR)||0;
  if(ex.bw){
    const minR=Math.min(...ws.map(s=>num(s.r))); const tgt=target||12; const added=Math.max(...ws.map(s=>num(s.w)));
    if(minR>=tgt){ const h=nextLevel(ex);

      return {text:`You hit ${tgt}+ reps on every set. Add 2.5 kg this time.`, w:r2(added+2.5), from:added}; }
    return {text:`Aim for ${tgt} reps on every set${added?` at +${fmtKg(added)} kg`:''}. Your lowest set last time was ${minR}.`};
  }
  const W=Math.max(...ws.map(s=>num(s.w))); if(!W) return null;
  const atW=ws.filter(s=>num(s.w)===W); const tgt=target||num(atW[0].r);
  if(atW.length>=Math.min(2,ws.length) && atW.every(s=>num(s.r)>=tgt)){ const nw=W+incFor(ex);
    return {text:`You hit ${tgt} reps on every set at ${fmtKg(W)} kg. Try ${fmtKg(nw)} kg.`, w:r2(nw), from:W}; }

function exerciseStats(){

function relCard(){
  const list=exerciseStats().filter(m=>m.type==='strength'||(!m.type&&m.kind!=='hold')).filter(m=>m.kind!=='hold'&&m.type!=='cardio');
  if(!S.bw.length) return `<div class="card stack" style="gap:6px"><span class="label">Strength vs bodyweight</span><p class="muted" style="margin:0;font-size:14px">Log your bodyweight below and each lift will show as a multiple of it, e.g. bench 1.1× bodyweight. Bodyweight moves like pull-ups count your body plus any vest.</p></div>`;
  const cut=Date.now()-90*864e5;
  const rows=list.map(m=>{ const rec=m.sessions.filter(s=>s.t>=cut&&s.rel); if(!rec.length) return null;
      const top=rec.reduce((a,b)=>b.rel>a.rel?b:a); const first=rec[0];
      return {name:m.name, exId:m.exId, rel:top.rel, kg:m.kind==='bw'?top.rel*top.bw:top.e1, n:m.sessions.length, change: rec.length>1 ? rec[rec.length-1].rel-first.rel : 0}; })
    .filter(Boolean).sort((a,b)=>b.n-a.n).slice(0,8);
  if(!rows.length) return '';
  const max=Math.max(2,...rows.map(r=>r.rel));
  return `<div class="card stack" style="gap:8px">
    <div class="spread"><span class="label">Strength vs bodyweight</span><span class="muted" style="font-size:12px">best in 90 days</span></div>

      <span class="mnum num">${fmtX(r.rel)}</span></button>`).join('')}</div>

}
function vProgress(){
  const head=`<div class="section-h"><h2>Progress</h2></div>`;
  if(!S.workouts.length) return `${head}${vBodyweight()}
    <div class="card empty"><h3>Nothing to chart yet</h3><p style="margin:0">After your first workout you'll see personal bests, estimated one-rep maxes and a trend line for every exercise.</p></div>`;
  const ws=weekStart(Date.now()), ms=new Date(); ms.setDate(1); ms.setHours(0,0,0,0);
  const wk=S.workouts.filter(w=>w.startedAt>=ws), mo=S.workouts.filter(w=>w.startedAt>=ms.getTime());
  const prs=S.workouts.reduce((a,w)=>a+(w.prs||[]).filter(p=>p.t>=ms.getTime()||w.startedAt>=ms.getTime()).length,0);
  const stats=exerciseStats().filter(m=>S.progTab==='cardio'?m.type==='cardio':m.type!=='cardio');
  const list=stats.length? stats.map(m=>{
    const last=m.sessions[m.sessions.length-1];
    let main, extra; const n=`${m.sessions.length} session${m.sessions.length===1?'':'s'}`, when=`last ${shortDate(last.t)}`;
    if(m.type==='cardio'){ const bestKm=Math.max(...m.sessions.map(s=>s.km)); const paces=m.sessions.filter(s=>s.pace).map(s=>s.pace); const bp=paces.length?Math.min(...paces):0;
      main=bestKm?`Longest ${fmtKg(bestKm)} km`:`${Math.max(...m.sessions.map(s=>s.min))} min best`; extra=[bp?`best pace ${Math.floor(bp)}:${String(Math.round(bp%1*60)).padStart(2,'0')}/km`:'', n, when].filter(Boolean).join(' · '); }
    else if(m.kind==='hold'){ main=`Longest hold ${Math.max(...m.sessions.map(s=>s.sec))} s`; extra=`${n} · ${when}`; }
    else if(m.kind==='bw'){ const r0=Math.max(...m.sessions.map(s=>s.reps0)); const heavy=Math.max(...m.sessions.map(s=>s.heavy)); const rx=Math.max(...m.sessions.map(s=>s.rel||0));
      main=[r0?`Best ${r0} reps`:'', rx?`${fmtX(rx)} BW`:''].filter(Boolean).join(' · ')||n; extra=[heavy?`heaviest +${fmtKg(heavy)} kg`:'', n, when].filter(Boolean).join(' · '); }
    else { const best=Math.max(...m.sessions.map(s=>s.e1)); const heavy=Math.max(...m.sessions.map(s=>s.heavy)); const rx=Math.max(...m.sessions.map(s=>s.rel||0));
      main=best?`e1RM ${fmtKg(Math.round(best*2)/2)} kg${rx?` · ${fmtX(rx)} BW`:''}`:n; extra=[heavy?`heaviest ${fmtKg(heavy)} kg`:'', n, when].filter(Boolean).join(' · '); }
    return `<button type="button" class="prog" data-act="prog-open" data-id="${esc(m.exId)}"><div class="prog-txt"><h3>${esc(m.name)}</h3><div class="prog-main num">${main}</div><div class="sub num">${extra}</div></div>${spark(m.sessions.map(s=>s.val),72,32)}</button>`;
  }).join('') : `<p class="note">No ${S.progTab} exercises logged yet.</p>`;
  return `${head}
  <div class="stats">
    <div class="stat"><b class="num">${wk.length}</b><small>workouts this week</small></div>
    <div class="stat"><b class="num">${mo.length}</b><small>this month</small></div>
    <div class="stat"><b class="num">${prs}</b><small>PRs this month</small></div>
  </div>
  ${muscleCard()}
  ${relCard()}
  ${skillsCard()}
  <div class="card weeks"><div class="label" style="margin-bottom:6px">Workouts per week</div>${weeksChart()}</div>
  ${vBodyweight()}
  <div class="spread"><span class="label">By exercise</span>
    <div class="seg" role="group" aria-label="Exercise type"><button type="button" data-act="prog-tab" data-v="strength" aria-pressed="${S.progTab==='strength'}">Strength</button><button type="button" data-act="prog-tab" data-v="cardio" aria-pressed="${S.progTab==='cardio'}">Cardio</button></div></div>
  <div class="stack" style="gap:8px">${list}</div>`;
}

function srcTag(r){

  if(r.src.program){ const p=PROGRAMS.find(x=>x.id===r.src.program); if(!p) return ''; return `<button type="button" class="src-tag" data-act="prog-view" data-id="${esc(p.id)}">${esc(p.title)} programme</button>`; }

}

/* ---------- sheet (modal) ---------- */
let sheet=null; // {kind, ...}
function openSheet(s){ sheet=s; renderSheet(); }
function closeSheet(){ sheet=null; document.getElementById('sheet-root').innerHTML=''; }
function renderSheet(){
  const root=document.getElementById('sheet-root'); if(!sheet){ root.innerHTML=''; return; }
  let title='', body='';
  if(sheet.kind==='picker'){ title='Add exercise'; body=sheetPicker(); }
  if(sheet.kind==='routine'){ title=sheet.r.id&&S.routines.some(x=>x.id===sheet.r.id)?'Edit routine':'New routine'; body=sheetRoutine(); }
  if(sheet.kind==='summary'){ title='Workout saved'; body=sheetSummary(); }
  if(sheet.kind==='swap'){ title='Swap exercise'; body=sheetSwap(); }
  if(sheet.kind==='equip'){ title='My equipment'; body=sheetEquip(); }
  if(sheet.kind==='program'){ const p=PROGRAMS.find(x=>x.id===sheet.id); title=p?p.title:'Programme'; body=sheetProgram(p); }
  if(sheet.kind==='skill'){ const sk=SKILLS.find(x=>x.id===sheet.id); title=sk?sk.title:'Skill'; body=sheetSkill(sk); }
  if(sheet.kind==='howto'){ const ex=exById(sheet.id); title=ex?ex.name:'How to'; body=sheetHowto(ex); }
  if(sheet.kind==='goal'){ title='Weekly goal'; body=sheetGoal(); }
  if(sheet.kind==='bw-all'){ title='Bodyweight'; body=sheetBwAll(); }
  if(sheet.kind==='export'){ title='Your export'; body=sheetExport(); }
  if(sheet.kind==='install'){ title='Add to home screen'; body=sheetInstall(); }
  if(sheet.kind==='exercise'){ const m=exerciseStats().find(x=>x.exId===sheet.exId); title=m?m.name:'Exercise'; body=sheetExercise(m); }
  const keepQ = document.getElementById('pick-q'); const q = keepQ? keepQ.value : (sheet.q||'');
  const oldB=root.querySelector('.sheet-b'); const keepTop = oldB && root.dataset.kind===sheet.kind+(sheet.id||'') ? oldB.scrollTop : 0;
  root.dataset.kind=sheet.kind+(sheet.id||'');
  root.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <div class="sheet-b">${body}</div></div></div>`;
  if(keepTop){ const nb=root.querySelector('.sheet-b'); if(nb) nb.scrollTop=keepTop; }
  const pq=document.getElementById('pick-q'); if(pq){ pq.value=q; filterPicker(); }
  updateEqCount();
}
function sheetPicker(){
  const eq=myEq();
  const groups=GROUPS.map(g=>{ const items=allEx().filter(e=>(e.group||'Custom')===g); if(!items.length) return '';
    return `<div class="grp" data-g="${g}">${g}</div>`+items.map(e=>{ const ok=canDo(e,eq);
      return `<button type="button" data-act="pick" data-id="${esc(e.id)}" data-name="${esc(e.name.toLowerCase())}" data-g="${esc(e.group||'Custom')}" data-cali="${e.cali?1:0}" data-ok="${ok?1:0}" class="${ok?'':'na'}">
        <span class="pk-main"><span>${esc(e.name)}</span><small>${ok?esc(e.type==='hold'?'Timed hold':needsText(e)):'Needs '+esc(missing(e).join(', '))}</small></span>${lvlTag(e)}</button>`; }).join(''); }).join('');
  const chips=['All','Calisthenics',...GROUPS].filter(g=>g!=='Custom'||S.custom.length).map(g=>`<button type="button" class="fchip" data-act="pick-filter" data-v="${g}" aria-pressed="${(sheet.filter||'All')===g}">${g}</button>`).join('');
  return `<div class="field"><label class="label" for="pick-q">Search</label><input id="pick-q" type="search" placeholder="e.g. squat, row, pistol, treadmill" autocomplete="off"></div>

    <div class="muted" style="font-size:14px">Not in the list? Create <b id="pick-new-name" style="color:var(--ink)"></b> as:</div>
    <div class="row"><button type="button" class="btn" data-act="pick-create" data-type="strength">Weight × reps</button><button type="button" class="btn" data-act="pick-create" data-type="hold">Timed hold</button><button type="button" class="btn" data-act="pick-create" data-type="cardio">Cardio</button></div>
  </div>
  <div class="pick-list" id="pick-list">${groups}</div>
  <p class="note" id="pick-none" hidden>Nothing matches. Try another filter, or create it above.</p>`;

function filterPicker(){
  const qEl=document.getElementById('pick-q'); if(!qEl) return;
  const q=(qEl.value||'').trim().toLowerCase(); const f=sheet.filter||'All'; const all=!!sheet.showAll;
  const list=document.getElementById('pick-list'); let exact=false, hidden=0, shown=0;
  list.querySelectorAll('button').forEach(b=>{
    const inF = f==='All' || (f==='Calisthenics'? b.dataset.cali==='1' : b.dataset.g===f);
    const inQ = !q || b.dataset.name.includes(q);
    const ok = b.dataset.ok==='1';
    if(inF&&inQ&&!ok&&!all) hidden++;
    const m = inF && inQ && (ok||all); b.hidden=!m; if(m) shown++; if(b.dataset.name===q) exact=true; });
  list.querySelectorAll('.grp').forEach(g=>{ let n=g.nextElementSibling, vis=false; while(n&&n.tagName==='BUTTON'){ if(!n.hidden) vis=true; n=n.nextElementSibling; } g.hidden=!vis; });
  document.getElementById('pick-hidden').textContent = hidden&&!all?`(${hidden} hidden)`:'';
  document.getElementById('pick-none').hidden = shown>0;
  const nw=document.getElementById('pick-new'); nw.hidden=!q||exact; document.getElementById('pick-new-name').textContent=qEl.value.trim();
}
function sheetSwap(){
  const src=sheet.exId? exById(sheet.exId) : null;
  if(!src) return '<p class="note">No variations for custom exercises.</p>';
  const avail=variationsFor(src,true);
  const miss=missing(src);
  const items=avail.map(x=>{ const d = src.lvl&&x.lvl ? (x.lvl<src.lvl?'Easier':x.lvl>src.lvl?'Harder':'Same level') : '';
    return `<button type="button" data-act="swap-pick" data-id="${esc(x.id)}"><span class="pk-main"><span>${esc(x.name)}</span><small>${esc(x.type==='hold'?'Timed hold · ':'')}${esc(needsText(x))}${d?` · ${d}`:''}</small></span>${lvlTag(x)}</button>`; }).join('');
  return `<p class="muted" style="margin:0;font-size:14px">${miss.length?`<b style="color:var(--ink)">${esc(src.name)}</b> needs ${esc(miss.join(', '))}. These work the same movement with what you have:`:`Variations of <b style="color:var(--ink)">${esc(src.name)}</b> you can do with your equipment:`}</p>

function updateEqCount(){

function setSkillStage(skId, i){
  const sk=SKILLS.find(x=>x.id===skId); if(!sk) return; const st=sk.stages[i]; if(!st) return;
  const a=adaptList(st.ex); const ex=cleanItems(a.items);
  const old=S.routines.find(r=>r.src&&r.src.skill===sk.id);
  const r={id:old?old.id:uid(), name:`${sk.title} · ${st.name}`, order:old?old.order:S.routines.length, rest:sk.rest, exercises:ex, src:{skill:sk.id, stage:i}};
  putRoutine(r);
  S.settings.skills=Object.assign({}, S.settings.skills||{}, {[sk.id]:i}); putSettings();
  return r;
}

/* ---------- workout actions ---------- */
function newExerciseEntry(ex, opts={}){
  const n=opts.sets||(ex.type==='cardio'?1:3);
  const entry={exId:ex.id,name:ex.name,type:ex.type,targetR:opts.reps||'',sets:Array.from({length:n},()=>blankSet(ex.type))};
  if(Array.isArray(opts.plan)&&opts.plan.length){
    const [f1,,f2]=fieldsFor(entry);
    entry.sets=opts.plan.map(p=>Object.assign(blankSet(ex.type),{t1:p[f1]??'',t2:p[f2]??''},p.wu?{wu:true}:{}));
  }
  if(opts.ss) entry.ss=opts.ss;
  const vc=vestCfg(ex.id); if(vc&&vc.on) entry.vest=vc.kg;
  return entry;
}
function blankSet(type, prev){ prev=prev||{}; return type==='cardio'?{min:'',km:'',done:false}:type==='hold'?{w:prev.w||'',sec:'',done:false}:{w:prev.w||'',r:'',done:false}; }
function swapEntry(entry, ex){
  const n=entry.sets.length||(ex.type==='cardio'?1:3);
  const old=exById(entry.exId), sameType=entry.type===ex.type;
  const kit=x=>x?(x.bw?'bw':String((x.needs||[])[0]||'')):'';
  entry.exId=ex.id; entry.name=ex.name;
  entry.type=ex.type;
  /* same kind of exercise: keep reps, ticks and notes; weights only carry over when the kit is the same (barbell to barbell, say) */
  if(sameType && entry.sets.length){ const keepW=kit(old)===kit(ex); entry.sets=entry.sets.map(s=>keepW?s:Object.assign({},s,{w:''})); }
  else entry.sets=Array.from({length:n},()=>blankSet(ex.type));
  const vc=vestCfg(ex.id); entry.vest=vc&&vc.on?vc.kg:null;
}
function blankPlan(type, prev){ prev=prev||{}; return type==='cardio'?{min:prev.min||'',km:prev.km||''}:type==='hold'?{w:prev.w||'',sec:prev.sec||'30'}:{w:prev.w||'',r:prev.r||'8'}; }
function routineItem(ex){ const n=ex.type==='cardio'?1:3; const it={exId:ex.id,name:ex.name,type:ex.type,plan:Array.from({length:n},()=>blankPlan(ex.type))}; it.sets=n; it.reps=planReps(it); return it; }
/* older routines stored only sets + reps; turn them into a per-set plan */
function ensurePlan(x){
  if(Array.isArray(x.plan)&&x.plan.length) return x;
  const n=Math.max(1,+x.sets||(x.type==='cardio'?1:3));
  x.plan=Array.from({length:n},()=>x.type==='cardio'?{min:'',km:''}:x.type==='hold'?{w:'',sec:String(x.reps||'')}:{w:'',r:String(x.reps||'')});
  return x;
}
function planReps(x){ const p=(x.plan||[])[0]||{}; return String((x.type==='hold'?p.sec:p.r)||''); }
function planSummary(x){
  ensurePlan(x); const [f1,,f2]=fieldsFor(x); const unit=x.type==='hold'?'s':'';
  if(x.type==='cardio'){ const p=x.plan[0]; return [p.min?`${p.min} min`:'',p.km?`${p.km} km`:''].filter(Boolean).join(' · '); }
  const fmt=p=>{ const a=num(p[f1]), b=p[f2]||'—'; return a?`${fmtKg(a)}×${b}${unit}`:`${b}${unit}`; };
  const same=x.plan.every(p=>String(p[f1]||'')===String(x.plan[0][f1]||'')&&String(p[f2]||'')===String(x.plan[0][f2]||''));
  if(same){ const p=x.plan[0]; const a=num(p[f1]); return `${x.plan.length}×${p[f2]||'—'}${unit}${a?` @ ${fmtKg(a)} kg`:''}`; }
  return x.plan.map(fmt).join(' · ');
}

async function finishWorkout(){
  const w=S.active;
  let startedAt=w.startedAt, endedAt=Date.now();
  if(w.mode){
    if(!startedAt||!isFinite(startedAt)){ toast('Pick the date and start time.'); document.getElementById('wk-date')?.focus(); return; }
    endedAt=startedAt+Math.max(1,num(w.durMin)||60)*60000;
  }
  const extra=s=>Object.assign({}, s.wu?{wu:true}:{}, num(s.rpe)?{rpe:num(s.rpe)}:{});
  const exercises=w.exercises.map(e=>{
    const sets=e.sets.map(s=>e.type==='cardio'?{min:num(s.min)||0,km:num(s.km)||0}:e.type==='hold'?Object.assign({w:num(s.w),sec:Math.round(num(s.sec))},extra(s)):Object.assign({w:num(s.w),r:Math.round(num(s.r))},extra(s)))
      .filter(s=>e.type==='cardio'?(s.min||s.km):e.type==='hold'?s.sec>0:s.r>0);
    const out={exId:e.exId,name:e.name,type:e.type,sets};
    if(num(e.vest)) out.vest=num(e.vest);
    if(e.note&&e.note.trim()) out.note=e.note.trim();
    if(e.ss) out.ss=e.ss;
    return out;
  }).filter(e=>e.sets.length);
  if(!exercises.length){ toast('Log at least one set with reps (or time) before saving.'); return; }
  const dropped=w.exercises.reduce((a,e)=>a+e.sets.filter(s=>e.type==='cardio'?false:e.type==='hold'?(num(s.w)&&!(num(s.sec)>0)):(num(s.w)&&!(Math.round(num(s.r))>0))).length,0);
  { const cnt={}; exercises.forEach(e=>{ if(e.ss) cnt[e.ss]=(cnt[e.ss]||0)+1; }); exercises.forEach(e=>{ if(e.ss&&cnt[e.ss]<2) delete e.ss; }); }
  const prs=[];
  for(const e of exercises){ if(e.type==='cardio') continue;
    const prev=bestOf(e.exId, startedAt); if(!prev.any) continue;
    const now=setBests(e.sets);
    if(e.type==='hold'){ if(now.sec>prev.sec) prs.push({exId:e.exId,name:e.name,sec:now.sec,t:startedAt}); continue; }
    let top=null; for(const s of working(e.sets)){ const x=e1rm(s.w,s.r); if(!top||x>top.x) top={x,w:s.w,r:s.r}; }
    if(top && top.w>0 && top.x>prev.e1+0.01) prs.push({exId:e.exId,name:e.name,w:top.w,r:top.r,t:startedAt});
    else if(isBw(e) && now.reps0>prev.reps0 && prev.reps0>0) prs.push({exId:e.exId,name:e.name,w:0,r:now.reps0,t:startedAt});
  }
  const done={id:w.id,name:(w.name||'Workout').trim()||'Workout',startedAt,endedAt,exercises,prs};
  if(w.note&&w.note.trim()) done.note=w.note.trim();
  if(w.rest) done.rest=w.rest;
  if(w.src) done.src=w.src;
  const mode=w.mode;
  const skObj=w.src&&w.src.skill?SKILLS.find(x=>x.id===w.src.skill):null; const skPre=skObj?{wasMastered:skillMastery(skObj).done}:null;
  S.active=null; saveActive(); stopRest();
  await putWorkout(done); recomputePRs();
  if(mode){ S.openHist=done.id; location.hash='#history'; render(); return; }
  render(); openSheet({kind:'summary',w:done,skill:skPre,dropped});
}

/* rest timer */
let rest=null; // {end, total}
let audioCtx=null;
/* rough session length: time under work per set, the routine's rest between sets, ~90 s to move between exercises */
function estimateSec(r){
  const rest=r.rest||S.settings.rest||90; let t=0, moves=0; const list=r.exercises||[];
  list.forEach((x0,i)=>{
    const x=ensurePlan(JSON.parse(JSON.stringify(x0)));
    const linked = x.ss && list[i+1] && list[i+1].ss===x.ss;
    if(i<list.length-1 && !linked) moves++;
    if(x.type==='cardio'){ t+=x.plan.reduce((a,p)=>a+(num(p.min)||20)*60,0); return; }
    for(const p of x.plan) t += x.type==='hold' ? (num(p.sec)||30)+10 : Math.max(20,(num(p.r)||8)*3);
    if(!linked) t += x.plan.reduce((a,p,j)=>a+(j<x.plan.length-1?(p.wu?Math.min(60,rest):rest):0),0);
  });
  return t + moves*90;
}
function estText(r){ const sec=estimateSec(r); if(!sec) return ''; const m=Math.max(5,Math.round(sec/300)*5); return m>=60?`~${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`:`~${m} min`; }
/* this workout's rest: the routine's own if it has one, else the default */
function restFor(){ return (S.active&&S.active.rest)||S.settings.rest||90; }
function startRest(sec){ rest={end:Date.now()+sec*1000,total:sec,beeped:false}; document.getElementById('rest').hidden=false; tick(); }
function stopRest(){ rest=null; const el=document.getElementById('rest'); el.hidden=true; el.classList.remove('over'); }
function beep(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{ if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5);
    o.start(); o.stop(audioCtx.currentTime+0.55); }catch(e){}
}
function tick(){
  if(S.active && S.active.startedAt && !S.active.mode){ const el=document.getElementById('elapsed'); if(el) el.textContent=fmtDur(Date.now()-S.active.startedAt); }
  if(rest){
    const left=rest.end-Date.now(); const el=document.getElementById('rest');
    if(left<=0){ el.classList.add('over'); document.getElementById('rest-t').textContent='Go'; document.getElementById('rest-lbl').textContent='Rest over: next set';
      document.getElementById('rest-bar').style.width='100%'; if(!rest.beeped){ rest.beeped=true; beep(); } if(left<-60000) stopRest(); }
    else { el.classList.remove('over'); document.getElementById('rest-t').textContent=fmtDur(left+999); document.getElementById('rest-lbl').textContent='Rest';
      document.getElementById('rest-bar').style.width=(100-left/(rest.total*1000)*100).toFixed(1)+'%'; }
  }
}

function applySwap(sw, ex){
  if(sw.ctx==='workout'){ const en=S.active&&S.active.exercises[sw.idx]; if(en){ swapEntry(en, ex); touch(); } closeSheet(); render(); return; }
  const back=sw.back; const it=back.r.exercises[sw.idx];

    it.plan = sameType ? old.map(p=>Object.assign({},p)) : (ex.type==='cardio'?[blankPlan('cardio')]:Array.from({length:n},()=>blankPlan(ex.type)));

function csvCell(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildCsv(){
  const rows=[['Date','Start time','Workout','Duration (min)','Exercise','Superset','Set','Warm-up','Weight (kg)','Reps','Seconds','Minutes','Distance (km)','RPE','Vest (kg)','Bodyweight (kg)','Exercise note','Workout note']];
  for(const w of [...S.workouts].sort((a,b)=>a.startedAt-b.startedAt)){
    const d=new Date(w.startedAt), z=n=>String(n).padStart(2,'0'); const ss=ssInfo(w.exercises||[]); const b=bwAt(w.startedAt);
    (w.exercises||[]).forEach((e,i)=>{ let k=0; e.sets.forEach(s=>{
      rows.push([todayISO(w.startedAt), `${z(d.getHours())}:${z(d.getMinutes())}`, w.name, Math.round(((w.endedAt||w.startedAt)-w.startedAt)/60000), e.name, ss[i]?ss[i].L:'',
        s.wu?'W':++k, s.wu?'yes':'', e.type==='cardio'?'':(s.w??''), s.r??'', s.sec??'', s.min??'', s.km??'', s.rpe??'', e.vest??'', b??'', e.note||'', w.note||'']); }); });
  }
  return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
/* phones get the share sheet (Save to Files, Drive, email…); computers get a normal download */
async function offerFile(name, data){
  const type=name.endsWith('.csv')?'text/csv':'application/json';
  const blob=new Blob([data],{type});
  try{
    const file=new File([blob], name, {type});
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name}); return true;
    }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  try{
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); toast('Download started'); return true;
  }catch(e){ openSheet({kind:'export', name, data}); return false; }
}

/* ---------- import a backup (from the Claude version or this app) ---------- */
function importBackup(text){
  let d; try{ d=JSON.parse(text); }catch(e){ toast("That file isn't a GymBook backup."); return; }
  if(!d || typeof d!=='object' || !(Array.isArray(d.workouts)||Array.isArray(d.routines))){ toast("That file isn't a GymBook backup."); return; }
  const merge=(cur, inc, key)=>{ const map=new Map(cur.map(x=>[x[key],x])); let n=0; for(const x of (inc||[])){ if(x&&x[key]!=null){ if(!map.has(x[key])) n++; map.set(x[key], x); } } return [[...map.values()], n]; };
  let n1,n2,n3;
  [S.workouts,n1]=merge(S.workouts, (d.workouts||[]).filter(w=>w&&w.id&&isFinite(w.startedAt)), 'id');
  [S.routines,n2]=merge(S.routines, (d.routines||[]).filter(r=>r&&r.id&&Array.isArray(r.exercises)), 'id');
  [S.bw,n3]=merge(S.bw, (d.bodyweight||[]).filter(x=>x&&x.id&&isFinite(x.t)), 'id');
  [S.custom]=merge(S.custom, d.customExercises||[], 'id');
  if(d.settings && typeof d.settings==='object') S.settings=Object.assign({rest:90}, d.settings, {lastBackup:S.settings.lastBackup||d.settings.lastBackup});
  S.workouts.sort((a,b)=>b.startedAt-a.startedAt); S.bw.sort((a,b)=>a.t-b.t);
  recomputePRs();
  S.loaded={w:true,r:true}; saveLocalAll(); render();
  toast(`Imported ${n1} workout${n1===1?'':'s'}, ${n2} routine${n2===1?'':'s'}, ${n3} weigh-in${n3===1?'':'s'}`);
}
