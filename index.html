<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymBook</title>
<script>try{var _t=localStorage.getItem('gymbook.theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<meta name="description" content="Log workouts, routines, calisthenics and progress. Works offline.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GymBook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* base reset (the Claude version got this from its host page) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:inherit}a.btn.ghost{color:var(--accent)}a.btn.primary{color:var(--accent-ink)}
input,select,textarea{font-size:16px}
/* Layout: one narrow column like a training notebook; sticky header, bottom tab bar, floating rest-timer strip. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#F5F6F8; --ink:#141820; --muted:#555D6B; --line:#D3D8DF;
  --accent:#1D4ED1; --accent-ink:#FFFFFF; --accent-soft:#E3EAFC;
  --pr:#B8232A; --pr-soft:#FBE6E7; --ok:#17703F; --ok-soft:#DFF2E7; --warn:#8A4B00; --warn-soft:#FCEFD9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --sunk:#12161B; --ink:#E8EBF0; --muted:#A0A8B4; --line:#2A3039;
  --accent:#7B9BFF; --accent-ink:#0A1024; --accent-soft:#1C2647;
  --pr:#FF7A7F; --pr-soft:#3A1B1E; --ok:#5ACB8A; --ok-soft:#15301F; --warn:#F2B35E; --warn-soft:#33240F; color-scheme:dark }}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --sunk:#12161B; --ink:#E8EBF0; --muted:#A0A8B4; --line:#2A3039;
  --accent:#7B9BFF; --accent-ink:#0A1024; --accent-soft:#1C2647;
  --pr:#FF7A7F; --pr-soft:#3A1B1E; --ok:#5ACB8A; --ok-soft:#15301F; --warn:#F2B35E; --warn-soft:#33240F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.brand span{color:var(--accent)}
.sync{font-size:13px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:52px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs svg{width:22px;height:22px}

/* generic */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.danger{color:var(--pr)}
.btn.danger.armed{background:var(--pr);border-color:var(--pr);color:var(--surface)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:18px}
.btn svg{width:18px;height:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px}
.section-h h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.note{font-size:13px;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--sunk)}

/* start screen */
.hero-start{display:flex;flex-direction:column;gap:12px}
.week{display:flex;gap:6px}
.week div{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--muted)}
.week div.on{background:var(--accent);color:var(--accent-ink)}
.week div.today{outline:2px solid var(--accent);outline-offset:-2px}
.routine-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.routine-pick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:84px;display:flex;flex-direction:column;gap:4px}
.routine-pick b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.routine-pick small{color:var(--muted);font-size:13px;line-height:1.3}

/* live workout */
.wk-head{display:flex;flex-direction:column;gap:4px}
.wk-name{font-family:var(--f-display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.02em;border:0;background:transparent;padding:0;width:100%;min-width:0}
.wk-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.wk-meta b{color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.ex header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.ex .last{font-size:13px;color:var(--muted);margin:2px 0 8px}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:8px;align-items:center}
.set-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.set-h span:last-child{text-align:center}
.set-row .n{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.set-row input{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.set-row input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.tick{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tick svg{width:22px;height:22px}
.set-row.done input{background:var(--ok-soft);border-color:transparent}
.set-row.done .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set-row.done .n{color:var(--ok)}
.ex-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.plates{font-size:13px;color:var(--muted)}
.plates b{color:var(--ink)}
.plates:empty{display:none}
.icon-btn{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}

/* rest strip */
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:7;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rest-in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.rest-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.rest-t{font-family:var(--f-display);font-weight:700;font-size:30px;min-width:76px}
.rest-in .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;flex:1}
.rest-in button{min-height:44px;min-width:48px;border-radius:10px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;font-weight:600}
.rest.over .rest-in{background:var(--ok);color:var(--surface)}

/* history */
.month{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hist > button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;cursor:pointer;border-radius:var(--r)}
.hist > button:focus-visible{outline:2px solid var(--accent)}
.date-blk{text-align:center;line-height:1}
.date-blk b{display:block;font-family:var(--f-display);font-size:28px}
.date-blk small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist h3{font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.hist .sub{font-size:13px;color:var(--muted)}
.hist-body{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.hist-ex{display:flex;flex-direction:column;gap:2px}
.hist-ex b{font-weight:600}
.hist-ex span{font-size:14px;color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.stat small{font-size:12px;color:var(--muted)}
.weeks svg{width:100%;height:auto;display:block}
.prog{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.prog:focus-visible{outline:2px solid var(--accent)}
.prog h3{font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.prog .sub{font-size:13px;color:var(--muted)}
.prog svg{width:96px;height:36px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* routines */
.rt h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.rt ol{margin:6px 0 12px;padding-left:20px;color:var(--muted);font-size:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{min-width:44px;min-height:40px;border:0;background:var(--sunk);font-weight:700;font-size:18px}
.stepper span{min-width:64px;text-align:center;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 64px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - 96px - env(safe-area-inset-bottom,0px));border-radius:18px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.25);
  padding:0 16px 16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.sheet-b{overflow-y:auto;padding-top:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 12px;width:100%;min-width:0}
.pick-list{display:flex;flex-direction:column}
.pick-list .grp{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 2px 4px}
.pick-list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:0 6px;border-bottom:1px solid var(--line)}
.pick-list button:focus-visible{outline:2px solid var(--accent)}
.pick-list small{color:var(--muted);font-size:13px}
.rt-rest{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap}
.big-est{font-family:var(--f-display);font-weight:700;font-size:24px}
.pbar{display:block;height:8px;border-radius:99px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pbar.ok i{background:var(--ok)}
.prog-run b{display:inline-flex;align-items:center;gap:6px}.prog-run b svg{width:18px;height:18px;color:var(--ok)}
.pc-added:has(.pbar){flex-wrap:wrap}
.pc-added .pbar{flex:0 0 100%;width:100%;margin-top:4px;height:5px}
.lg-row{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:4px 0;color:inherit;font:inherit;width:100%;cursor:pointer}
.lg-row b{font-size:15px}.lg-v{font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.lg-v svg{width:16px;height:16px;color:var(--ok)}
.lg-row small{font-size:12px}
.hist-search{margin:8px 0 0}
.ex-search{margin:0}
.pv-seg{margin:0 0 2px}
.prog-line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cmp-list{display:flex;flex-direction:column;gap:6px}
.cmp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.cmp-n{display:flex;flex-direction:column;min-width:0;font-weight:600;font-size:14px}.cmp-n small{font-weight:500;font-size:12px}
.cmp{flex:none;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.cmp.up{color:var(--ok)}.cmp.down{color:var(--warn)}
.hist-ex .cmp{margin-left:6px;font-size:12px}
.rtx-move{display:flex;flex-wrap:nowrap;flex-shrink:0;gap:4px;align-items:center}
.rtx-move [data-act="rt-ex-move"]{border:1px solid var(--line);border-radius:10px;width:40px;height:40px;background:var(--card)}
.rt-ex{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.rt-ex .nm{font-weight:600;min-width:0;padding-top:10px}
.plan-h,.plan-row{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.plan-h span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.plan-row .n{font-family:var(--f-display);font-weight:700;font-size:17px;text-align:center;color:var(--muted)}
.plan-row input{width:100%;min-width:0;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.plan-row input::placeholder{color:var(--muted);opacity:.6;font-weight:500;font-size:14px}
.set-h.has-rpe,.set-row.has-rpe{grid-template-columns:34px 1fr 1fr 58px 48px;gap:6px}
.set-row select{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:16px;font-weight:600;text-align:center;text-align-last:center;color:var(--ink);padding:0 2px;font-variant-numeric:tabular-nums}
button.n{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
button.n:focus-visible{outline:2px solid var(--accent)}
.set-row.wu button.n,button.n.is-wu{background:var(--warn-soft);color:var(--warn)}
.set-row.wu input{border-style:dashed}
.set-row.done select{background:var(--ok-soft);border-color:transparent}
textarea{font:inherit;color:var(--ink);width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:10px 12px;resize:vertical}
.ex-note{margin-top:8px;font-size:16px}
.export-text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;white-space:pre;overflow:auto}
.hint{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 8px 8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:8px}
.hint span{flex:1 1 180px;min-width:0}
.hint .btn{min-height:40px;flex:none}
.ss-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ex.in-ss{border-color:var(--accent)}
.ex.ss-joined{margin-bottom:-6px;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.ex.ss-joined + .ex.in-ss{border-top-left-radius:4px;border-top-right-radius:4px}
.btn.quiet{color:var(--muted);padding:0 8px;font-size:14px}
.when{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-top:6px}
.when input,.field select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;width:100%;min-width:0}
.bw-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.bw-form input{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 10px;width:100%;min-width:0}
@media (max-width:420px){ .bw-form{grid-template-columns:1fr 1fr} .bw-form .btn{grid-column:1/-1} }
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}

/* turn a program's exercise list into routine items, swapping anything your equipment can't do */
function adaptList(list){
  const swaps=[]; const used=new Set(list.map(e=>e[0]).filter(id=>canDo(exById(id)||{})));
  const items=list.map(([id,sets,amt,opt])=>{
    const orig=exById(id); if(!orig) return null;
    let use=orig;
    if(!canDo(orig)){ const vs=variationsFor(orig); const same=vs.filter(x=>x.pattern===orig.pattern); const v=same.find(x=>!used.has(x.id))||same[0]||vs.find(x=>!used.has(x.id))||vs[0];
      if(v){ use=v; used.add(v.id); swaps.push({from:orig.name,to:v.name}); } }
    const t=use.type;
    const plan=Array.from({length:sets},()=> t==='cardio'?{min:orig.type==='cardio'&&amt?String(amt):'',km:''} : t==='hold'?{w:'',sec:String(orig.type==='hold'?amt:20)} : {w:'',r:String(orig.type==='hold'?6:amt)}).map(p=>opt&&opt.wu?Object.assign(p,{wu:true}):p);
    const it={exId:use.id,name:use.name,type:t,plan}; it.sets=plan.length; it.reps=planReps(it);
    it._orig=orig.id!==use.id?orig.name:null; it._amt=t==='hold'?(orig.type==='hold'?amt:20):(orig.type==='hold'?6:amt);
    return it;
  }).filter(Boolean);
  return {items, swaps};
}
const cleanItems = items => items.map(it=>{ const c=Object.assign({},it); delete c._orig; delete c._amt; return c; });
