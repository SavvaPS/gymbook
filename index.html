    }
    case 'vest-on': setVestPref(b.closest('.bar-ctl').dataset.exid, {on:b.dataset.v==='1'}); break;
    case 'rt-rest': { const r=sheet.r; r.rest=Math.max(15,Math.min(600,(r.rest||S.settings.rest||90)+(+b.dataset.d))); renderSheet(); break; }
    case 'rt-rest-reset': { delete sheet.r.rest; renderSheet(); break; }
    case 'bar-mode': setBarPref(b.closest('.bar-ctl').dataset.exid, {mode:b.dataset.v}); break;
    case 'begin': if(S.active && !S.active.startedAt){ S.active.startedAt=Date.now(); touch(); render(); window.scrollTo(0,0); } break;
    case 'done': {
      if(!S.active.startedAt && !S.active.mode){ toast('Press Start workout first.'); break; }
      try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); else if(audioCtx.state==='suspended') audioCtx.resume(); }catch(_){}
      const row=b.closest('.set-row'); const s=e.sets[+row.dataset.set];
      if(!s.done){
        row.querySelectorAll('input').forEach(inp=>{ if(!inp.value && inp.placeholder){ inp.value=inp.placeholder; setField(e, s, inp.dataset.f, inp.placeholder, row); } });
        const ok = e.type==='cardio' ? (num(s.min)||num(s.km)) : e.type==='hold' ? num(s.sec)>0 : num(s.r)>0;
        if(!ok){ toast(e.type==='cardio'?'Enter the time or distance first.':e.type==='hold'?'Enter how many seconds you held it.':'Enter the reps first.'); row.querySelectorAll('input')[1].focus(); break; }
        s.done=true;
        if(!S.active.mode){
          const i=+art.dataset.ex, nx=S.active.exercises[i+1];
          if(e.ss && nx && nx.ss===e.ss && !s.wu){ stopRest(); toast(`Superset: straight on to ${nx.name}`); }
          else startRest(s.wu ? Math.min(60, restFor()) : restFor());
        }
      } else s.done=false;
      row.classList.toggle('done',s.done); b.setAttribute('aria-pressed',s.done);
      updMeta();
      const pl=art.querySelector('[data-plates]'); if(pl) pl.innerHTML=platesText(e);
      touch(); break;
    }
    case 'add-set': { e.sets.push(blankSet(e.type, e.sets[e.sets.length-1])); touch(); render(); break; }
    case 'del-set': e.sets.pop(); touch(); render(); break;
    case 'ex-del': { if(!armed(b,'Remove?')) break; S.active.exercises.splice(+art.dataset.ex,1); touch(); render(); break; }
    case 'ex-up': { const i=+art.dataset.ex; if(i>0){ const a=S.active.exercises; [a[i-1],a[i]]=[a[i],a[i-1]]; touch(); render(); } break; }
    case 'finish': await finishWorkout(); break;
    case 'discard': { const ready=!S.active.startedAt||!!S.active.mode; if(!ready && !armed(b,'Confirm?')) break; S.active=null; saveActive(); stopRest(); render(); break; }
    case 'rest-minus': if(rest){ rest.end-=15000; rest.total=Math.max(15,rest.total-15); rest.beeped=false; tick(); } break;
    case 'rest-plus': if(rest){ if(rest.end<Date.now()) rest.end=Date.now(); rest.end+=15000; rest.total+=15; rest.beeped=false; tick(); } break;
    case 'rest-skip': stopRest(); break;

    case 'hist-toggle': S.openHist = S.openHist===b.dataset.id?null:b.dataset.id; render(); break;
    case 'hist-del': { if(!armed(b,'Tap again to delete')) break; await delWorkout(b.dataset.id); recomputePRs(); render(); toast('Workout deleted'); break; }
    case 'hist-repeat': {
      if(S.active){ toast('Finish or discard your current workout first.'); break; }
      const w=S.workouts.find(x=>x.id===b.dataset.id); if(!w) break;
      startWorkout(w.name, w.exercises.map(x=>newExerciseEntry(exById(x.exId)||{id:x.exId,name:x.name,type:x.type},{sets:x.sets.length,ss:x.ss,
        plan:x.sets.map(st=>Object.assign({}, st, {w:num(st.w)?String(st.w):'', r:st.r!=null?String(st.r):'', sec:st.sec!=null?String(st.sec):''}))})), w.rest||null); break;
    }
    case 'hist-routine': {
      const w=S.workouts.find(x=>x.id===b.dataset.id); if(!w) break;
      openSheet({kind:'routine', r:{id:uid(),name:w.name,order:S.routines.length,exercises:w.exercises.map(x=>{ const it={exId:x.exId,name:x.name,type:x.type,plan:x.sets.map(s=>x.type==='cardio'?{min:String(s.min||''),km:String(s.km||'')}:x.type==='hold'?Object.assign({w:num(s.w)?String(s.w):'',sec:String(s.sec||'')},s.wu?{wu:true}:{}):Object.assign({w:num(s.w)?String(s.w):'',r:String(s.r||'')},s.wu?{wu:true}:{}))}; if(x.ss) it.ss=x.ss; it.sets=it.plan.length; it.reps=planReps(it); return it; }), rest:w.rest||undefined}}); break;
    }

    case 'hist-edit': {
      if(S.active){ toast('Finish or discard the workout in progress first.'); location.hash='#workout'; break; }
      const w=S.workouts.find(x=>x.id===b.dataset.id); if(!w) break;
      S.active={id:w.id, mode:'edit', name:w.name, startedAt:w.startedAt, durMin:Math.max(1,Math.round(((w.endedAt||w.startedAt)-w.startedAt)/60000)), note:w.note||'', updatedAt:Date.now(),
        exercises:clone(w.exercises||[]).map(e=>Object.assign(e,{sets:e.sets.map(st=>Object.assign({},st,{done:true}))}))};
      if(w.rest) S.active.rest=w.rest;
      saveActive(); location.hash='#workout'; render(); window.scrollTo(0,0); break;
    }
    case 'log-past': {
      if(S.active){ toast('Finish or discard the workout in progress first.'); location.hash='#workout'; break; }
      const t=new Date(); t.setHours(t.getHours()-2,0,0,0);
      S.active={id:uid(), mode:'log', name:'Workout', startedAt:t.getTime(), durMin:'60', note:'', updatedAt:Date.now(), exercises:[]};
      saveActive(); location.hash='#workout'; render(); window.scrollTo(0,0); break;
    }
    case 'ex-toggle': { e.collapsed=!e.collapsed; touch(); render(); break; }
    case 'ex-all': { const close=b.dataset.v==='close'; S.active.exercises.forEach(x=>{ x.collapsed=close; }); touch(); render(); break; }
    case 'rt-toggle': { const i=+b.closest('.rt-ex').dataset.i; sheet.coll=Object.assign({},sheet.coll||{}); sheet.coll[i]=!sheet.coll[i]; renderSheet(); break; }
    case 'rt-all': { const close=b.dataset.v==='close'; sheet.coll={}; if(close) sheet.r.exercises.forEach((_,k)=>{ sheet.coll[k]=true; }); renderSheet(); break; }
    case 'wu': { const row=b.closest('.set-row'); const st=e.sets[+row.dataset.set]; if(st.wu) delete st.wu; else st.wu=true; touch(); render(); break; }
    case 'ex-note': e.note=''; render(); document.querySelector(`.ex[data-ex="${art.dataset.ex}"] [data-note]`)?.focus(); break;
    case 'ss-link': linkNext(S.active.exercises, +art.dataset.ex); touch(); render(); break;
    case 'ss-leave': unlink(S.active.exercises, +art.dataset.ex); touch(); render(); break;
    case 'hint-apply': {
      const nw=b.dataset.w, from=b.dataset.from;
      for(const st of e.sets){ if(st.done||st.wu) continue; const cur=st.w===''||st.w==null ? (st.t1??'') : st.w;
        if(cur===''||!num(cur)||from===''||num(cur)===num(from)) { st.w=nw; if(st.t1!==undefined) st.t1=nw; } }
      touch(); render(); toast(`Working sets set to ${fmtKg(num(nw))} kg`); break;
    }
    case 'hint-swap': { const ex=exById(b.dataset.id); if(ex){ swapEntry(e, ex); touch(); render(); } break; }
    case 'rt-wu': { const x=sheet.r.exercises[+b.closest('.rt-ex').dataset.i]; const p=x.plan[+b.closest('.plan-row').dataset.j]; if(p.wu) delete p.wu; else p.wu=true; renderSheet(); break; }
    case 'rt-ss-link': linkNext(sheet.r.exercises, +b.closest('.rt-ex').dataset.i); renderSheet(); break;
    case 'rt-ss-leave': unlink(sheet.r.exercises, +b.closest('.rt-ex').dataset.i); renderSheet(); break;
    case 'bw-all': openSheet({kind:'bw-all'}); break;
    case 'bw-del': { if(!armed(b,'Delete?')) break; await delBw(b.dataset.id); renderSheet(); render(); break; }
    case 'export-csv': { if(!S.workouts.length){ toast('No workouts to export yet.'); break; } await offerFile(`gymbook-${todayISO()}.csv`, buildCsv()); break; }
    case 'export-json': await doBackup(); break;
    case 'import': pickImport(); break;
    case 'starters': addStarters(); break;
    case 'install-help': openSheet({kind:'install'}); break;
    case 'sw-reload': if(swWaiting){ swWaiting.postMessage('skipWaiting'); } else location.reload(); break;
    case 'copy-export': { const ta=document.getElementById('export-text'); try{ await navigator.clipboard.writeText(ta.value); toast('Copied'); }catch(err){ ta.focus(); ta.select(); toast('Selected: press copy on your keyboard'); } break; }
    case 'prog-kind': S.progKind=b.dataset.v; render(); break;
    case 'prog-view': openSheet({kind:'program', id:b.dataset.id}); break;
    case 'skill-view': openSheet({kind:'skill', id:b.dataset.id}); break;
    case 'goal-open': openSheet({kind:'goal'}); break;
    case 'goal-pick': { const v=+b.dataset.v; const st=Object.assign({},S.settings); if(v) st.weekGoal=v; else delete st.weekGoal; S.settings=st; putSettings(); closeSheet(); render(); break; }
    case 'howto': { const sb=document.querySelector('#sheet-root .sheet-b');
      let back=sheet; if(back&&back.kind==='howto') back=back.back; if(back&&sb) back._top=sb.scrollTop;
      openSheet({kind:'howto', id:b.dataset.id, back:back||null}); const nb=document.querySelector('#sheet-root .sheet-b'); if(nb) nb.scrollTop=0; break; }
    case 'how-back': { const back=sheet.back; openSheet(back); const nb=document.querySelector('#sheet-root .sheet-b'); if(nb&&back._top) nb.scrollTop=back._top; break; }
    case 'skill-reset': { const sk=SKILLS.find(x=>x.id===b.dataset.id); if(!sk) break;
      if(!armed(b,'Tap again: clears stages, passes and its routine')) break;
      const ids=resetSkill(sk); for(const id of ids) await delRoutine(id);
      sheet.open=null; renderSheet(); render(); toast(`${sk.title} reset to the start`); break; }
    case 'stage-toggle': { const i=+b.dataset.i; sheet.open = (sheet.open!=null?sheet.open:Math.max(0,skillStage(sheet.id)))===i ? -1 : i; renderSheet(); break; }
    case 'stage-start': {
      const sk=SKILLS.find(x=>x.id===b.dataset.skill); const i=+b.dataset.i;
      if(sk && skillStage(sk.id)<0 && !preSummary(sk).all && !armed(b,'Prerequisites not met yet: tap again to start anyway')) break;
      const r=setSkillStage(b.dataset.skill, i); if(!r) break;
      if(b.dataset.close){ closeSheet(); } else { sheet.open=i; renderSheet(); }
      render(); toast(`${sk.title}: ${sk.stages[i].name} routine ready in Routines`); break;
    }
    case 'pre-tick': { const id=b.dataset.id; const d=Object.assign({},S.settings.preDone||{}); if(d[id]) delete d[id]; else d[id]=Date.now(); S.settings.preDone=d; putSettings(); renderSheet(); render(); break; }
    case 'skill-master': { const sk=SKILLS.find(x=>x.id===b.dataset.id); if(!sk) break;
      S.settings.skillsDone=Object.assign({},S.settings.skillsDone||{},{[sk.id]:Date.now()});
      S.settings.skills=Object.assign({},S.settings.skills||{},{[sk.id]:sk.stages.length-1}); putSettings(); renderSheet(); render(); toast(`${sk.title} marked as mastered`); break; }
    case 'skill-unmaster': { const sk=SKILLS.find(x=>x.id===b.dataset.id); if(!sk) break;
      const d=Object.assign({},S.settings.skillsDone||{}); delete d[sk.id]; S.settings.skillsDone=d; putSettings(); renderSheet(); render(); break; }
    case 'prog-add': {
      const p=PROGRAMS.find(x=>x.id===b.dataset.id); if(!p) break;
      p.sessions.forEach((se,k)=>{ const a=adaptList(se.ex);
        const old=S.routines.find(r=>r.src&&r.src.program===p.id&&r.src.session===k);
        putRoutine({id:old?old.id:uid(), name:`${p.title} · ${se.name}`, order:old?old.order:S.routines.length, rest:se.rest, exercises:cleanItems(a.items), src:{program:p.id, session:k}}); });
      closeSheet(); render(); toast(`${p.title}: ${p.sessions.length>1?p.sessions.length+' routines':'routine'} added`); break;
    }
    case 'prog-tab': S.progTab=b.dataset.v; render(); break;
    case 'prog-open': openSheet({kind:'exercise',exId:b.dataset.id}); break;

    case 'rt-new': openSheet({kind:'routine', r:{id:uid(),name:'',order:S.routines.length,exercises:[]}}); break;
    case 'rt-edit': { const r=S.routines.find(x=>x.id===b.dataset.id); if(r) openSheet({kind:'routine', r:JSON.parse(JSON.stringify(r))}); break; }
    case 'rt-add-ex': openSheet({kind:'picker',target:'routine',back:sheet}); break;
    case 'rt-ex-del': { const i=+b.closest('.rt-ex').dataset.i; sheet.r.exercises.splice(i,1); sheet.coll={}; renderSheet(); break; }
    case 'rt-set-add': { const x=ensurePlan(sheet.r.exercises[+b.closest('.rt-ex').dataset.i]); if(x.plan.length<20) x.plan.push(Object.assign({},x.plan[x.plan.length-1]||blankPlan(x.type))); renderSheet(); break; }
    case 'rt-set-del': { const x=sheet.r.exercises[+b.closest('.rt-ex').dataset.i]; x.plan.splice(+b.closest('.plan-row').dataset.j,1); renderSheet(); break; }
    case 'rt-save': {
      const r=sheet.r; const err=document.getElementById('rt-err');
      if(!r.name.trim()){ err.hidden=false; err.textContent='Give the routine a name.'; document.getElementById('rt-name').focus(); break; }
      if(!r.exercises.length){ err.hidden=false; err.textContent='Add at least one exercise.'; break; }
      r.name=r.name.trim(); r.exercises.forEach(x=>{ ensurePlan(x); x.sets=x.plan.length; x.reps=planReps(x); });
      await putRoutine(r); closeSheet(); render(); toast('Routine saved'); break;
    }
    case 'rt-del': { if(!armed(b,'Tap again to delete')) break; await delRoutine(sheet.r.id); closeSheet(); render(); toast('Routine deleted'); break; }
    case 'rest-def': { S.settings.rest=Math.max(15,Math.min(600,(S.settings.rest||90)+(+b.dataset.d))); document.getElementById('rest-def').textContent=fmtDur(S.settings.rest*1000); putSettings(); break; }
  }
});
document.addEventListener('submit', async ev=>{
  const f=ev.target; if(!f.matches('[data-form="bw"]')) return; ev.preventDefault();
  const kg=num(document.getElementById('bw-kg').value); const ds=document.getElementById('bw-date').value||todayISO();
  if(!(kg>20&&kg<400)){ toast('Enter your weight in kg, e.g. 80.5'); document.getElementById('bw-kg').focus(); return; }
  const t=new Date(ds+'T12:00').getTime();
  await putBw({id:'d'+ds, t, kg:Math.round(kg*10)/10}); render(); toast(`Logged ${fmtKg(Math.round(kg*10)/10)} kg`);
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && sheet) closeSheet(); });
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

/* ---------- installing and offline ---------- */
let installPrompt=null, swWaiting=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installPrompt=e; });
document.addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-act="install-now"]'); if(!b||!installPrompt) return;
  installPrompt.prompt(); try{ await installPrompt.userChoice; }catch(e){} installPrompt=null; closeSheet();
});
document.addEventListener('change', ev=>{
  if(ev.target.id!=='import-file') return; const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
  if(!f) return; const rd=new FileReader(); rd.onload=()=>importBackup(String(rd.result)); rd.onerror=()=>toast("Couldn't read that file."); rd.readAsText(f);
});
function showUpdate(){ const r=document.getElementById('update-root'); r.innerHTML=`<div class="toast update" role="status"><span>A new version of GymBook is ready.</span><button type="button" class="btn" data-act="sw-reload">Reload</button></div>`; }
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting && navigator.serviceWorker.controller){ swWaiting=reg.waiting; showUpdate(); }
      reg.addEventListener('updatefound', ()=>{ const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange', ()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller){ swWaiting=nw; showUpdate(); } }); });
      setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
    }).catch(e=>console.warn('Offline support unavailable', e));
    let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(reloaded) return; reloaded=true; location.reload(); });
  });
}
/* ask the browser not to clear our data when storage runs low */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist(); }); }catch(e){}

boot();
})();
</script>
</body>
