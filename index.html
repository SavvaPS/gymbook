/* ---------- next up: which routine is due in your rotation ---------- */
function routineOf(w, rs){ if(w.src&&w.src.routine){ const r=rs.find(x=>x.id===w.src.routine); if(r) return r; } return rs.find(r=>r.name===w.name)||null; }
function nextUp(){
  const rs=[...S.routines].filter(r=>r.exercises&&r.exercises.length).sort((a,b)=>(a.order??0)-(b.order??0));
  const rot=rs.filter(r=>!(r.src&&r.src.skill)); if(!rot.length) return null;
  const fam=r=>r.src&&r.src.program?'p:'+r.src.program:'own';
  let lastW=null, lastR=null;
  for(const w of S.workouts){ const r=routineOf(w, rot); if(r){ lastW=w; lastR=r; break; } }
  if(!lastR){ const own=rot.filter(r=>fam(r)==='own'); return {r:(own[0]||rot[0]), first:true}; }
  const group=rot.filter(r=>fam(r)===fam(lastR)).sort((a,b)=>fam(lastR)==='own'?0:((a.src.session??0)-(b.src.session??0)));
  const r=group[(group.indexOf(lastR)+1)%group.length];
  let prevW=null; for(const w of S.workouts){ if(routineOf(w,rot)===r){ prevW=w; break; } }
  return {r, after:lastR, afterAt:lastW.startedAt, lastAt:prevW?prevW.startedAt:null};
}
function vNextUp(){
  const n=nextUp(); if(!n) return '';
  const r=n.r;
  const why = n.first ? 'First in your routines' : `After ${esc(n.after.name)} on ${DAY[new Date(n.afterAt).getDay()]} ${shortDate(n.afterAt)}`;
  return `<div class="card next-up">
    <div class="spread"><span class="label">Next up</span><span class="muted num" style="font-size:13px">${estText(r)}</span></div>
    <b class="nu-name">${esc(r.name)}</b>
    <small class="muted">${why}${n.lastAt?` · last done ${shortDate(n.lastAt)}`:''}${(()=>{ const p=r.src&&r.src.program?PROGRAMS.find(x=>x.id===r.src.program):null; const run=p?progRun(p):null; return run&&run.done&&!run.complete?` · ${progWeekTxt(run).toLowerCase()}`:''; })()}</small>
    <small class="muted">${esc(r.exercises.slice(0,4).map(x=>x.name).join(', '))}${r.exercises.length>4?` +${r.exercises.length-4}`:''}</small>
    <button type="button" class="btn primary big block" data-act="start-routine" data-id="${esc(r.id)}">${ICON.play} Start ${esc(r.name)}</button>
  </div>`;
}
/* ---------- weekly goal and streak ---------- */
function weekCounts(){ const m=new Map(); for(const w of S.workouts){ const k=weekStart(w.startedAt); m.set(k,(m.get(k)||0)+1); } return m; }
function goalStreak(goal){
  const m=weekCounts(); let k=weekStart(Date.now()); let n=0;
  if((m.get(k)||0)>=goal) n++;
  for(;;){ const d=new Date(k); d.setDate(d.getDate()-7); k=weekStart(d.getTime()); if((m.get(k)||0)>=goal) n++; else break; if(n>520) break; }
  return n;
}
function goalRing(done, goal){
  const r=19, c=2*Math.PI*r, f=Math.min(1,done/goal);
  return `<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${r}" class="ring-bg"/><circle cx="24" cy="24" r="${r}" class="ring-fg ${f>=1?'full':''}" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 24 24)"/><text x="24" y="24" class="ring-t">${done}/${goal}</text></svg>`;
}

    <span class="goal-txt"><b>${left>0?`${left} more to hit your goal`:'Weekly goal hit'}</b><small>${st?`${st}-week streak`:'Hit your goal to start a streak'}</small></span>

/* ---------- personal bests: worked out again from the whole log, so edits and deletes stay accurate ---------- */
function recomputePRs(){
  const best={}; const asc=[...S.workouts].sort((a,b)=>a.startedAt-b.startedAt);
  for(const w of asc){
    const prs=[];
    for(const e of (w.exercises||[])){ if(e.type==='cardio') continue; const prev=best[e.exId]; if(!prev) continue;
      const now=setBests(e.sets||[]);
      if(e.type==='hold'){ if(now.sec>prev.sec) prs.push({exId:e.exId,name:e.name,sec:now.sec,t:w.startedAt}); continue; }
      let top=null; for(const s of working(e.sets||[])){ const x=e1rm(s.w,s.r); if(!top||x>top.x) top={x,w:s.w,r:s.r}; }
      if(top && top.w>0 && top.x>prev.e1+0.01) prs.push({exId:e.exId,name:e.name,w:top.w,r:top.r,t:w.startedAt});
      else if(isBw(e) && now.reps0>prev.reps0 && prev.reps0>0) prs.push({exId:e.exId,name:e.name,w:0,r:now.reps0,t:w.startedAt});
    }
    for(const e of (w.exercises||[])){ if(e.type==='cardio') continue; const x=setBests(e.sets||[]); const b=best[e.exId]||(best[e.exId]={e1:0,reps0:0,sec:0});
      b.e1=Math.max(b.e1,x.e1); b.reps0=Math.max(b.reps0,x.reps0); b.sec=Math.max(b.sec,x.sec); }
    if(JSON.stringify(prs)!==JSON.stringify(w.prs||[])){ w.prs=prs; const {id,...body}=w; queueWrite('workouts/'+id, body); }
  }
}

let holdT=null; // {i, ready, start, target, beeped}
function holdTarget(e){ const s=e.sets.find(x=>!x.done); if(!s) return 0; return num(s.t2)||num(e.targetR)||0; }

  const tgt=holdT.target;
  return `<div class="hold-timer" aria-live="polite">
    <div class="ht-num num" id="hold-t">${holdT.start?'0':holdT.ready?String(holdT.ready):'0'}</div>
    <div class="ht-sub" id="hold-sub">${holdT.start?(tgt?`Target ${tgt} s`:'Holding'):holdT.ready?'Get ready':(tgt?`Target ${tgt} s`:'Press Start, then get into position')}</div>
    <div class="ht-btns">${holdT.start||holdT.ready?`<button type="button" class="btn primary big" data-act="hold-stop">Stop and log</button>`:`<button type="button" class="btn primary big" data-act="hold-go">${ICON.play} Start</button>`}
      <button type="button" class="btn" data-act="hold-cancel">Cancel</button></div>
  </div>`;
}
function holdTick(){
  if(!holdT) return; const el=document.getElementById('hold-t'), sub=document.getElementById('hold-sub'); if(!el) return;
  if(holdT.ready && !holdT.start){
    const left=Math.ceil((holdT.readyEnd-Date.now())/1000);
    if(left<=0){ holdT.start=Date.now(); holdT.ready=0; render(); return; }
    el.textContent=String(left); return;
  }
  if(holdT.start){
    const sec=Math.floor((Date.now()-holdT.start)/1000); el.textContent=String(sec);
    if(holdT.target && sec>=holdT.target && !holdT.beeped){ holdT.beeped=true; beep(); el.classList.add('hit'); if(sub) sub.textContent='Target reached'; }
  }
}

/* ---------- progress: month in review, stalled lifts, PRs, trends, calendar ---------- */
const MONTH_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function workoutSets(w){ let n=0; for(const e of (w.exercises||[])) if(e.type!=='cardio') n+=working(e.sets).length; return n; }
function periodStats(from, to){
  const ws=S.workouts.filter(w=>w.startedAt>=from&&w.startedAt<to);
  const mus={}; let sets=0, vol=0, prs=0;
  for(const w of ws){ vol+=workoutVolume(w); sets+=workoutSets(w); prs+=(w.prs||[]).length;
    for(const e of (w.exercises||[])){ if(e.type==='cardio') continue; const ex=exById(e.exId); const g=ex?ex.group:null; if(!MUSCLES.includes(g)) continue; mus[g]=(mus[g]||0)+working(e.sets).length; } }

  let goalLine='';

  if(g){ let hit=0, tot=0; const wc=weekCounts(); for(let k=weekStart(a); k<b && k<=Date.now(); k+=7*864e5){ const kk=weekStart(k+864e5*3); if(kk+7*864e5>Date.now() && (wc.get(kk)||0)<g) continue; tot++; if((wc.get(kk)||0)>=g) hit++; } if(tot) goalLine=`<span>Weekly goal hit <b>${hit} of ${tot}</b> weeks</span>`; }
  return `<div class="card stack month-card" style="gap:10px">

    </div>
    <div class="mc-foot muted">${cur.n?`<span>Most trained <b>${esc(most?most[0]:'—')}</b>${least.length&&least.length<MUSCLES.length?` · least <b>${esc(least.slice(0,2).join(', '))}</b>`:''}</span>`:'<span>No workouts yet this month.</span>'}${goalLine}<span class="mc-vs">Arrows compare with the same days of ${pm}.</span></div>
  </div>`;
}
function sheetMonths(){

/* lifts with no new best for 4+ weeks while still being trained */
function stalledLifts(){
  const now=Date.now(), D=864e5, out=[];
  for(const m of exerciseStats()){
    if(m.type==='cardio'||m.kind==='hold') continue;
    const val=s=>m.kind==='bw'?(s.e1||s.reps0):s.e1; const ss=m.sessions.filter(s=>val(s)>0);
    const recent=ss.filter(s=>s.t>=now-42*D); if(recent.length<3) continue;
    let best=0, bestT=0; for(const s of ss){ if(val(s)>best+1e-9){ best=val(s); bestT=s.t; } }
    if(!bestT || bestT>=now-28*D) continue;
    out.push({m, weeks:Math.floor((now-bestT)/(7*D)), best});
  }
  return out.sort((a,b)=>b.weeks-a.weeks).slice(0,3);
}

  const list=stalledLifts(); if(!list.length) return '';
  return `<div class="card stack" style="gap:8px">

/* weekly working sets for one muscle group, last 12 weeks */
function sheetMuscle(){

/* simple trend line for one exercise, with a time range */
const RANGES=[['3m','3M',91],['6m','6M',182],['1y','1Y',365],['all','All',0]];
function exChart(m){
  const rk=S.exRange||'6m'; const r=RANGES.find(x=>x[0]===rk)||RANGES[3]; const from=r[2]?Date.now()-r[2]*864e5:0;
  const pts=m.sessions.filter(s=>s.t>=from&&s.val>0);
  const label=m.type==='cardio'?(pts.some(s=>s.km)?'Distance, km':'Minutes'):m.kind==='hold'?'Longest hold, seconds':m.kind==='bw'?'Best (reps or estimated max)':'Estimated one-rep max, kg';

  if(pts.length<2) return `${seg}<p class="muted" style="margin:0;font-size:14px">${pts.length?'Only one session in this range.':'No sessions in this range.'}</p>`;

  const path=pts.map((s,i)=>`${i?'L':'M'}${X(s.t).toFixed(1)},${Y(s.val).toFixed(1)}`).join(' ');
  const bi=vals.indexOf(Math.max(...vals)); const f=v=>fmtKg(Math.round(v*2)/2);
  return `${seg}<div class="ex-chart"><span class="label" style="font-size:11px">${label}</span>
  <svg viewBox="0 0 ${cw} ${ch}" role="img" aria-label="${label} over time">
    <line x1="${L}" x2="${cw-R}" y1="${Y(hi).toFixed(1)}" y2="${Y(hi).toFixed(1)}" stroke="var(--line)"/><line x1="${L}" x2="${cw-R}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${(Y(hi)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${f(hi)}</text><text x="${L-6}" y="${(Y(lo)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${f(lo)}</text>

    <text x="${L}" y="${ch-6}" font-size="10" fill="var(--muted)">${shortDate(t0)}</text><text x="${cw-R}" y="${ch-6}" text-anchor="end" font-size="10" fill="var(--muted)">${shortDate(t1)}</text>

}

/* supersets: exercises sharing an "ss" id are done back to back; rest comes after the last one */
function ssInfo(list){
  const out=[], names={}; let n=0;
  list.forEach((e,i)=>{
    if(!e.ss){ out[i]=null; return; }
    const members=list.map((x,k)=>x.ss===e.ss?k:-1).filter(k=>k>=0);
    if(members.length<2){ out[i]=null; return; }
    if(!(e.ss in names)) names[e.ss]=String.fromCharCode(65+(n++%26));
    out[i]={L:names[e.ss], pos:members.indexOf(i)+1, size:members.length, nextSame: !!(list[i+1]&&list[i+1].ss===e.ss)};
  });
  return out;
}
function linkNext(list,i){ const a=list[i], b=list[i+1]; if(!a||!b) return; const g=a.ss||b.ss||('g'+uid());
  for(const old of [a.ss,b.ss]) if(old&&old!==g) list.forEach(x=>{ if(x.ss===old) x.ss=g; });
  a.ss=g; b.ss=g; }
function unlink(list,i){ delete list[i].ss; const cnt={}; list.forEach(x=>{ if(x.ss) cnt[x.ss]=(cnt[x.ss]||0)+1; }); list.forEach(x=>{ if(x.ss&&cnt[x.ss]<2) delete x.ss; }); }
function doneCount(w){ let n=0; for(const e of w.exercises) for(const s of e.sets) if(s.done) n++; return n; }

/* field layout per exercise type: [first field, label, second field, label] */
function fieldsFor(e){
  if(e.type==='cardio') return ['min','Minutes','km','km'];
  if(e.type==='hold') return ['w',isBw(e)?'+kg':'kg','sec','Seconds'];
  const bc=barCfg(e.exId);
  return ['w', isBw(e)?'+kg':(bc?BAR_LABEL[bc.mode]:'kg'), 'r','Reps'];
}

/* ---------- bar weight: enter total, plates added, or plates per side; the app stores the total ---------- */
const BAR_KINDS={barbell:20, ezbar:10, trapbar:25};
const BAR_LABEL={total:'kg', added:'+kg', side:'kg/side'};
function barCfg(exId){
  const ex=exById(exId); if(!ex||!ex.needs||ex.type!=='strength') return null;
  let kind=null;
  for(const tok of ex.needs){ const k=tok.split('|').find(x=>BAR_KINDS[x]); if(k){ kind=k; break; } }
  if(!kind) return null;
  const saved=(S.settings.bars||{})[exId]||{};
  return {kind, bar: saved.bar!=null&&saved.bar!==''?num(saved.bar):BAR_KINDS[kind], mode: saved.mode||'total'};
}
const r2 = n => String(Math.round(n*100)/100);
function toDisplay(cfg, w){
  if(w===''||w==null) return '';

}
function fromDisplay(cfg, v){

function totText(cfg, w){ return cfg&&cfg.mode!=='total'&&w!==''&&w!=null ? `= ${fmtKg(num(w))} kg` : ''; }
/* ---------- weighted vest for bodyweight work: one vest weight, switched on per exercise ---------- */
function vestCfg(exId){

}
function vestControl(exId){
  const v=vestCfg(exId); if(!v) return '';

    <div class="seg" role="group" aria-label="Weighted vest">

/* switching the vest on fills the +kg of sets not yet done; switching off or changing its weight updates sets that carried the vest */
function setVestPref(exId, patch){
  const old=vestCfg(exId); if(!old) return;
  if(patch.on!==undefined){ S.settings.vestOn=Object.assign({},S.settings.vestOn||{}); if(patch.on) S.settings.vestOn[exId]=true; else delete S.settings.vestOn[exId]; }
  if(patch.kg!==undefined) S.settings.vestKg=patch.kg;
  const now=vestCfg(exId);
  const adjust=(get,set,done)=>{ if(done) return; const w=num(get());
    if(!old.on && now.on){ if(!w) set(r2(now.kg)); }
    else if(old.on && !now.on){ if(w===old.kg) set(''); }
    else if(old.on && now.on && old.kg!==now.kg){ if(w===old.kg) set(r2(now.kg)); } };
  if(S.active) for(const e of S.active.exercises) if(e.exId===exId){ e.vest=now.on?now.kg:null; for(const s of e.sets) adjust(()=>s.w,v=>{s.w=v;},s.done); }
  // a vest weight change applies to every exercise using the vest in this workout
  if(S.active && patch.kg!==undefined) for(const e of S.active.exercises) if(e.exId!==exId && num(e.vest)){ const o=num(e.vest); e.vest=now.kg; for(const s of e.sets) if(!s.done && num(s.w)===o) s.w=r2(now.kg); }

  rerenderAll(); putSettings();
}
function barControl(exId){

  return `<div class="bar-ctl" data-exid="${esc(exId)}">

const RPE_OPTS=['6','6.5','7','7.5','8','8.5','9','9.5','10'];

      ${bc?`<div class="wcell"><input inputmode="decimal" data-f="${f1}" value="${esc(v1)}" placeholder="${esc(ph1)}" aria-label="Set ${j+1} weight, ${l1}"><small class="tot num" data-tot>${totText(bc,s.w)}</small></div>`

    <header>

/* ---------- progression hints, from last session's working sets ---------- */
function incFor(ex){
  const has=k=>(ex.needs||[]).some(t=>t.split('|')[0]===k);
  if(has('barbell')||has('trapbar')) return ['squat','hinge','lunge'].includes(ex.pattern)?5:2.5;
  if(has('dumbbell')||has('kettlebell')) return 2;
  return 2.5;
}
function nextLevel(ex){ return ex&&ex.lvl ? variationsFor(ex).find(x=>x.pattern===ex.pattern&&x.lvl===ex.lvl+1&&x.type===ex.type) : null; }
function hintFor(e, prevE){
  const ex=exById(e.exId); if(!ex||!prevE||e.type==='cardio') return null;
  const ws=working(prevE.sets); if(!ws.length) return null;
  if(e.type==='hold'){
    const best=Math.max(...ws.map(s=>num(s.sec))); const h=nextLevel(ex);
    if(best>=60 && h) return {text:`You held ${best} s last time. Ready for ${h.name}?`, swap:h.id};
    return {text:`Best hold last time: ${best} s. Aim for ${best+5} s.`};
  }
  const firstWork=e.sets.find(s=>!s.wu)||{};
  const target=num(firstWork.t2)||num(e.targetR)||0;
  if(ex.bw){
    const minR=Math.min(...ws.map(s=>num(s.r))); const tgt=target||12; const added=Math.max(...ws.map(s=>num(s.w)));
    if(minR>=tgt){ const h=nextLevel(ex);
      if(h && !added) return {text:`You hit ${tgt}+ reps on every set. Try ${h.name}, or add 2.5 kg.`, swap:h.id, w:r2(added+2.5), from:added};
      return {text:`You hit ${tgt}+ reps on every set. Add 2.5 kg this time.`, w:r2(added+2.5), from:added}; }
    return {text:`Aim for ${tgt} reps on every set${added?` at +${fmtKg(added)} kg`:''}. Your lowest set last time was ${minR}.`};
  }
  const W=Math.max(...ws.map(s=>num(s.w))); if(!W) return null;
  const atW=ws.filter(s=>num(s.w)===W); const tgt=target||num(atW[0].r);
  if(atW.length>=Math.min(2,ws.length) && atW.every(s=>num(s.r)>=tgt)){ const nw=W+incFor(ex);
    return {text:`You hit ${tgt} reps on every set at ${fmtKg(W)} kg. Try ${fmtKg(nw)} kg.`, w:r2(nw), from:W}; }
  return {text:`Stay at ${fmtKg(W)} kg and aim for ${tgt} reps on every set.`};
}
function swapCount(r){ return (r.exercises||[]).filter(x=>{ const ex=exById(x.exId); return ex && !canDo(ex); }).length; }
function platesText(e){
  const bc=barCfg(e.exId); const bar=bc?bc.bar:20;
  let top=0; for(const s of e.sets) top=Math.max(top,num(s.w));
  if(!top) return '';
  const p=platesFor(top, bar); if(!p) return `${fmtKg(top)} kg: empty bar`;
  return `${fmtKg(top)} kg = ${fmtKg(bar)} kg bar + <b>${p.out.map(fmtKg).join(' · ')}</b> a side${p.rem?` (+${p.rem})`:''}`;
}
/* the bar changed: keep the plates you typed, move the totals */
function shiftBar(exId, oldBar, newBar){
  const d=newBar-oldBar; if(!d) return;
  const fix=v=>v===''||v==null?v:r2(num(v)+d);
  if(S.active) for(const e of S.active.exercises) if(e.exId===exId) for(const s of e.sets){ s.w=fix(s.w); if(s.t1!==undefined) s.t1=fix(s.t1); }
  if(sheet&&sheet.r) for(const x of sheet.r.exercises) if(x.exId===exId&&x.plan) for(const p of x.plan) p.w=fix(p.w);
}


/* ---------- programme progress: week N of M, sessions done, restart ---------- */
function progWeeks(p){ const m=String(p.weeks||'').match(/\d+/); return m?+m[0]:0; }
function progRun(p){
  const rs=S.routines.filter(r=>r.src&&r.src.program===p.id); if(!rs.length) return null;
  const since=(S.settings.progStart||{})[p.id]||0;
  const ws=S.workouts.filter(w=>w.startedAt>=since && routineOf(w,rs));
  const done=ws.length, weeks=progWeeks(p), total=weeks?weeks*p.days:0;
  const first=done?Math.min(...ws.map(w=>w.startedAt)):null, last=done?Math.max(...ws.map(w=>w.startedAt)):null;
  const week=first?Math.floor((weekStart(Date.now())-weekStart(first))/(7*864e5))+1:0;
  return {done,total,weeks,week,first,last,complete:total>0&&done>=total,pct:total?Math.min(1,done/total):0};
}
function progWeekTxt(run){ return run.complete?'Complete':run.done?`Week ${run.week}${run.weeks&&run.week<=run.weeks?` of ${run.weeks}`:''}`:'Not started'; }
function progBlock(p){
  const run=progRun(p); if(!run) return '';
  const others=PROGRAMS.filter(x=>x.cat===p.cat&&x.id!==p.id&&!S.routines.some(r=>r.src&&r.src.program===x.id)).slice(0,2);
  return `<div class="card stack prog-run" style="gap:8px">
    <div class="spread nowrap"><b>${run.complete?`${ICON.check} Programme complete`:run.done?progWeekTxt(run):'Ready to start'}</b><span class="muted num" style="font-size:13px">${run.done}${run.total?` of ${run.total}`:''} sessions</span></div>

/* ---------- history search ---------- */
function histText(w){ return [w.name,...(w.exercises||[]).map(e=>e.name),w.note||''].join(' ').toLowerCase(); }
function histFilter(){

/* ---------- compare with last time ---------- */
function prevSame(w){
  const key=w.src&&w.src.routine;
  for(const x of [...S.workouts].sort((a,b)=>b.startedAt-a.startedAt)){
    if(x.id===w.id||x.startedAt>=w.startedAt) continue;
    if(key ? (x.src&&x.src.routine===key) || (!(x.src&&x.src.routine)&&x.name===w.name) : x.name===w.name) return x;
  }
  return null;
}
function topOf(e){
  const ws=working(e.sets); if(!ws.length||e.type==='cardio') return null;
  if(e.type==='hold'){ const s=Math.max(...ws.map(x=>num(x.sec))); return s?{v:s,u:'s',txt:`${s} s`}:null; }
  const heavy=Math.max(...ws.map(x=>num(x.w)));
  const reps=Math.max(...ws.filter(x=>num(x.w)===heavy).map(x=>num(x.r)));
  if(!heavy) return reps?{w:0,r:reps,txt:`${reps} reps`}:null;
  return {w:heavy,r:reps,txt:`${isBw(e)?'+':''}${fmtKg(heavy)} kg × ${reps}`};
}
function cmpOne(e, pe){
  const a=topOf(e), b=pe?topOf(pe):null; if(!a||!b) return null;
  let d=0, txt='same as last time';
  if(a.u==='s'){ d=a.v-b.v; if(d) txt=`${d>0?'+':'−'}${Math.abs(d)} s`; }
  else if(a.w!==b.w){ d=a.w-b.w; txt=`${d>0?'+':'−'}${fmtKg(Math.abs(d))} kg`; }
  else if(a.r!==b.r){ d=a.r-b.r; txt=`${d>0?'+':'−'}${Math.abs(d)} rep${Math.abs(d)===1?'':'s'}`; }
  return {d, txt, now:a.txt, was:b.txt};
}
function cmpChip(c){ return c?`<span class="cmp ${c.d>0?'up':c.d<0?'down':''}">${c.d>0?'▲':c.d<0?'▼':'='} ${esc(c.d?c.txt:'same')}</span>`:''; }
function compareBlock(w){
  const p=prevSame(w); if(!p) return '';
  const rows=(w.exercises||[]).map(e=>({e,c:cmpOne(e,(p.exercises||[]).find(x=>x.exId===e.exId))})).filter(x=>x.c);
  if(!rows.length) return '';
  const v1=workoutVolume(w), v0=workoutVolume(p); const dv=v0?Math.round((v1-v0)/v0*100):0;
  return `<div class="spread nowrap"><span class="label">Compared with last time</span><span class="muted num" style="font-size:12px">${DAY[new Date(p.startedAt).getDay()]} ${shortDate(p.startedAt)}</span></div>
  <div class="cmp-list">${rows.map(({e,c})=>`<div class="cmp-row"><span class="cmp-n">${esc(e.name)}<small class="muted num">${esc(c.now)}${c.d?` · was ${esc(c.was)}`:''}</small></span>${cmpChip(c)}</div>`).join('')}
  ${v0&&v1?`<div class="cmp-row"><span class="cmp-n">Total volume<small class="muted num">${fmtVol(v1)} kg · was ${fmtVol(v0)} kg</small></span>${dv?`<span class="cmp ${dv>0?'up':'down'}">${dv>0?'▲ +':'▼ −'}${Math.abs(dv)}%</span>`:'<span class="cmp">= same</span>'}</div>`:''}</div>`;
}

/* ---------- lift goals ---------- */
function goalUnit(m){ return m.kind==='hold'?'s':m.kind==='bw'?'reps':'kg'; }
function goalPts(m,u){ return m.sessions.map(s=>({t:s.t, v:u==='s'?s.sec:u==='reps'?s.reps0:s.heavy})).filter(p=>p.v>0); }
function goalState(g){
  const m=exerciseStats().find(x=>x.exId===g.exId);
  const pts=m?goalPts(m,g.unit):[]; const best=pts.length?Math.max(...pts.map(p=>p.v)):0;
  const hitP=pts.find(p=>p.v>=g.target&&p.t>=(g.at||0)) || (best>=g.target?pts.find(p=>p.v>=g.target):null);
  let eta=null, note='';
  if(!hitP){
    const cut=Date.now()-120*864e5; const rec=pts.filter(p=>p.t>=cut);
    if(rec.length>=3 && rec[rec.length-1].t-rec[0].t>=14*864e5){
      const n=rec.length, mx=rec.reduce((a,p)=>a+p.t,0)/n, my=rec.reduce((a,p)=>a+p.v,0)/n;
      const sxy=rec.reduce((a,p)=>a+(p.t-mx)*(p.v-my),0), sxx=rec.reduce((a,p)=>a+(p.t-mx)**2,0);
      const slope=sxx?sxy/sxx:0; // per ms
      if(slope>0){ const t=Date.now()+(g.target-best)/slope; eta=t; note = t-Date.now()>730*864e5 ? 'More than 2 years away at your current rate' : `At your recent rate: about ${MON[new Date(t).getMonth()]} ${new Date(t).getFullYear()}`; }
      else note='Not trending up lately: see Stalled lifts on the Lifts tab';
    } else note='Log it a few more times over 2 weeks to see a projected date';
  }
  return {m, best, hit:hitP?hitP.t:null, pct:g.target?Math.min(1,best/g.target):0, note, eta};
}

function exerciseStats(){
  const map=new Map();
  const ws=[...S.workouts].sort((a,b)=>a.startedAt-b.startedAt);
  for(const w of ws) for(const e of (w.exercises||[])){
    let m=map.get(e.exId); if(!m){ m={exId:e.exId,name:e.name,type:e.type,sessions:[]}; map.set(e.exId,m); }
    if(e.type==='cardio'){
      let min=0,km=0; for(const s of e.sets){ min+=num(s.min); km+=num(s.km); }
      m.sessions.push({t:w.startedAt,min,km,val:km||min,pace:km&&min?min/km:0});
    } else if(e.type==='hold'){
      const ws=working(e.sets); if(!ws.length) continue;
      m.kind='hold'; const sec=Math.max(...ws.map(s=>num(s.sec))); m.sessions.push({t:w.startedAt,sec,sets:ws.length,val:sec});
    } else {
      let best=0,heavy=0,bestSet=null,vol=0,reps0=0,totalReps=0;
      if(!working(e.sets).length) continue;
      for(const s of working(e.sets)){ const w1=num(s.w),r=num(s.r); const x=e1rm(w1,r); vol+=w1*r; totalReps+=r; if(x>best){best=x;bestSet=s;} heavy=Math.max(heavy,w1); if(!w1) reps0=Math.max(reps0,r); }
      if(isBw(e)) m.kind='bw';
      const B=bwNear(w.startedAt); let rel=0;
      if(B){ if(isBw(e)){ for(const s of working(e.sets)) rel=Math.max(rel, e1rm(B+num(s.w), num(s.r))/B); } else rel=best/B; }
      m.sessions.push({t:w.startedAt,e1:best,heavy,vol,bestSet,reps0,totalReps,bw:B,rel,val:isBw(e)?(best||reps0):(best||vol)});
    }
  }
  return [...map.values()].filter(m=>m.sessions.length).sort((a,b)=>b.sessions[b.sessions.length-1].t-a.sessions[a.sessions.length-1].t);
}
function spark(vals, w=96, h=36){
  if(vals.length<2) return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><circle cx="${w-4}" cy="${h/2}" r="3" fill="var(--accent)"/></svg>`;
  const v=vals.slice(-12), mn=Math.min(...v), mx=Math.max(...v), sp=(mx-mn)||1;
  const pts=v.map((x,i)=>[4+i*(w-8)/(v.length-1), h-4-(x-mn)/sp*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${h} L4 ${h} Z" fill="var(--accent-soft)" stroke="none"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}
function weeksChart(){
  const W=12, now=Date.now(), ws=weekStart(now);
  const counts=[]; for(let i=W-1;i>=0;i--){ const s=ws-i*7*864e5, e=s+7*864e5; counts.push({s,n:S.workouts.filter(w=>w.startedAt>=s&&w.startedAt<e).length}); }
  const mx=Math.max(3,...counts.map(c=>c.n)); const cw=320, ch=110, bw=cw/W;
  const bars=counts.map((c,i)=>{ const bh=c.n/mx*(ch-34); const x=i*bw+4, y=ch-18-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-8).toFixed(1)}" height="${Math.max(bh,c.n?0:2).toFixed(1)}" rx="3" fill="${i===W-1?'var(--accent)':c.n?'var(--muted)':'var(--line)'}"/>
      ${c.n?`<text x="${(x+(bw-8)/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink)" font-weight="600">${c.n}</text>`:''}
      ${i%3===2||i===W-1?`<text x="${(x+(bw-8)/2).toFixed(1)}" y="${ch-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${shortDate(c.s)}</text>`:''}`; }).join('');
  return `<svg viewBox="0 0 ${cw} ${ch}" role="img" aria-label="Workouts per week, last 12 weeks">${bars}</svg>`;
}
/* ---------- bodyweight ---------- */
/* date boxes: iOS won't centre its own date text, so we show our own label and lay the real picker invisibly on top */

function todayISO(t){ const d=new Date(t||Date.now()); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function bwAt(t){ let v=null; for(const x of S.bw){ if(x.t<=t+12*3600e3) v=x.kg; else break; } return v; }
function bwNear(t){ const v=bwAt(t); return v!=null ? num(v) : (S.bw.length ? num(S.bw[0].kg) : 0); }
/* relative strength: estimated one-rep max as a multiple of bodyweight; bodyweight moves count your body plus added kg */
const fmtX = x => x ? (Math.round(x*100)/100).toFixed(2)+'×' : '—';
function bwChart(){

function vBodyweight(){
  const last=S.bw[S.bw.length-1];
  const ref=last? [...S.bw].reverse().find(x=>x.t<=last.t-28*864e5) : null;
  const diff= last&&ref ? num(last.kg)-num(ref.kg) : null;
  return `<div class="card stack" style="gap:10px">
    <div class="spread"><span class="label">Bodyweight</span>${S.bw.length?`<button type="button" class="btn ghost small" data-act="bw-all">All entries</button>`:''}</div>
    ${last?`<div class="row" style="align-items:baseline;gap:10px"><b class="big-num num">${fmtKg(num(last.kg))}</b><span class="muted">kg on ${shortDate(last.t)}</span>${diff!=null?`<span class="chip num">${diff>0?'+':''}${fmtKg(Math.round(diff*10)/10)} kg in 4 weeks</span>`:''}</div>`
      :`<p class="muted" style="margin:0;font-size:14px">Log it now and then so bodyweight exercises compare fairly.</p>`}
    ${bwChart()}
    <form class="bw-form" data-form="bw">
      <div class="field"><label class="label" for="bw-kg">Kg</label><input id="bw-kg" inputmode="decimal" placeholder="${last?esc(r2(num(last.kg))):'e.g. 80.5'}" autocomplete="off"></div>
      <div class="field"><label class="label" for="bw-date">Date</label><span class="dt"><span class="dt-show num">${dtLabel(todayISO())}</span>${ICON.cal}<input id="bw-date" type="date" value="${todayISO()}"></span></div>
      <button type="submit" class="btn primary">Log weight</button>
    </form>
  </div>`;
}
/* ---------- weekly working sets per muscle group ---------- */
const MUSCLES=['Chest','Shoulders','Back','Arms','Legs','Core','Full body'];
function muscleCard(){
  const ws=weekStart(Date.now()); const cur={}, prev={};
  for(const w of S.workouts){ const inCur=w.startedAt>=ws, inPrev=!inCur&&w.startedAt>=ws-28*864e5; if(!inCur&&!inPrev) continue;
    for(const e of (w.exercises||[])){ if(e.type==='cardio') continue; const ex=exById(e.exId); const g=ex?ex.group:null; if(!MUSCLES.includes(g)) continue;
      const n=working(e.sets).length; if(inCur) cur[g]=(cur[g]||0)+n; else prev[g]=(prev[g]||0)+n; } }
  const avg=g=>(prev[g]||0)/4;
  const max=Math.max(20,...MUSCLES.map(g=>Math.max(cur[g]||0,avg(g))));
  const rows=MUSCLES.map(g=>{ const c=cur[g]||0, a=avg(g);
    return `<button type="button" class="mrow tap" data-act="muscle-open" data-g="${g}" aria-label="${g}: ${c} sets this week. Show 12-week trend"><span class="mname">${g}</span><div class="mbar" aria-hidden="true"><div class="mfill" style="width:${(c/max*100).toFixed(1)}%"></div>${a?`<div class="mavg" style="left:${(a/max*100).toFixed(1)}%"></div>`:''}</div><span class="mnum num">${c}</span></button>`; }).join('');
  return `<div class="card stack" style="gap:8px">
    <div class="spread"><span class="label">Working sets this week</span><span class="legend"><i class="lg-fill"></i>This week <i class="lg-avg"></i>4-week average</span></div>
    <div class="mlist" role="table" aria-label="Working sets per muscle group this week">${rows}</div>
    ${more('How this works','<p>Working sets only; warm-ups aren\'t counted. Many programmes aim for roughly 10–20 hard sets per muscle group each week. Tap a muscle group to see its last 12 weeks.</p>')}
  </div>`;
}
function skillsCard(){
  const rows=SKILLS.map(sk=>({sk,cur:skillStage(sk.id),m:skillMastery(sk)})).filter(x=>x.cur>=0||x.m.done).sort((a,b)=>(b.m.done?1:0)-(a.m.done?1:0));
  if(!rows.length) return '';
  const n=rows.filter(x=>x.m.done).length;
  return `<div class="card stack" style="gap:4px">
    <div class="spread"><span class="label">Calisthenics skills</span><span class="muted" style="font-size:12px">${n} mastered</span></div>
    ${rows.map(({sk,cur,m})=>`<button type="button" class="skrow" data-act="skill-view" data-id="${esc(sk.id)}"><span class="sk-name">${esc(sk.title)}</span>${ladderDots(sk, m.done?sk.stages.length:cur)}<span class="sk-st">${m.done?`<span class="badge-ok">${ICON.check} Mastered</span>`:esc(sk.stages[cur].name)}</span></button>`).join('')}
  </div>`;
}
function relCard(){
  const list=exerciseStats().filter(m=>m.type==='strength'||(!m.type&&m.kind!=='hold')).filter(m=>m.kind!=='hold'&&m.type!=='cardio');
  if(!S.bw.length) return `<div class="card stack" style="gap:6px"><span class="label">Strength vs bodyweight</span><p class="muted" style="margin:0;font-size:14px">Log your bodyweight to see each lift as a multiple of it.</p></div>`;
  const cut=Date.now()-90*864e5;
  const rows=list.map(m=>{ const rec=m.sessions.filter(s=>s.t>=cut&&s.rel); if(!rec.length) return null;
      const top=rec.reduce((a,b)=>b.rel>a.rel?b:a); const first=rec[0];
      return {name:m.name, exId:m.exId, rel:top.rel, kg:m.kind==='bw'?top.rel*top.bw:top.e1, n:m.sessions.length, change: rec.length>1 ? rec[rec.length-1].rel-first.rel : 0}; })
    .filter(Boolean).sort((a,b)=>b.n-a.n);
  if(!rows.length) return '';
  const allRel=rows.length>5&&!!S.settings.relAll, shown=allRel?rows:rows.slice(0,5);
  const max=Math.max(2,...rows.map(r=>r.rel));
  return `<div class="card stack" style="gap:8px">
    <div class="spread"><span class="label">Strength vs bodyweight</span><span class="muted" style="font-size:12px">best in 90 days</span></div>
    <div class="mlist">${shown.map(r=>`<button type="button" class="relrow" data-act="prog-open" data-id="${esc(r.exId)}">
      <span class="mname">${esc(r.name)}</span>
      <div class="mbar" aria-hidden="true"><div class="mfill" style="width:${(r.rel/max*100).toFixed(1)}%"></div><div class="mavg" style="left:${(1/max*100).toFixed(1)}%" title="1× bodyweight"></div></div>
      <span class="mnum num">${fmtX(r.rel)}</span></button>`).join('')}</div>
    ${rows.length>5?`<button type="button" class="btn ghost block" data-act="rel-more" aria-expanded="${allRel}">${allRel?`${ICON.up} Show fewer`:`${ICON.down} Show all ${rows.length}`}</button>`:''}
    ${more('How this works','<p>Estimated one-rep max ÷ your bodyweight at the time. The line marks 1× bodyweight. Pull-ups, dips and other bodyweight moves include your body plus any added kg.</p>')}
  </div>`;
}

    if(m.type==='cardio'){ const bestKm=Math.max(...m.sessions.map(s=>s.km)); const paces=m.sessions.filter(s=>s.pace).map(s=>s.pace); const bp=paces.length?Math.min(...paces):0;
      main=bestKm?`Longest ${fmtKg(bestKm)} km`:`${Math.max(...m.sessions.map(s=>s.min))} min best`; extra=[bp?`best pace ${Math.floor(bp)}:${String(Math.round(bp%1*60)).padStart(2,'0')}/km`:'', n, when].filter(Boolean).join(' · '); }
    else if(m.kind==='hold'){ main=`Longest hold ${Math.max(...m.sessions.map(s=>s.sec))} s`; extra=`${n} · ${when}`; }
    else if(m.kind==='bw'){ const r0=Math.max(...m.sessions.map(s=>s.reps0)); const heavy=Math.max(...m.sessions.map(s=>s.heavy)); const rx=Math.max(...m.sessions.map(s=>s.rel||0));
      main=[r0?`Best ${r0} reps`:'', rx?`${fmtX(rx)} BW`:''].filter(Boolean).join(' · ')||n; extra=[heavy?`heaviest +${fmtKg(heavy)} kg`:'', n, when].filter(Boolean).join(' · '); }
    else { const best=Math.max(...m.sessions.map(s=>s.e1)); const heavy=Math.max(...m.sessions.map(s=>s.heavy)); const rx=Math.max(...m.sessions.map(s=>s.rel||0));
      main=best?`e1RM ${fmtKg(Math.round(best*2)/2)} kg${rx?` · ${fmtX(rx)} BW`:''}`:n; extra=[heavy?`heaviest ${fmtKg(heavy)} kg`:'', n, when].filter(Boolean).join(' · '); }
    return `<button type="button" class="prog" data-act="prog-open" data-id="${esc(m.exId)}"><div class="prog-txt"><h3>${esc(m.name)}</h3><div class="prog-main num">${main}</div><div class="sub num">${extra}</div></div>${spark(m.sessions.map(s=>s.val),72,32)}</button>`;
  }) : null;
  const allOpen=!!S.settings.exAll, q=allOpen?(S.exQ||''):'';
  const listHtml=!list?`<p class="note">No ${S.progTab} exercises logged yet.</p>`
    : `${allOpen&&list.length>5?`<div class="field ex-search"><input id="ex-q" type="search" placeholder="Search your exercises" aria-label="Search your exercises" autocomplete="off" value="${esc(q)}"></div>`:''}
    <div class="stack" id="ex-list" style="gap:8px">${list.map((h,i)=>{ const nm=stats[i].name.toLowerCase(); const hide=allOpen?(q&&!nm.includes(q)):i>=5; return h.replace('<button type="button" class="prog"',`<button type="button" class="prog" data-n="${esc(nm)}" ${hide?'hidden':''}`); }).join('')}</div>
    <p class="note" id="ex-none" ${allOpen&&q&&!stats.some(m=>m.name.toLowerCase().includes(q))?'':'hidden'}>No exercises match.</p>
    ${list.length>5?`<button type="button" class="btn ghost block" data-act="ex-more" aria-expanded="${allOpen}">${allOpen?`${ICON.up} Show fewer`:`${ICON.down} Show all ${list.length}`}</button>`:''}`;
  return `${head}
  <div class="seg seg-wide pv-seg" role="group" aria-label="Progress view">${[['overview','Overview'],['lifts','Lifts'],['body','Body']].map(([v,l])=>`<button type="button" data-act="pv" data-v="${v}" aria-pressed="${pv===v}">${l}</button>`).join('')}</div>
  ${pv==='overview'?`${monthCard()}
  ${goalsCard()}
  ${muscleCard()}
  <div class="card weeks"><div class="label" style="margin-bottom:6px">Workouts per week</div>${weeksChart()}</div>`
  :pv==='body'?`${skillsCard()||`<div class="card spread nowrap"><div style="min-width:0"><b>Calisthenics skills</b><div class="muted" style="font-size:13px">Start a skill to track its stages here.</div></div><a class="btn" href="#programmes">Browse</a></div>`}
  ${vBodyweight()}`
  :`${stalledCard()}
  ${prCard()}
  ${relCard()}
  <div class="spread"><span class="label">By exercise</span>
    <div class="seg" role="group" aria-label="Exercise type"><button type="button" data-act="prog-tab" data-v="strength" aria-pressed="${S.progTab==='strength'}">Strength</button><button type="button" data-act="prog-tab" data-v="cardio" aria-pressed="${S.progTab==='cardio'}">Cardio</button></div></div>
  ${listHtml}`}`;
}

function filterPicker(){
  const qEl=document.getElementById('pick-q'); if(!qEl) return;

    const inQ = !q || b.dataset.name.includes(q);
    const ok = b.dataset.ok==='1';
    if(inF&&inQ&&!ok&&!all) hidden++;
    const m = inF && inQ && (ok||all); b.hidden=!m; if(m) shown++; if(b.dataset.name===q) exact=true; });
  list.querySelectorAll('.grp').forEach(g=>{ let n=g.nextElementSibling, vis=false; while(n&&n.tagName==='BUTTON'){ if(!n.hidden) vis=true; n=n.nextElementSibling; } g.hidden=!vis; });

}

/* ---------- workout actions ---------- */
function newExerciseEntry(ex, opts={}){
  const n=opts.sets||(ex.type==='cardio'?1:3);
  const entry={exId:ex.id,name:ex.name,type:ex.type,targetR:opts.reps||'',sets:Array.from({length:n},()=>blankSet(ex.type))};
  if(Array.isArray(opts.plan)&&opts.plan.length){
    const [f1,,f2]=fieldsFor(entry);
    entry.sets=opts.plan.map(p=>Object.assign(blankSet(ex.type),{t1:p[f1]??'',t2:p[f2]??''},p.wu?{wu:true}:{}));
  }
  if(opts.ss) entry.ss=opts.ss;
  const vc=vestCfg(ex.id); if(vc&&vc.on) entry.vest=vc.kg;
  return entry;
}
function blankSet(type, prev){ prev=prev||{}; return type==='cardio'?{min:'',km:'',done:false}:type==='hold'?{w:prev.w||'',sec:'',done:false}:{w:prev.w||'',r:'',done:false}; }
function swapEntry(entry, ex){
  const n=entry.sets.length||(ex.type==='cardio'?1:3);
  const old=exById(entry.exId), sameType=entry.type===ex.type;
  const kit=x=>x?(x.bw?'bw':String((x.needs||[])[0]||'')):'';
  entry.exId=ex.id; entry.name=ex.name;
  entry.type=ex.type;
  /* same kind of exercise: keep reps, ticks and notes; weights only carry over when the kit is the same (barbell to barbell, say) */
  if(sameType && entry.sets.length){ const keepW=kit(old)===kit(ex); entry.sets=entry.sets.map(s=>keepW?s:Object.assign({},s,{w:''})); }
  else entry.sets=Array.from({length:n},()=>blankSet(ex.type));
  const vc=vestCfg(ex.id); entry.vest=vc&&vc.on?vc.kg:null;
}
function blankPlan(type, prev){ prev=prev||{}; return type==='cardio'?{min:prev.min||'',km:prev.km||''}:type==='hold'?{w:prev.w||'',sec:prev.sec||'30'}:{w:prev.w||'',r:prev.r||'8'}; }
function routineItem(ex){ const n=ex.type==='cardio'?1:3; const it={exId:ex.id,name:ex.name,type:ex.type,plan:Array.from({length:n},()=>blankPlan(ex.type))}; it.sets=n; it.reps=planReps(it); return it; }
/* older routines stored only sets + reps; turn them into a per-set plan */
function ensurePlan(x){
  if(Array.isArray(x.plan)&&x.plan.length) return x;
  const n=Math.max(1,+x.sets||(x.type==='cardio'?1:3));
  x.plan=Array.from({length:n},()=>x.type==='cardio'?{min:'',km:''}:x.type==='hold'?{w:'',sec:String(x.reps||'')}:{w:'',r:String(x.reps||'')});
  return x;
}
function planReps(x){ const p=(x.plan||[])[0]||{}; return String((x.type==='hold'?p.sec:p.r)||''); }
function planSummary(x){
  ensurePlan(x); const [f1,,f2]=fieldsFor(x); const unit=x.type==='hold'?'s':'';
  if(x.type==='cardio'){ const p=x.plan[0]; return [p.min?`${p.min} min`:'',p.km?`${p.km} km`:''].filter(Boolean).join(' · '); }
  const fmt=p=>{ const a=num(p[f1]), b=p[f2]||'—'; return a?`${fmtKg(a)}×${b}${unit}`:`${b}${unit}`; };
  const same=x.plan.every(p=>String(p[f1]||'')===String(x.plan[0][f1]||'')&&String(p[f2]||'')===String(x.plan[0][f2]||''));
  if(same){ const p=x.plan[0]; const a=num(p[f1]); return `${x.plan.length}×${p[f2]||'—'}${unit}${a?` @ ${fmtKg(a)} kg`:''}`; }

}

async function finishWorkout(){
  const w=S.active;
  let startedAt=w.startedAt, endedAt=Date.now();
  if(w.mode){
    if(!startedAt||!isFinite(startedAt)){ toast('Pick the date and start time.'); document.getElementById('wk-date')?.focus(); return; }
    endedAt=startedAt+Math.max(1,num(w.durMin)||60)*60000;
  }
  const extra=s=>Object.assign({}, s.wu?{wu:true}:{}, num(s.rpe)?{rpe:num(s.rpe)}:{});
  const exercises=w.exercises.map(e=>{
    const sets=e.sets.map(s=>e.type==='cardio'?{min:num(s.min)||0,km:num(s.km)||0}:e.type==='hold'?Object.assign({w:num(s.w),sec:Math.round(num(s.sec))},extra(s)):Object.assign({w:num(s.w),r:Math.round(num(s.r))},extra(s)))
      .filter(s=>e.type==='cardio'?(s.min||s.km):e.type==='hold'?s.sec>0:s.r>0);
    const out={exId:e.exId,name:e.name,type:e.type,sets};
    if(num(e.vest)) out.vest=num(e.vest);
    if(e.note&&e.note.trim()) out.note=e.note.trim();
    if(e.ss) out.ss=e.ss;
    return out;
  }).filter(e=>e.sets.length);
  if(!exercises.length){ toast('Log at least one set with reps (or time) before saving.'); return; }
  const dropped=w.exercises.reduce((a,e)=>a+e.sets.filter(s=>e.type==='cardio'?false:e.type==='hold'?(num(s.w)&&!(num(s.sec)>0)):(num(s.w)&&!(Math.round(num(s.r))>0))).length,0);
  { const cnt={}; exercises.forEach(e=>{ if(e.ss) cnt[e.ss]=(cnt[e.ss]||0)+1; }); exercises.forEach(e=>{ if(e.ss&&cnt[e.ss]<2) delete e.ss; }); }
  const prs=[];
  for(const e of exercises){ if(e.type==='cardio') continue;
    const prev=bestOf(e.exId, startedAt); if(!prev.any) continue;
    const now=setBests(e.sets);
    if(e.type==='hold'){ if(now.sec>prev.sec) prs.push({exId:e.exId,name:e.name,sec:now.sec,t:startedAt}); continue; }
    let top=null; for(const s of working(e.sets)){ const x=e1rm(s.w,s.r); if(!top||x>top.x) top={x,w:s.w,r:s.r}; }
    if(top && top.w>0 && top.x>prev.e1+0.01) prs.push({exId:e.exId,name:e.name,w:top.w,r:top.r,t:startedAt});
    else if(isBw(e) && now.reps0>prev.reps0 && prev.reps0>0) prs.push({exId:e.exId,name:e.name,w:0,r:now.reps0,t:startedAt});
  }
  const done={id:w.id,name:(w.name||'Workout').trim()||'Workout',startedAt,endedAt,exercises,prs};
  if(w.note&&w.note.trim()) done.note=w.note.trim();
  if(w.rest) done.rest=w.rest;
  if(w.src) done.src=w.src;
  const mode=w.mode;
  const skObj=w.src&&w.src.skill?SKILLS.find(x=>x.id===w.src.skill):null; const skPre=skObj?{wasMastered:skillMastery(skObj).done}:null;
  S.active=null; saveActive(); stopRest();
  await putWorkout(done); recomputePRs();
  if(mode){ S.openHist=done.id; location.hash='#history'; render(); return; }
  render(); openSheet({kind:'summary',w:done,skill:skPre,dropped});
}

/* rest timer */
let rest=null; // {end, total}
let audioCtx=null;
/* rough session length: time under work per set, the routine's rest between sets, ~90 s to move between exercises */
function estimateSec(r){
  const rest=r.rest||S.settings.rest||90; let t=0, moves=0; const list=r.exercises||[];
  list.forEach((x0,i)=>{
    const x=ensurePlan(JSON.parse(JSON.stringify(x0)));
    const linked = x.ss && list[i+1] && list[i+1].ss===x.ss;
    if(i<list.length-1 && !linked) moves++;
    if(x.type==='cardio'){ t+=x.plan.reduce((a,p)=>a+(num(p.min)||20)*60,0); return; }
    for(const p of x.plan) t += x.type==='hold' ? (num(p.sec)||30)+10 : Math.max(20,(num(p.r)||8)*3);
    if(!linked) t += x.plan.reduce((a,p,j)=>a+(j<x.plan.length-1?(p.wu?Math.min(60,rest):rest):0),0);
  });
  return t + moves*90;
}
function estText(r){ const sec=estimateSec(r); if(!sec) return ''; const m=Math.max(5,Math.round(sec/300)*5); return m>=60?`~${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`:`~${m} min`; }
/* this workout's rest: the routine's own if it has one, else the default */

function startRest(sec){ rest={end:Date.now()+sec*1000,total:sec,beeped:false}; document.getElementById('rest').hidden=false; document.body.classList.add('resting'); tick(); }

function beep(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{ if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,audioCtx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5);
    o.start(); o.stop(audioCtx.currentTime+0.55); }catch(e){}
}
function tick(){

/* ---------- export ---------- */
function csvCell(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildCsv(){
  const rows=[['Date','Start time','Workout','Duration (min)','Exercise','Superset','Set','Warm-up','Weight (kg)','Reps','Seconds','Minutes','Distance (km)','RPE','Vest (kg)','Bodyweight (kg)','Exercise note','Workout note']];
  for(const w of [...S.workouts].sort((a,b)=>a.startedAt-b.startedAt)){
    const d=new Date(w.startedAt), z=n=>String(n).padStart(2,'0'); const ss=ssInfo(w.exercises||[]); const b=bwAt(w.startedAt);
    (w.exercises||[]).forEach((e,i)=>{ let k=0; e.sets.forEach(s=>{
      rows.push([todayISO(w.startedAt), `${z(d.getHours())}:${z(d.getMinutes())}`, w.name, Math.round(((w.endedAt||w.startedAt)-w.startedAt)/60000), e.name, ss[i]?ss[i].L:'',
        s.wu?'W':++k, s.wu?'yes':'', e.type==='cardio'?'':(s.w??''), s.r??'', s.sec??'', s.min??'', s.km??'', s.rpe??'', e.vest??'', b??'', e.note||'', w.note||'']); }); });
  }
  return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
/* phones get the share sheet (Save to Files, Drive, email…); computers get a normal download */
async function offerFile(name, data){
  const type=name.endsWith('.csv')?'text/csv':'application/json';
  const blob=new Blob([data],{type});
  try{
    const file=new File([blob], name, {type});
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name}); return true;
    }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  try{
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); toast('Download started'); return true;
  }catch(e){ openSheet({kind:'export', name, data}); return false; }
}
function backupJson(){ return JSON.stringify({app:'GymBook', version:1, exported:new Date().toISOString(), workouts:S.workouts, routines:S.routines, bodyweight:S.bw, customExercises:S.custom, settings:S.settings}, null, 2); }
async function doBackup(){
  const ok=await offerFile(`gymbook-backup-${todayISO()}.json`, backupJson());
  if(ok){ S.settings.lastBackup=Date.now(); putSettings(); render(); }
}
/* ---------- import a backup (from the Claude version or this app) ---------- */
function importBackup(text){
  let d; try{ d=JSON.parse(text); }catch(e){ toast("That file isn't a GymBook backup."); return; }
  if(!d || typeof d!=='object' || !(Array.isArray(d.workouts)||Array.isArray(d.routines))){ toast("That file isn't a GymBook backup."); return; }
  const merge=(cur, inc, key)=>{ const map=new Map(cur.map(x=>[x[key],x])); let n=0; for(const x of (inc||[])){ if(x&&x[key]!=null){ if(!map.has(x[key])) n++; map.set(x[key], x); } } return [[...map.values()], n]; };
  let n1,n2,n3;
  [S.workouts,n1]=merge(S.workouts, (d.workouts||[]).filter(w=>w&&w.id&&isFinite(w.startedAt)), 'id');
  [S.routines,n2]=merge(S.routines, (d.routines||[]).filter(r=>r&&r.id&&Array.isArray(r.exercises)), 'id');
  [S.bw,n3]=merge(S.bw, (d.bodyweight||[]).filter(x=>x&&x.id&&isFinite(x.t)), 'id');
  [S.custom]=merge(S.custom, d.customExercises||[], 'id');
  if(d.settings && typeof d.settings==='object') S.settings=Object.assign({rest:90}, d.settings, {lastBackup:S.settings.lastBackup||d.settings.lastBackup});
  S.workouts.sort((a,b)=>b.startedAt-a.startedAt); S.bw.sort((a,b)=>a.t-b.t);
  recomputePRs();
  S.loaded={w:true,r:true}; saveLocalAll(); render();
  toast(`Imported ${n1} workout${n1===1?'':'s'}, ${n2} routine${n2===1?'':'s'}, ${n3} weigh-in${n3===1?'':'s'}`);
}

  const rs=[mk('push','Push',0,[['bench',4,6],['ohp',3,8],['incline-bench',3,10],['lat-raise',3,12],['tri-pushdown',3,12]]),
            mk('pull','Pull',1,[['deadlift',3,5],['pullup',3,8],['row',3,8],['face-pull',3,15],['db-curl',3,12]]),
            mk('legs','Legs',2,[['squat',4,6],['rdl',3,8],['leg-press',3,12],['leg-curl',3,12],['calf',4,15]])];

    case 'cx-del': { if(!armed(b,'Tap again to delete')) break; const id=sheet.id; S.custom=S.custom.filter(x=>x.id!==id); putCustom(); const back=sheet.back; if(back) openSheet(back); else closeSheet(); render(); break; }
    case 'clear-open': openSheet({kind:'clear', what:'history'}); break;
    case 'clear-what': sheet.what=b.dataset.v; renderSheet(); break;
    case 'clear-backup': await doBackup(); renderSheet(); break;
    case 'clear-go': { const v=(document.getElementById('clear-confirm')?.value||'').trim().toUpperCase(); if(v!=='DELETE') break; const what=sheet.what; clearData(what); closeSheet(); location.hash='#workout'; render(); toast(what==='all'?'Everything cleared':'Workout history cleared'); break; }
    case 'tour-open': openSheet({kind:'tour', i:0}); break;
    case 'tour-step': sheet.i=+b.dataset.v; renderSheet(); break;
    case 'tour-end': endTour(); break;
    case 'tour-do': { if(!S.settings.tour){ S.settings=Object.assign({},S.settings,{tour:1}); putSettings(); } const next=Math.min(TOUR.length-1,(sheet.i||0)+1); openSheet({kind:b.dataset.v, back:{kind:'tour', i:next}}); break; }
    case 'prog-filter': { const k=S.progKind==='skills'?'skills':'goals'; S.progFilter=Object.assign({},S.progFilter||{},{[k]:b.dataset.v}); render(); break; }
    case 'go-programmes': location.hash='#programmes'; break;
    case 'rt-reorder': S.rtReorder=!S.rtReorder; render(); break;
    case 'rt-move': { const list=S.routines; const k=list.findIndex(r=>r.id===b.dataset.id), d=+b.dataset.d; if(k<0) break; const key=rtKey(list[k]);
      let n=k+d; while(n>=0&&n<list.length&&rtKey(list[n])!==key) n+=d; if(n<0||n>=list.length) break;
      [list[k],list[n]]=[list[n],list[k]]; list.forEach((r,idx)=>{ if(r.order!==idx){ r.order=idx; putRoutine(r); } }); render(); break; }
    case 'go-library': location.hash='#library'; break;
    case 'lib-filter': S.libFilter=b.dataset.v; render(); break;
    case 'lib-open': openSheet({kind:'exinfo', id:b.dataset.id}); break;
    case 'addto-open': openSheet({kind:'addto', exId:b.dataset.id, back:sheet}); break;
    case 'addto-pick': { const ex=exById(sheet.exId), r=S.routines.find(x=>x.id===b.dataset.id); if(!ex||!r) break;
      const nr=JSON.parse(JSON.stringify(r)); nr.exercises.push(routineItem(ex)); putRoutine(nr); closeSheet(); render(); toast(`Added to ${r.name}`); break; }
    case 'addto-new': { const ex=exById(sheet.exId); if(!ex) break; openSheet({kind:'routine', r:{id:uid(),name:'',order:S.routines.length,exercises:[routineItem(ex)]}}); break; }
    case 'rt-group': { const k=b.dataset.k; S.settings=Object.assign({},S.settings,{rtGroups:Object.assign({},S.settings.rtGroups||{},{[k]:!rtGroupOpen(k)})}); putSettings(); render(); break; }
    case 'months-open': openSheet({kind:'months'}); break;
    case 'prs-open': openSheet({kind:'prs'}); break;
    case 'muscle-open': openSheet({kind:'muscle', g:b.dataset.g}); break;
    case 'ex-range': S.exRange=b.dataset.v; renderSheet(); break;
    case 'cal-toggle': { const open=S.settings.calOpen!==false; S.settings=Object.assign({},S.settings,{calOpen:!open}); S.calOff=0; putSettings(); render(); break; }
    case 'cal-nav': S.calOff=Math.min(0,(S.calOff||0)+(+b.dataset.d)); render(); break;
    case 'cal-day': { S.openHist=b.dataset.id; render(); const el=document.querySelector(`[data-act="hist-toggle"][data-id="${b.dataset.id}"]`); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); break; }
    case 'goal-open': openSheet({kind:'goal'}); break;
    case 'ex-more': { S.settings=Object.assign({},S.settings,{exAll:!S.settings.exAll}); S.exQ=''; putSettings(); render(); if(!S.settings.exAll) requestAnimationFrame(()=>document.getElementById('ex-list')?.scrollIntoView({block:'nearest'})); break; }
    case 'pv': { S.settings=Object.assign({},S.settings,{progView:b.dataset.v}); putSettings(); render(); window.scrollTo(0,0); break; }
    case 'rel-more': { S.settings=Object.assign({},S.settings,{relAll:!S.settings.relAll}); putSettings(); render(); break; }
    case 'lg-new': openSheet({kind:'lgoal'}); break;
    case 'lg-edit': openSheet({kind:'lgoal', id:b.dataset.id}); break;
    case 'lg-save': {
      const exId=document.getElementById('lg-ex').value; const m=exerciseStats().find(x=>x.exId===exId); const t=num(document.getElementById('lg-t').value); const err=document.getElementById('lg-err');
      if(!m||!(t>0)){ err.textContent='Enter a target above zero.'; err.hidden=false; break; }
      const u=goalUnit(m); const pts=goalPts(m,u); const best=pts.length?Math.max(...pts.map(p=>p.v)):0;
      const old=sheet.id?(S.settings.goals||[]).find(x=>x.id===sheet.id):null;
      if(t<=best && !(old&&old.target===t&&old.exId===exId)){ err.textContent=`You've already reached ${fmtGoal(best,u)}. Pick a higher target.`; err.hidden=false; break; }
      const g={id:old?old.id:uid(), exId, name:m.name, target:t, unit:u, at:old&&old.exId===exId&&old.target===t?old.at:Date.now()};
      const list=(S.settings.goals||[]).filter(x=>x.id!==g.id); list.push(g);
      S.settings=Object.assign({},S.settings,{goals:list}); putSettings(); closeSheet(); render(); break;
    }
    case 'lg-del': { if(!armed(b,'Remove?')) break; S.settings=Object.assign({},S.settings,{goals:(S.settings.goals||[]).filter(x=>x.id!==sheet.id)}); putSettings(); closeSheet(); render(); break; }
    case 'prog-restart': { if(!armed(b,'Restart?')) break; S.settings=Object.assign({},S.settings,{progStart:Object.assign({},S.settings.progStart||{},{[b.dataset.id]:Date.now()})}); putSettings(); renderSheet(); render(); break; }
    case 'goal-pick': { const v=+b.dataset.v; const st=Object.assign({},S.settings); if(v) st.weekGoal=v; else delete st.weekGoal; S.settings=st; putSettings(); closeSheet(); render(); break; }
    case 'howto': { const sb=document.querySelector('#sheet-root .sheet-b');
      let back=sheet; if(back&&back.kind==='howto') back=back.back; if(back&&sb) back._top=sb.scrollTop;
      openSheet({kind:'howto', id:b.dataset.id, back:back||null}); const nb=document.querySelector('#sheet-root .sheet-b'); if(nb) nb.scrollTop=0; break; }
    case 'how-back': { const back=sheet.back; openSheet(back); const nb=document.querySelector('#sheet-root .sheet-b'); if(nb&&back._top) nb.scrollTop=back._top; break; }
    case 'skill-reset': { const sk=SKILLS.find(x=>x.id===b.dataset.id); if(!sk) break;
      if(!armed(b,'Tap again: clears stages, passes and its routine')) break;
      const ids=resetSkill(sk); for(const id of ids) await delRoutine(id);
      sheet.open=null; renderSheet(); render(); break; }
    case 'stage-toggle': { const i=+b.dataset.i; sheet.open = (sheet.open!=null?sheet.open:Math.max(0,skillStage(sheet.id)))===i ? -1 : i; renderSheet(); break; }
    case 'stage-start': {
      const sk=SKILLS.find(x=>x.id===b.dataset.skill); const i=+b.dataset.i;
      if(sk && skillStage(sk.id)<0 && !preSummary(sk).all && !armed(b,'Prerequisites not met yet: tap again to start anyway')) break;
      const r=setSkillStage(b.dataset.skill, i); if(!r) break;
      if(b.dataset.close){ closeSheet(); } else { sheet.open=i; renderSheet(); }
      render(); toast(`${sk.title}: ${sk.stages[i].name} routine ready in Routines`); break;
    }
    case 'pre-tick': { const id=b.dataset.id; const d=Object.assign({},S.settings.preDone||{}); if(d[id]) delete d[id]; else d[id]=Date.now(); S.settings.preDone=d; putSettings(); renderSheet(); render(); break; }
    case 'skill-master': { const sk=SKILLS.find(x=>x.id===b.dataset.id); if(!sk) break;
      S.settings.skillsDone=Object.assign({},S.settings.skillsDone||{},{[sk.id]:Date.now()});
      S.settings.skills=Object.assign({},S.settings.skills||{},{[sk.id]:sk.stages.length-1}); putSettings(); renderSheet(); render(); break; }
    case 'skill-unmaster': { const sk=SKILLS.find(x=>x.id===b.dataset.id); if(!sk) break;
      const d=Object.assign({},S.settings.skillsDone||{}); delete d[sk.id]; S.settings.skillsDone=d; putSettings(); renderSheet(); render(); break; }
    case 'prog-add': {
      const p=PROGRAMS.find(x=>x.id===b.dataset.id); if(!p) break;
      p.sessions.forEach((se,k)=>{ const a=adaptList(se.ex);
        const old=S.routines.find(r=>r.src&&r.src.program===p.id&&r.src.session===k);
        putRoutine({id:old?old.id:uid(), name:`${p.title} · ${se.name}`, order:old?old.order:S.routines.length, rest:se.rest, exercises:cleanItems(a.items), src:{program:p.id, session:k}}); });
      closeSheet(); render(); toast(`${p.title}: ${p.sessions.length>1?p.sessions.length+' routines':'routine'} added`); break;
    }
    case 'prog-tab': S.progTab=b.dataset.v; render(); break;
    case 'prog-open': openSheet({kind:'exercise',exId:b.dataset.id}); break;

    case 'rt-new': openSheet({kind:'routine', r:{id:uid(),name:'',order:S.routines.length,exercises:[]}}); break;
    case 'rt-edit': { const r=S.routines.find(x=>x.id===b.dataset.id); if(r) openSheet({kind:'routine', r:JSON.parse(JSON.stringify(r))}); break; }
    case 'rt-add-ex': openSheet({kind:'picker',target:'routine',back:sheet}); break;
    case 'rt-ex-move': { const i=+b.closest('.rt-ex').dataset.i, j=i+(+b.dataset.d); const a=sheet.r.exercises; if(j<0||j>=a.length) break; [a[i],a[j]]=[a[j],a[i]]; const c=Object.assign({},sheet.coll||{}); [c[i],c[j]]=[c[j],c[i]]; sheet.coll=c; renderSheet(); requestAnimationFrame(()=>{ const el=document.querySelector(`.rt-ex[data-i="${j}"] [data-act="rt-ex-move"][data-d="${b.dataset.d}"]`)||document.querySelector(`.rt-ex[data-i="${j}"] [data-act="rt-ex-move"]`); if(el){ el.focus({preventScroll:true}); el.closest('.rt-ex').scrollIntoView({block:'nearest'}); } }); break; }
    case 'rt-ex-del': { const i=+b.closest('.rt-ex').dataset.i; sheet.r.exercises.splice(i,1); sheet.coll={}; renderSheet(); break; }
    case 'rt-set-add': { const x=ensurePlan(sheet.r.exercises[+b.closest('.rt-ex').dataset.i]); if(x.plan.length<20) x.plan.push(Object.assign({},x.plan[x.plan.length-1]||blankPlan(x.type))); renderSheet(); break; }
    case 'rt-set-del': { const x=sheet.r.exercises[+b.closest('.rt-ex').dataset.i]; x.plan.splice(+b.closest('.plan-row').dataset.j,1); renderSheet(); break; }
    case 'rt-save': {
      const r=sheet.r; const err=document.getElementById('rt-err');
      if(!r.name.trim()){ err.hidden=false; err.textContent='Give the routine a name.'; document.getElementById('rt-name').focus(); break; }
      if(!r.exercises.length){ err.hidden=false; err.textContent='Add at least one exercise.'; break; }
      r.name=r.name.trim(); r.exercises.forEach(x=>{ ensurePlan(x); x.sets=x.plan.length; x.reps=planReps(x); });
      await putRoutine(r); closeSheet(); render(); break;
    }
    case 'rt-del': { if(!armed(b,'Tap again to delete')) break; await delRoutine(sheet.r.id); closeSheet(); render(); break; }
    case 'rest-def': { S.settings.rest=Math.max(15,Math.min(600,(S.settings.rest||90)+(+b.dataset.d))); document.getElementById('rest-def').textContent=fmtDur(S.settings.rest*1000); putSettings(); break; }
  }
});
document.addEventListener('submit', async ev=>{
  const f=ev.target; if(!f.matches('[data-form="bw"]')) return; ev.preventDefault();
  const kg=num(document.getElementById('bw-kg').value); const ds=document.getElementById('bw-date').value||todayISO();
  if(!(kg>20&&kg<400)){ toast('Enter your weight in kg, e.g. 80.5'); document.getElementById('bw-kg').focus(); return; }
  const t=new Date(ds+'T12:00').getTime();
  await putBw({id:'d'+ds, t, kg:Math.round(kg*10)/10}); render();
  /* the card already shows the newest weigh-in; only confirm an older date, which doesn't appear there */
  if(S.bw.length && S.bw[S.bw.length-1].t!==t) toast(`Logged ${fmtKg(Math.round(kg*10)/10)} kg for ${shortDate(t)}`);
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && sheet) closeSheet(); });
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

/* ---------- installing and offline ---------- */
let installPrompt=null, swWaiting=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installPrompt=e; });
document.addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-act="install-now"]'); if(!b||!installPrompt) return;
  installPrompt.prompt(); try{ await installPrompt.userChoice; }catch(e){} installPrompt=null; closeSheet();
});
document.addEventListener('change', ev=>{
  if(ev.target.id!=='import-file') return; const f=ev.target.files&&ev.target.files[0]; ev.target.value='';
  if(!f) return; const rd=new FileReader(); rd.onload=()=>importBackup(String(rd.result)); rd.onerror=()=>toast("Couldn't read that file."); rd.readAsText(f);
});
function showUpdate(){ const r=document.getElementById('update-root'); r.innerHTML=`<div class="toast update" role="status"><span>A new version of GymBook is ready.</span><button type="button" class="btn" data-act="sw-reload">Reload</button></div>`; }
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting && navigator.serviceWorker.controller){ swWaiting=reg.waiting; showUpdate(); }
      reg.addEventListener('updatefound', ()=>{ const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange', ()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller){ swWaiting=nw; showUpdate(); } }); });
      setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
      /* iPhone home-screen apps usually resume rather than reload, so also check for updates each time GymBook comes back on screen */
      let lastCheck=Date.now();
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && Date.now()-lastCheck>30000){ lastCheck=Date.now(); reg.update().catch(()=>{}); } });
    }).catch(e=>console.warn('Offline support unavailable', e));
    /* reload only when an update takes over, not when the app is installed for the first time */
    let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(reloaded||!hadController) return; reloaded=true; location.reload(); });
  });
}
/* ask the browser not to clear our data when storage runs low */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist(); }); }catch(e){}

boot();
})();
</script>
